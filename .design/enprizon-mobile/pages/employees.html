<body>
  <div class="device-frame" data-dom-id="device-frame">

    <!-- Period Bar -->
    <div class="period-bar" data-dom-id="period-bar">
      <span class="month-label">2026年8月</span>
      <span>&nbsp;&middot;&nbsp;Lind Mining</span>
    <button class="lang-switch" data-dom-id="lang-switch" aria-label="切换语言">
      <span class="lang-option active" data-lang="zh">中</span>
      <span class="lang-sep">/</span>
      <span class="lang-option" data-lang="en">EN</span>
    </button>
    </div>

    <!-- Segmented Control -->
    <div class="segmented-control" data-dom-id="emp-segmented-control" role="tablist" aria-label="员工视图切换">
      <button class="segment active" role="tab" aria-selected="true" data-dom-id="emp-tab-list">员工列表</button>
      <button class="segment" role="tab" aria-selected="false" data-dom-id="emp-tab-pending">待审(3)</button>
      <button class="segment" role="tab" aria-selected="false" data-dom-id="emp-tab-approved">已审批</button>
    </div>

    <!-- Search Bar -->
    <div class="search-bar-wrap" data-dom-id="emp-search-bar">
      <label class="search-field">
        <span class="search-icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/>
            <path d="M20 20L16.65 16.65" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </span>
        <input type="search" placeholder="搜索员工..." aria-label="搜索员工">
      </label>
    </div>

    <!-- Content Area -->
    <div class="content-area" data-dom-id="emp-content-area">

      <!-- ============ Employee List View ============ -->
      <div id="view-employee-list" style="display:flex;flex-direction:column;">

        <!-- Employee Card List (dynamic) -->
        <div class="emp-list" id="emp-card-list" role="list" aria-label="员工列表"></div>

        <!-- Skeleton Loading -->
        <div class="emp-list" id="emp-skeleton" role="status" aria-label="加载中" style="display:none;">
          <div class="skeleton-card"><div class="skeleton-avatar"></div><div class="skeleton-lines"><div class="skeleton-line w-60"></div><div class="skeleton-line w-40"></div></div></div>
          <div class="skeleton-card"><div class="skeleton-avatar"></div><div class="skeleton-lines"><div class="skeleton-line w-50"></div><div class="skeleton-line w-30"></div></div></div>
          <div class="skeleton-card"><div class="skeleton-avatar"></div><div class="skeleton-lines"><div class="skeleton-line w-55"></div><div class="skeleton-line w-35"></div></div></div>
        </div>

        <!-- Error State -->
        <div id="emp-error" class="empty-state" style="display:none;">
          <div class="empty-icon">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5"/><path d="M12 8v4M12 16h.01" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </div>
          <div class="empty-title">加载失败</div>
          <div class="empty-desc" id="emp-error-msg">无法获取员工数据</div>
          <button class="btn primary" type="button" id="emp-retry-btn" style="max-width:180px;margin:0 auto;">重试</button>
        </div>

        <!-- Empty State -->
        <div id="emp-empty" class="empty-state" style="display:none;">
          <div class="empty-icon">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M20 20L16.65 16.65" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </div>
          <div class="empty-title">暂无员工数据</div>
          <div class="empty-desc">请先导入员工信息</div>
        </div>

        <!-- List Footer -->
        <div class="emp-list-footer" id="emp-list-footer">显示 0 人</div>
      </div>

      <!-- Section Divider -->
      <div class="section-divider" aria-hidden="true"></div>

      <!-- ============ Employee Profile Detail ============ -->
      <div id="view-profile-detail" style="display:none;flex-direction:column;">

        <!-- Profile Header -->
        <div class="profile-header">
          <button class="back-btn" aria-label="返回员工列表" id="profile-back-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <path d="M15 6L9 12L15 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <span class="profile-title">员工档案</span>
        </div>

        <!-- Profile Identity -->
        <div class="profile-identity">
          <div class="profile-avatar-lg" id="profile-avatar-lg" aria-hidden="true"></div>
          <div class="profile-name-lg" id="profile-name-lg"></div>
          <div class="profile-ids" id="profile-ids"></div>
        </div>

        <!-- Basic Info Section -->
        <div class="info-section">
          <div class="info-section-title">基本信息</div>
          <div id="profile-basic-info"></div>
        </div>

        <!-- Attendance Stats -->
        <div class="attendance-stats">
          <div class="info-section-title">出勤统计 (本月)</div>
          <div class="mini-card-row" id="profile-attendance-stats"></div>
        </div>

        <!-- Salary Overview -->
        <div class="salary-overview">
          <div class="info-section-title">薪资概览 (本月)</div>
          <div id="profile-salary-overview"></div>
        </div>

        <!-- Edit Button -->
        <div class="profile-actions">
          <button class="btn primary" type="button" id="profile-edit-btn">编辑档案</button>
        </div>
      </div>

      <!-- Section Divider -->
      <div class="section-divider" aria-hidden="true"></div>

      <!-- ============ OA Approval Sub-page ============ -->
      <div id="view-oa-pending" style="display:none;flex-direction:column;">

        <!-- OA Header -->
        <div class="oa-header">
          <span class="oa-title">待审批</span>
          <span class="oa-badge" id="oa-pending-count" aria-label="0条待审批">0</span>
        </div>

  .lang-switch {

  /* ── Utility ── */

  /* ── Skeleton Loading ── */
  @keyframes skeleton-pulse {

  /* ── Modal Overlay ── */
  .modal-overlay {

</style>
<script>
(function() {
  'use strict';

  /* ================================================================
   * STATE
   * ================================================================ */
  var state = {
    employees: [],
    filteredEmployees: [],
    pendingItems: [],
    pendingCount: 0,
    historyItems: [],
    currentTab: 'list',       // 'list' | 'pending' | 'approved'
    currentView: 'list',      // 'list' | 'profile'
    selectedEmployee: null,
    searchQuery: '',
    searchTimer: null
  };

  /* ================================================================
   * DOM REFS
   * ================================================================ */
  var $ = function(id) { return document.getElementById(id); };

  var dom = {
    // views
    viewEmployeeList: $('view-employee-list'),
    viewProfile: $('view-profile-detail'),
    viewOaPending: $('view-oa-pending'),
    viewOaHistory: $('view-oa-history'),

    // employee list
    empCardList: $('emp-card-list'),
    empSkeleton: $('emp-skeleton'),
    empError: $('emp-error'),
    empErrorMsg: $('emp-error-msg'),
    empEmpty: $('emp-empty'),
    empFooter: $('emp-list-footer'),
    empRetry: $('emp-retry-btn'),

    // search
    searchInput: document.querySelector('.search-field input'),

    // segmented control
    segList: document.querySelector('[data-dom-id="emp-tab-list"]'),
    segPending: document.querySelector('[data-dom-id="emp-tab-pending"]'),
    segApproved: document.querySelector('[data-dom-id="emp-tab-approved"]'),

    // profile
    profileAvatar: $('profile-avatar-lg'),
    profileName: $('profile-name-lg'),
    profileIds: $('profile-ids'),
    profileBasicInfo: $('profile-basic-info'),
    profileAttendance: $('profile-attendance-stats'),
    profileSalary: $('profile-salary-overview'),
    profileBack: $('profile-back-btn'),
    profileEdit: $('profile-edit-btn'),

    // OA pending
    oaPendingList: $('oa-pending-list'),
    oaPendingCount: $('oa-pending-count'),
    oaPendingSkeleton: $('oa-pending-skeleton'),
    oaPendingError: $('oa-pending-error'),
    oaPendingErrorMsg: $('oa-pending-error-msg'),
    oaPendingEmpty: $('oa-pending-empty'),
    oaPendingRetry: $('oa-pending-retry-btn'),

    // OA history
    oaHistoryList: $('oa-history-list'),
    oaHistorySkeleton: $('oa-history-skeleton'),
    oaHistoryError: $('oa-history-error'),
    oaHistoryErrorMsg: $('oa-history-error-msg'),
    oaHistoryEmpty: $('oa-history-empty'),
    oaHistoryRetry: $('oa-history-retry-btn'),

    // modals
    editModal: $('edit-modal-overlay'),
    editModalBody: $('edit-modal-body'),
    rejectModal: $('reject-modal-overlay'),
    rejectReason: $('reject-reason-input'),
    rejectEventId: null
  };

  /* ================================================================
   * API HELPERS
   * ================================================================ */
  function apiFetch(url, opts) {
    opts = opts || {};
    opts.credentials = 'same-origin';
    opts.headers = opts.headers || {};
    if (opts.body && typeof opts.body === 'object' && !(opts.body instanceof FormData)) {
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(opts.body);
    }
    return fetch(url, opts).then(function(res) {
      if (res.status === 401) {
        showLoginBanner();
        throw new Error('Unauthorized');
      }
      if (!res.ok) {
        return res.text().then(function(txt) {
          var msg;
          try { msg = JSON.parse(txt).error || txt; } catch(e) { msg = txt; }
          throw new Error(msg || ('HTTP ' + res.status));
        });
      }
      return res.json();
    });
  }

  function getApi(path) {
    return apiFetch(path);
  }

  function postApi(path, body) {
    return apiFetch(path, { method: 'POST', body: body });
  }

  /* ================================================================
   * VIEW MANAGEMENT
   * ================================================================ */
  function showView(name) {
    // hide all views
    dom.viewEmployeeList.style.display = 'none';
    dom.viewProfile.style.display = 'none';
    dom.viewOaPending.style.display = 'none';
    dom.viewOaHistory.style.display = 'none';

    if (name === 'list') {
      dom.viewEmployeeList.style.display = 'flex';
      state.currentView = 'list';
      state.selectedEmployee = null;
    } else if (name === 'profile') {
      dom.viewProfile.style.display = 'flex';
      state.currentView = 'profile';
    } else if (name === 'pending') {
      dom.viewOaPending.style.display = 'flex';
      updateSegmentedControl('pending');
    } else if (name === 'approved') {
      dom.viewOaHistory.style.display = 'flex';
      updateSegmentedControl('approved');
    }
  }

  function updateSegmentedControl(active) {
    var segs = [dom.segList, dom.segPending, dom.segApproved];
    var vals = ['list', 'pending', 'approved'];
    segs.forEach(function(seg, i) {
      if (vals[i] === active) {
        seg.classList.add('active');
        seg.setAttribute('aria-selected', 'true');
      } else {
        seg.classList.remove('active');
        seg.setAttribute('aria-selected', 'false');
      }
    });
    state.currentTab = active;
  }

  function showLoginBanner() {
    dom.viewEmployeeList.style.display = 'none';
    dom.viewProfile.style.display = 'none';
    dom.viewOaPending.style.display = 'none';
    dom.viewOaHistory.style.display = 'none';

    dom.viewEmployeeList.style.display = 'flex';
    dom.empCardList.innerHTML = '';
    dom.empSkeleton.style.display = 'none';
    dom.empError.style.display = 'none';
    dom.empEmpty.style.display = 'none';

    var banner = document.createElement('div');
    banner.className = 'login-banner';
    banner.innerHTML = '<div class="empty-icon"><svg width="40" height="40" viewBox="0 0 24 24" fill="none"><rect x="3" y="11" width="18" height="11" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 11V7a5 5 0 0110 0v4" stroke="currentColor" stroke-width="1.5"/></svg></div><div class="empty-title">请先登录</div><div class="empty-desc">需要登录后才能查看员工数据</div>';
    dom.empCardList.appendChild(banner);
    dom.empFooter.textContent = '';
  }

  /* ================================================================
   * EVENT TYPE LABELS
   * ================================================================ */
  function getEventTypeLabel(type) {
    var map = {
      'transfer': '调岗',
      'leave': '请假',
      'hire': '入职',
      'salary_change': '薪资变更',
      'resign': '离职',
      'sick': '病假'
    };
    return map[type] || type || '未知';
  }

  function getSalaryTypeLabel(type) {
    var map = {
      'piece_underground': '井下计件',
      'piece_driller': '钻工计件',
      'piece_crush': '破碎计件',
      'day_rate': '日薪',
      'monthly': '月薪'
    };
    return map[type] || type || '未知';
  }

  /* ================================================================
   * EMPLOYEE LIST
   * ================================================================ */
  function loadEmployees() {
    // show skeleton
    dom.empCardList.innerHTML = '';
    dom.empSkeleton.style.display = '';
    dom.empError.style.display = 'none';
    dom.empEmpty.style.display = 'none';
    dom.empFooter.textContent = '';

    getApi('/employees').then(function(data) {
      dom.empSkeleton.style.display = 'none';

      if (!data || !Array.isArray(data)) {
        data = [];
      }

      state.employees = data;
      state.filteredEmployees = data;
      applySearch();
    }).catch(function(err) {
      dom.empSkeleton.style.display = 'none';
      if (err.message === 'Unauthorized') return;
      dom.empError.style.display = '';
      dom.empErrorMsg.textContent = err.message || '无法获取员工数据';
      dom.empCardList.innerHTML = '';
      dom.empFooter.textContent = '';
    });
  }

  function applySearch() {
    var q = state.searchQuery.toLowerCase().trim();
    if (!q) {
      state.filteredEmployees = state.employees;
    } else {
      state.filteredEmployees = state.employees.filter(function(emp) {
        var fields = [
          emp.name || '',
          emp.en_name || '',
          emp.alias || '',
          emp.custom_number || '',
          emp.employee_id || ''
        ];
        return fields.some(function(f) {
          return f.toLowerCase().indexOf(q) !== -1;
        });
      });
    }
    renderEmployeeCards();
  }

  function renderEmployeeCards() {
    var list = state.filteredEmployees;
    var html = '';

    if (list.length === 0) {
      dom.empCardList.innerHTML = '';
      dom.empEmpty.style.display = '';
      dom.empFooter.textContent = '显示 0 人';
      return;
    }

    dom.empEmpty.style.display = 'none';

    list.forEach(function(emp) {
      var avatarText = (emp.name || '?').charAt(0);
      var displayName = (emp.name || '') + (emp.en_name ? ' ' + emp.en_name : '');
      var aliasHtml = emp.alias ? '<span class="emp-alias">别名: ' + escapeHtml(emp.alias) + '</span>' : '';
      var idLabel = emp.custom_number || emp.employee_id || '';
      var teamLabel = emp.team || emp.department || '';

      html += '<div class="emp-card" role="listitem" tabindex="0" data-emp-id="' + escapeHtml(emp.employee_id) + '">';
      html += '<div class="emp-avatar" aria-hidden="true">' + escapeHtml(avatarText) + '</div>';
      html += '<div class="emp-info">';
      html += '<div class="emp-name">' + escapeHtml(displayName) + ' ' + aliasHtml + '</div>';
      html += '<div class="emp-meta">';
      if (idLabel) html += '<span>工号: ' + escapeHtml(idLabel) + '</span>';
      if (idLabel && teamLabel) html += '<span class="meta-sep" aria-hidden="true"></span>';
      if (teamLabel) html += '<span>' + escapeHtml(teamLabel) + '</span>';
      html += '</div></div>';
      html += '<div class="chevron" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>';
      html += '</div>';
    });

    dom.empCardList.innerHTML = html;
    dom.empFooter.textContent = '显示 ' + list.length + ' 人';

    // bind click events
    var cards = dom.empCardList.querySelectorAll('.emp-card');
    cards.forEach(function(card) {
      card.addEventListener('click', function() {
        var empId = card.getAttribute('data-emp-id');
        showEmployeeProfile(empId);
      });
    });
  }

  /* ================================================================
   * EMPLOYEE PROFILE
   * ================================================================ */
  function showEmployeeProfile(empId) {
    var emp = state.employees.find(function(e) { return e.employee_id === empId; });
    if (!emp) {
      emp = state.filteredEmployees.find(function(e) { return e.employee_id === empId; });
    }
    if (!emp) return;

    state.selectedEmployee = emp;
    showView('profile');

    // avatar
    var avatarText = emp.gender === '女' ? '女' : (emp.name || '?').charAt(0);
    dom.profileAvatar.textContent = avatarText;

    // name
    dom.profileName.textContent = (emp.name || '') + (emp.en_name ? ' ' + emp.en_name : '');

    // ids
    var idsHtml = '';
    if (emp.alias) idsHtml += '<span class="profile-id-tag">别名: ' + escapeHtml(emp.alias) + '</span>';
    if (emp.custom_number) idsHtml += '<span class="profile-id-tag">工号: ' + escapeHtml(emp.custom_number) + '</span>';
    if (!emp.alias && !emp.custom_number && emp.employee_id) idsHtml += '<span class="profile-id-tag">工号: ' + escapeHtml(emp.employee_id) + '</span>';
    dom.profileIds.innerHTML = idsHtml;

    // basic info
    var infoRows = [
      { key: '部门', val: emp.department || '-' },
      { key: '班组', val: emp.team || '-' },
      { key: '岗位', val: emp.position || '-' },
      { key: '性别', val: emp.gender || '-' },
      { key: '出生日期', val: emp.date_of_birth || '-' },
      { key: '电话', val: emp.phone || '-' },
      { key: 'NIDA', val: emp.nida || '-' },
      { key: 'NSSF', val: emp.nssf || '-' },
      { key: '银行', val: emp.bank || '-' },
      { key: '薪资类别', val: getSalaryTypeLabel(emp.salary_type) }
    ];
    var infoHtml = '';
    infoRows.forEach(function(row) {
      infoHtml += '<div class="info-row"><span class="info-key">' + escapeHtml(row.key) + '</span><span class="info-value">' + escapeHtml(row.val) + '</span></div>';
    });
    dom.profileBasicInfo.innerHTML = infoHtml;

    // attendance stats (placeholder)
    dom.profileAttendance.innerHTML = [
      '<div class="mini-stat-card"><span class="stat-value">-</span><span class="stat-label">出勤</span></div>',
      '<div class="mini-stat-card"><span class="stat-value">-</span><span class="stat-label">请假</span></div>',
      '<div class="mini-stat-card"><span class="stat-value">-</span><span class="stat-label">旷工</span></div>'
    ].join('');

    // salary overview (placeholder)
    dom.profileSalary.innerHTML = [
      '<div class="info-row"><span class="info-key">应发</span><span class="info-value">-</span></div>',
      '<div class="info-row"><span class="info-key">实发</span><span class="info-value">-</span></div>'
    ].join('');

    // scroll to top
    var contentArea = document.querySelector('.content-area');
    if (contentArea) contentArea.scrollTop = 0;
  }

  /* ================================================================
   * EDIT PROFILE MODAL
   * ================================================================ */
  function openEditModal() {
    var emp = state.selectedEmployee;
    if (!emp) return;

    var fields = [
      { key: 'department', label: '部门', val: emp.department || '' },
      { key: 'team', label: '班组', val: emp.team || '' },
      { key: 'position', label: '岗位', val: emp.position || '' },
      { key: 'phone', label: '电话', val: emp.phone || '' },
      { key: 'nida', label: 'NIDA', val: emp.nida || '' },
      { key: 'nssf', label: 'NSSF', val: emp.nssf || '' },
      { key: 'bank', label: '银行', val: emp.bank || '' },
      { key: 'alias', label: '别名', val: emp.alias || '' }
    ];

    var html = '';
    fields.forEach(function(f) {
      html += '<label class="modal-label">' + escapeHtml(f.label) + '</label>';
      html += '<input class="modal-input" type="text" data-field="' + f.key + '" value="' + escapeHtml(f.val) + '">';
    });

    dom.editModalBody.innerHTML = html;
    dom.editModal.style.display = 'flex';
  }

  function closeEditModal() {
    dom.editModal.style.display = 'none';
  }

  function saveEditProfile() {
    var emp = state.selectedEmployee;
    if (!emp) return;

    var inputs = dom.editModalBody.querySelectorAll('.modal-input');
    var payload = {};
    inputs.forEach(function(inp) {
      payload[inp.getAttribute('data-field')] = inp.value;
    });

    postApi('/employees/update', { employee_id: emp.employee_id, updates: payload }).then(function() {
      closeEditModal();
      // refresh local state
      Object.keys(payload).forEach(function(k) {
        if (emp.hasOwnProperty(k)) emp[k] = payload[k];
      });
      // re-render profile
      showEmployeeProfile(emp.employee_id);
      // also refresh the employee list behind
      loadEmployees();
    }).catch(function(err) {
      alert('保存失败: ' + (err.message || '未知错误'));
    });
  }

  /* ================================================================
   * OA PENDING
   * ================================================================ */
  function loadOaPending() {
    dom.oaPendingList.innerHTML = '';
    dom.oaPendingSkeleton.style.display = '';
    dom.oaPendingError.style.display = 'none';
    dom.oaPendingEmpty.style.display = 'none';

    getApi('/api/oa/pending').then(function(data) {
      dom.oaPendingSkeleton.style.display = 'none';

      if (!data || !Array.isArray(data) || data.length === 0) {
        state.pendingItems = [];
        state.pendingCount = 0;
        dom.oaPendingEmpty.style.display = '';
        dom.oaPendingCount.textContent = '0';
        dom.oaPendingCount.setAttribute('aria-label', '0条待审批');
        updatePendingBadge(0);
        return;
      }

      state.pendingItems = data;
      state.pendingCount = data.length;
      dom.oaPendingCount.textContent = data.length;
      dom.oaPendingCount.setAttribute('aria-label', data.length + '条待审批');
      updatePendingBadge(data.length);
      renderOaPendingCards(data);
    }).catch(function(err) {
      dom.oaPendingSkeleton.style.display = 'none';
      if (err.message === 'Unauthorized') return;
      dom.oaPendingError.style.display = '';
      dom.oaPendingErrorMsg.textContent = err.message || '无法获取审批数据';
      state.pendingCount = 0;
      dom.oaPendingCount.textContent = '0';
      updatePendingBadge(0);
    });
  }

  function updatePendingBadge(count) {
    if (count > 0) {
      dom.segPending.textContent = '待审(' + count + ')';
    } else {
      dom.segPending.textContent = '待审';
    }
  }

  function renderOaPendingCards(items) {
    var html = '';
    items.forEach(function(item) {
      var typeLabel = getEventTypeLabel(item.event_type || item.type);
      var name = item.name || item.employee_name || item.employee_id || '未知';
      var desc = item.description || item.detail || '';
      var date = item.created_at || item.date || '';
      if (date && date.length > 10) date = date.substring(0, 10);

      html += '<div class="oa-card" data-event-id="' + escapeHtml(item.event_id || item.id) + '">';
      html += '<div class="oa-card-head">';
      html += '<span class="oa-card-title">' + escapeHtml(typeLabel) + '申请 - ' + escapeHtml(name) + '</span>';
      if (desc) html += '<span class="oa-card-desc">' + escapeHtml(desc) + '</span>';
      if (date) html += '<span class="oa-card-date">' + escapeHtml(date) + '</span>';
      html += '</div>';
      html += '<div class="oa-card-actions">';
      html += '<button class="btn secondary oa-approve-btn" type="button">批准</button>';
      html += '<button class="btn ghost oa-reject-btn" type="button">拒绝</button>';
      html += '</div>';
      html += '</div>';
    });

    dom.oaPendingList.innerHTML = html;

    // bind approve buttons
    dom.oaPendingList.querySelectorAll('.oa-approve-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var card = btn.closest('.oa-card');
        var eventId = card.getAttribute('data-event-id');
        approveOa(eventId, 'approve');
      });
    });

    // bind reject buttons
    dom.oaPendingList.querySelectorAll('.oa-reject-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var card = btn.closest('.oa-card');
        var eventId = card.getAttribute('data-event-id');
        openRejectModal(eventId);
      });
    });
  }

  function approveOa(eventId, action, reason) {
    var body = { event_id: eventId, action: action };
    if (reason) body.reason = reason;

    postApi('/api/oa/approve', body).then(function() {
      loadOaPending();
      loadOaHistory();
    }).catch(function(err) {
      alert('操作失败: ' + (err.message || '未知错误'));
    });
  }

  function openRejectModal(eventId) {
    dom.rejectEventId = eventId;
    dom.rejectReason.value = '';
    dom.rejectModal.style.display = 'flex';
  }

  function closeRejectModal() {
    dom.rejectModal.style.display = 'none';
    dom.rejectEventId = null;
  }

  function confirmReject() {
    if (!dom.rejectEventId) return;
    var reason = dom.rejectReason.value.trim();
    if (!reason) {
      alert('请填写拒绝原因');
      return;
    }
    approveOa(dom.rejectEventId, 'reject', reason);
    closeRejectModal();
  }

  /* ================================================================
   * OA HISTORY
   * ================================================================ */
  function loadOaHistory() {
    dom.oaHistoryList.innerHTML = '';
    dom.oaHistorySkeleton.style.display = '';
    dom.oaHistoryError.style.display = 'none';
    dom.oaHistoryEmpty.style.display = 'none';

    getApi('/api/oa/history').then(function(data) {
      dom.oaHistorySkeleton.style.display = 'none';

      if (!data || !Array.isArray(data) || data.length === 0) {
        state.historyItems = [];
        dom.oaHistoryEmpty.style.display = '';
        return;
      }

      state.historyItems = data;
      renderOaHistoryCards(data);
    }).catch(function(err) {
      dom.oaHistorySkeleton.style.display = 'none';
      if (err.message === 'Unauthorized') return;
      dom.oaHistoryError.style.display = '';
      dom.oaHistoryErrorMsg.textContent = err.message || '无法获取历史记录';
    });
  }

  function renderOaHistoryCards(items) {
    var html = '';
    items.forEach(function(item) {
      var typeLabel = getEventTypeLabel(item.event_type || item.type);
      var name = item.name || item.employee_name || item.employee_id || '未知';
      var status = item.status || '';
      var date = item.created_at || item.date || '';
      if (date && date.length > 10) date = date.substring(0, 10);

      var statusClass = status === 'approved' ? 'approved' : 'rejected';
      var statusLabel = status === 'approved' ? '已批准' : (status === 'rejected' ? '已拒绝' : status);

      html += '<div class="oa-history-card">';
      html += '<div class="oa-history-title">' + escapeHtml(typeLabel) + ' - ' + escapeHtml(name) + '</div>';
      html += '<div class="oa-history-meta">';
      if (date) html += '<span>' + escapeHtml(date) + '</span>';
      html += '<span class="oa-status-badge ' + statusClass + '">' + escapeHtml(statusLabel) + '</span>';
      html += '</div>';
      html += '</div>';
    });

    dom.oaHistoryList.innerHTML = html;
  }

  /* ================================================================
   * SEARCH
   * ================================================================ */
  function onSearchInput() {
    clearTimeout(state.searchTimer);
    state.searchTimer = setTimeout(function() {
      state.searchQuery = dom.searchInput.value;
      applySearch();
    }, 300);
  }

  /* ================================================================
   * UTILITY
   * ================================================================ */
  function escapeHtml(str) {
    if (!str) return '';
    str = String(str);
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /* ================================================================
   * EVENT BINDING
   * ================================================================ */
  function bindEvents() {
    // segmented control
    dom.segList.addEventListener('click', function() {
      showView('list');
      updateSegmentedControl('list');
    });
    dom.segPending.addEventListener('click', function() {
      showView('pending');
      loadOaPending();
    });
    dom.segApproved.addEventListener('click', function() {
      showView('approved');
      loadOaHistory();
    });

    // search
    if (dom.searchInput) {
      dom.searchInput.addEventListener('input', onSearchInput);
    }

    // profile back
    dom.profileBack.addEventListener('click', function() {
      showView('list');
      updateSegmentedControl('list');
    });

    // profile edit
    dom.profileEdit.addEventListener('click', openEditModal);

    // edit modal
    $('edit-modal-close').addEventListener('click', closeEditModal);
    $('edit-modal-cancel').addEventListener('click', closeEditModal);
    $('edit-modal-save').addEventListener('click', saveEditProfile);
    dom.editModal.addEventListener('click', function(e) {
      if (e.target === dom.editModal) closeEditModal();
    });

    // reject modal
    $('reject-modal-close').addEventListener('click', closeRejectModal);
    $('reject-modal-cancel').addEventListener('click', closeRejectModal);
    $('reject-modal-confirm').addEventListener('click', confirmReject);
    dom.rejectModal.addEventListener('click', function(e) {
      if (e.target === dom.rejectModal) closeRejectModal();
    });

    // retry buttons
    dom.empRetry.addEventListener('click', function() {
      loadEmployees();
    });
    dom.oaPendingRetry.addEventListener('click', function() {
      loadOaPending();
    });
    dom.oaHistoryRetry.addEventListener('click', function() {
      loadOaHistory();
    });
  }

  /* ================================================================
   * I18N
   * ================================================================ */
  var LANG = (function(){
    var stored = localStorage.getItem('enprizon_lang') || 'zh';
    var dict = {
      zh: {
        dashboard: '数据台', employees_tab: '员工', collection: '采集', attendance: '考勤', salary: '薪资',
        emp_list: '员工列表', emp_pending: '待审', emp_approved: '已审批',
        search_placeholder: '搜索员工...', no_employees: '暂无员工数据', no_pending: '暂无待审批事项',
        no_history: '暂无审批记录', show_n: '显示 {n} 人', loading: '加载中...',
        error: '加载失败', retry: '重试', login_required: '请先登录',
        dept: '部门', team: '班组', position: '岗位', gender: '性别', dob: '出生日期',
        phone: '电话', nida: 'NIDA', nssf: 'NSSF', bank: '银行', salary_type: '薪资类别',
        attendance_stats: '出勤统计', salary_overview: '薪资概览', edit: '编辑',
        approve: '批准', reject: '拒绝', reject_reason: '拒绝原因',
        save: '保存', cancel: '取消', back: '← 返回'
      },
      en: {
        dashboard: 'Dashboard', employees_tab: 'Employees', collection: 'Collection', attendance: 'Attendance', salary: 'Salary',
        emp_list: 'Employees', emp_pending: 'Pending', emp_approved: 'Approved',
        search_placeholder: 'Search employees...', no_employees: 'No employees', no_pending: 'No pending approvals',
        no_history: 'No history', show_n: 'Showing {n}', loading: 'Loading...',
        error: 'Load Failed', retry: 'Retry', login_required: 'Please login first',
        dept: 'Department', team: 'Team', position: 'Position', gender: 'Gender', dob: 'Date of Birth',
        phone: 'Phone', nida: 'NIDA', nssf: 'NSSF', bank: 'Bank', salary_type: 'Salary Type',
        attendance_stats: 'Attendance', salary_overview: 'Salary Overview', edit: 'Edit',
        approve: 'Approve', reject: 'Reject', reject_reason: 'Reason',
        save: 'Save', cancel: 'Cancel', back: '← Back'
      }
    };
    function t(key){ return (dict[stored]||dict.zh)[key] || key; }
    function setLang(lang){
      stored = lang;
      localStorage.setItem('enprizon_lang', lang);
      applyLang();
    }
    function applyLang(){
      // Update tab labels
      var tabLabels = document.querySelectorAll('.tab-item-label');
      var tabKeys = ['dashboard','employees_tab','collection','attendance','salary'];
      tabLabels.forEach(function(el,i){ if(tabKeys[i]) el.textContent = t(tabKeys[i]); });
      // Update lang switch
      document.querySelectorAll('.lang-option').forEach(function(o){
        o.classList.toggle('active', o.dataset.lang === stored);
      });
      // Update segmented control
      var segs = document.querySelectorAll('.segment');
      var segKeys = ['emp_list','emp_pending','emp_approved'];
      segs.forEach(function(el,i){
        if(segKeys[i]){
          var txt = t(segKeys[i]);
          // Preserve badge count if any
          var badge = el.querySelector('.badge');
          if(badge) txt += ' (' + badge.textContent + ')';
          el.textContent = txt;
        }
      });
      // Update search placeholder
      var searchInput = document.querySelector('.search-field input');
      if(searchInput) searchInput.placeholder = t('search_placeholder');
      // Update page title
      var h1 = document.querySelector('h1');
      if(h1) h1.textContent = t('employees_tab');
    }
    document.addEventListener('DOMContentLoaded', function(){
      var sw = document.querySelector('[data-dom-id="lang-switch"]');
      if(sw){
        sw.addEventListener('click', function(){
          setLang(stored === 'zh' ? 'en' : 'zh');
        });
      }
      applyLang();
    });
    return { t: t, setLang: setLang, current: stored };
  })();

  /* ================================================================
   * INIT
   * ================================================================ */
  function init() {
    bindEvents();
    showView('list');
    updateSegmentedControl('list');
    loadEmployees();
  }

  // start
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
