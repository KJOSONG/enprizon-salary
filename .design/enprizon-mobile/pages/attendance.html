<div class="attendance-page" data-dom-id="page-attendance">

  <!-- Period Bar -->
  <div class="period-bar" data-dom-id="period-bar">
    <span class="period-bar-label">2026年8月</span>
    &nbsp;&middot;&nbsp;
    <span>31天</span>
    <button class="lang-switch" data-dom-id="lang-switch" aria-label="切换语言">
      <span class="lang-option active" data-lang="zh">中</span>
      <span class="lang-sep">/</span>
      <span class="lang-option" data-lang="en">EN</span>
    </button>
  </div>

  <!-- Header -->
  <div class="attendance-header" data-dom-id="attendance-header">
    <h1 class="header-title" data-dom-id="header-title">出勤 - 2026年8月</h1>

    <label class="search-bar" data-dom-id="search-bar">
      <span class="search-icon" aria-hidden="true">&#x1F50D;</span>
      <input type="text" placeholder="搜索" data-dom-id="search-input">
    </label>

    <div class="filter-row" data-dom-id="filter-row">
      <button class="filter-select" data-dom-id="dept-filter">
        <span>部门</span>
        <span class="filter-select-arrow" aria-hidden="true">&#x25BC;</span>
      </button>
      <button class="filter-select" data-dom-id="date-filter">
        <span>日期</span>
        <span class="filter-select-arrow" aria-hidden="true">&#x25BC;</span>
      </button>
    </div>
  </div>

  <!-- Legend -->
  <div class="legend-strip" data-dom-id="legend-strip">
    <span class="legend-item"><span class="legend-dot D"></span> 井下白班</span>
    <span class="legend-item"><span class="legend-dot N"></span> 井下夜班</span>
    <span class="legend-item"><span class="legend-dot P"></span> 日薪/月薪</span>
    <span class="legend-item"><span class="legend-dot A"></span> 旷工</span>
    <span class="legend-item"><span class="legend-dot L"></span> 请假</span>
    <span class="legend-item"><span class="legend-dot C"></span> 破碎</span>
    <span class="legend-item"><span class="legend-dot R"></span> 钻工</span>
    <span class="legend-item"><span class="legend-dot B"></span> 双班</span>
  </div>

  <!-- Employee Attendance Cards -->
  <div class="attendance-list" data-dom-id="attendance-list" id="attendance-list">
    <!-- Dynamically rendered by JS -->
  </div>

  <!-- Status Edit Bottom Sheet -->
  <div class="status-edit-sheet" data-dom-id="status-edit-sheet">
    <h2 class="sheet-title" data-dom-id="sheet-title">修改出勤 - 8/15</h2>
    <div class="sheet-subtitle" data-dom-id="sheet-subtitle">宋科举 KEJU</div>
    <div class="sheet-current" data-dom-id="sheet-current">
      <span>当前:</span>
      <strong>D (井下白班)</strong>
    </div>
    <div class="status-btn-grid" data-dom-id="status-btn-grid">
      <button class="status-btn status-P-btn" data-dom-id="status-btn-P" type="button" data-status="P">
        <span class="btn-letter">P</span>
        <span class="btn-label">日薪/月薪</span>
      </button>
      <button class="status-btn status-A-btn" data-dom-id="status-btn-A" type="button" data-status="A">
        <span class="btn-letter">A</span>
        <span class="btn-label">旷工</span>
      </button>
      <button class="status-btn status-L-btn" data-dom-id="status-btn-L" type="button" data-status="L">
        <span class="btn-letter">L</span>
        <span class="btn-label">请假</span>
      </button>
      <button class="status-btn status-D-btn" data-dom-id="status-btn-D" type="button" data-status="D">
        <span class="btn-letter">D</span>
        <span class="btn-label">井下白班</span>
      </button>
      <button class="status-btn status-N-btn" data-dom-id="status-btn-N" type="button" data-status="N">
        <span class="btn-letter">N</span>
        <span class="btn-label">井下夜班</span>
      </button>
      <button class="status-btn status-C-btn" data-dom-id="status-btn-C" type="button" data-status="C">
        <span class="btn-letter">C</span>
        <span class="btn-label">破碎</span>
      </button>
      <button class="status-btn status-R-btn" data-dom-id="status-btn-R" type="button" data-status="R">
        <span class="btn-letter">R</span>
        <span class="btn-label">钻工</span>
      </button>
      <button class="status-btn status-B-btn" data-dom-id="status-btn-B" type="button" data-status="B">
        <span class="btn-letter">B</span>
        <span class="btn-label">双班</span>
      </button>
    </div>
    <button class="sheet-cancel" data-dom-id="sheet-cancel" type="button">取消</button>
  </div>

  <!-- Batch Marking Mode -->
  <div class="batch-marking" data-dom-id="batch-marking" id="batch-panel" style="display:none;">
    <div class="batch-header" data-dom-id="batch-header">
      <button class="batch-cancel" data-dom-id="batch-cancel" type="button" id="batch-cancel-btn">取消</button>
      <h3 class="batch-title" data-dom-id="batch-title">批量标记 <span class="batch-count" id="batch-selected-count">已选: 0 人</span></h3>
    </div>

    <div class="batch-employee-list" data-dom-id="batch-employee-list" id="batch-employee-list">
      <!-- Dynamically rendered by JS -->
    </div>

    <div class="batch-date-selector" data-dom-id="batch-date-selector">
      <span>日期范围:</span>
      <input type="date" class="batch-date-input" id="batch-date-start" value="2026-08-01">
      <span>至</span>
      <input type="date" class="batch-date-input" id="batch-date-end" value="2026-08-31">
    </div>

</style>
<script>
/* ================================================================
   ENPRIZON LINDI - Attendance Page (Mobile) - Dynamic Rendering
   ================================================================ */
(function() {
  'use strict';

  /* ── Constants ── */
  var PAGE_SIZE = 20;
  var STATUS_LABELS = {
    P: '日薪/月薪', A: '旷工', L: '请假', D: '井下白班',
    N: '井下夜班', C: '破碎', R: '钻工', B: '双班'
  };
  var ALL_STATUSES = ['P','A','L','D','N','C','R','B'];

  /* ── State ── */
  var state = {
    month: '2026-08',
    allEmployees: [],       // full list from API
    filteredEmployees: [],  // after search/filter
    renderedCount: 0,       // how many rendered so far
    loading: false,
    editTarget: null,       // { employee_id, date, name, currentStatus }
    batchSelectedEmpIds: {},
    batchSelectedStatus: 'P',
    searchQuery: '',
    deptFilter: 'all'
  };

  /* ── DOM refs ── */
  var $ = function(id) { return document.getElementById(id); };
  var listEl   = $('attendance-list');
  var editEl   = $('edit-panel') || document.querySelector('[data-dom-id="status-edit-sheet"]');
  var batchEl  = $('batch-panel');
  var periodLabel = document.querySelector('.period-bar-label');
  var headerTitle = document.querySelector('.header-title');
  var searchInput = document.querySelector('[data-dom-id="search-input"]');

  /* ── Status label helpers ── */
  function statusLabel(s) { return STATUS_LABELS[s] || s; }

  /* ── API helpers ── */
  function apiFetch(url, opts) {
    opts = opts || {};
    opts.credentials = 'same-origin';
    opts.headers = opts.headers || {};
    opts.headers['Accept'] = 'application/json';
    if (opts.body && typeof opts.body === 'object' && !(opts.body instanceof FormData)) {
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(opts.body);
    }
    return fetch(url, opts).then(function(r) {
      if (r.status === 401) throw new Error('请先登录');
      if (!r.ok) return r.json().then(function(d) { throw new Error(d.error || '请求失败 (' + r.status + ')'); });
      return r.json();
    });
  }

  /* ================================================================
     DATA LOADING
     ================================================================ */
  function loadAttendance(month) {
    if (state.loading) return;
    state.loading = true;
    state.renderedCount = 0;
    state.allEmployees = [];
    state.filteredEmployees = [];
    showLoading();

    apiFetch('/attendance?month=' + encodeURIComponent(month || state.month))
      .then(function(data) {
        state.month = data.month || month;
        state.allEmployees = data.employees || [];
        applyFilters();
        updateHeader();
        state.loading = false;
      })
      .catch(function(err) {
        showError(err.message);
        state.loading = false;
      });
  }

  function updateHeader() {
    var parts = state.month.split('-');
    var label = parts[0] + '年' + parseInt(parts[1], 10) + '月';
    if (periodLabel) periodLabel.textContent = label;
    if (headerTitle) headerTitle.textContent = '出勤 - ' + label;
  }

  /* ================================================================
     FILTERING
     ================================================================ */
  function applyFilters() {
    var q = (state.searchQuery || '').toLowerCase().trim();
    var dept = state.deptFilter || 'all';
    state.filteredEmployees = state.allEmployees.filter(function(emp) {
      if (dept !== 'all' && emp.department !== dept) return false;
      if (!q) return true;
      return (emp.name || '').toLowerCase().indexOf(q) >= 0 ||
             (emp.en_name || '').toLowerCase().indexOf(q) >= 0 ||
             (emp.employee_id || '').toLowerCase().indexOf(q) >= 0;
    });
    state.renderedCount = 0;
    renderAttendanceList();
  }

  /* ================================================================
     RENDERING
     ================================================================ */
  function renderAttendanceList() {
    if (!listEl) return;
    listEl.innerHTML = '';

    if (state.filteredEmployees.length === 0 && !state.loading) {
      showEmpty();
      return;
    }

    var toRender = state.filteredEmployees.slice(0, state.renderedCount + PAGE_SIZE);
    state.renderedCount = Math.min(toRender.length, state.filteredEmployees.length);

    for (var i = 0; i < toRender.length; i++) {
      listEl.appendChild(renderEmployeeCard(toRender[i]));
    }

    if (state.renderedCount < state.filteredEmployees.length) {
      var btn = document.createElement('button');
      btn.className = 'load-more-btn';
      btn.textContent = '加载更多 (' + state.renderedCount + '/' + state.filteredEmployees.length + ')';
      btn.addEventListener('click', function() { renderAttendanceList(); });
      listEl.appendChild(btn);
    }
  }

  function renderEmployeeCard(emp) {
    var card = document.createElement('div');
    card.className = 'attendance-card';
    card.setAttribute('data-employee-id', emp.employee_id);

    // Left panel
    var left = document.createElement('div');
    left.className = 'card-left';
    var avatar = document.createElement('div');
    avatar.className = 'card-avatar';
    avatar.textContent = (emp.name || '?').charAt(0);
    var nameEl = document.createElement('div');
    nameEl.className = 'card-name';
    nameEl.textContent = emp.name || emp.employee_id;
    var idEl = document.createElement('div');
    idEl.className = 'card-id';
    idEl.textContent = (emp.en_name || '') + ' · ' + emp.employee_id;
    left.appendChild(avatar);
    left.appendChild(nameEl);
    left.appendChild(idEl);

    // Right panel
    var right = document.createElement('div');
    right.className = 'card-right';
    var scroll = document.createElement('div');
    scroll.className = 'date-strip-scroll';
    var strip = document.createElement('div');
    strip.className = 'date-strip';

    var days = emp.days || [];
    var dayMap = {};
    for (var d = 0; d < days.length; d++) {
      dayMap[days[d].date] = days[d].status;
    }

    var dateRow = document.createElement('div');
    dateRow.className = 'date-row';
    var statusRow = document.createElement('div');
    statusRow.className = 'status-row';

    var parts = state.month.split('-');
    var year = parseInt(parts[0], 10);
    var month = parseInt(parts[1], 10);
    var totalDays = new Date(year, month, 0).getDate(); // last day of month

    for (var day = 1; day <= totalDays; day++) {
      var dateStr = state.month + '-' + (day < 10 ? '0' : '') + day;
      var status = dayMap[dateStr] || 'P';

      var dc = document.createElement('span');
      dc.className = 'date-cell';
      dc.textContent = day;
      var dt = new Date(year, month - 1, day);
      if (dt.getDay() === 0 || dt.getDay() === 6) dc.classList.add('weekend');
      dateRow.appendChild(dc);

      var sc = document.createElement('span');
      sc.className = 'status-cell status-' + status;
      sc.textContent = status;
      sc.setAttribute('tabindex', '0');
      sc.setAttribute('role', 'button');
      sc.setAttribute('aria-label', dateStr + ' ' + status + ' ' + statusLabel(status));
      sc.setAttribute('data-date', dateStr);
      sc.setAttribute('data-status', status);
      sc.addEventListener('click', (function(eid, dt, st, nm) {
        return function() { openEditPanel(eid, dt, st, nm); };
      })(emp.employee_id, dateStr, status, emp.name));
      statusRow.appendChild(sc);
    }

    strip.appendChild(dateRow);
    strip.appendChild(statusRow);
    scroll.appendChild(strip);
    right.appendChild(scroll);
    card.appendChild(left);
    card.appendChild(right);
    return card;
  }

  /* ================================================================
     LOADING / ERROR / EMPTY STATES
     ================================================================ */
  function showLoading() {
    if (!listEl) return;
    listEl.innerHTML = '';
    for (var i = 0; i < 3; i++) {
      var sk = document.createElement('div');
      sk.className = 'skeleton-card';
      sk.innerHTML = '<div class="skeleton-left"><div class="skeleton-avatar"></div><div class="skeleton-name"></div><div class="skeleton-id"></div></div>' +
        '<div class="skeleton-right">' + Array(31).fill('<div class="skeleton-cell"></div>').join('') + '</div>';
      listEl.appendChild(sk);
    }
  }

  function showError(msg) {
    if (!listEl) return;
    listEl.innerHTML = '<div class="state-message">' +
      '<div class="state-message-icon">&#9888;</div>' +
      '<div class="state-message-text">' + (msg || '加载失败') + '</div>' +
      '<button class="state-message-btn" onclick="location.reload()">重试</button>' +
      '</div>';
  }

  function showEmpty() {
    if (!listEl) return;
    listEl.innerHTML = '<div class="state-message">' +
      '<div class="state-message-icon">&#128203;</div>' +
      '<div class="state-message-text">暂无出勤数据</div>' +
      '</div>';
  }

  function refreshEmployeeCard(employeeId) {
    var emp = null;
    for (var i = 0; i < state.allEmployees.length; i++) {
      if (state.allEmployees[i].employee_id === employeeId) { emp = state.allEmployees[i]; break; }
    }
    if (!emp) return;
    // update in filtered list
    for (var j = 0; j < state.filteredEmployees.length; j++) {
      if (state.filteredEmployees[j].employee_id === employeeId) {
        state.filteredEmployees[j] = emp;
        break;
      }
    }
    // replace DOM node
    var oldCard = listEl.querySelector('.attendance-card[data-employee-id="' + employeeId + '"]');
    if (oldCard) {
      var newCard = renderEmployeeCard(emp);
      oldCard.parentNode.replaceChild(newCard, oldCard);
    }
  }

  /* ================================================================
     EDIT PANEL (Single Cell)
     ================================================================ */
  function openEditPanel(employeeId, date, currentStatus, employeeName) {
    state.editTarget = { employee_id: employeeId, date: date, name: employeeName, currentStatus: currentStatus };
    if (!editEl) return;

    var sheetTitle = editEl.querySelector('[data-dom-id="sheet-title"]');
    var sheetSubtitle = editEl.querySelector('[data-dom-id="sheet-subtitle"]');
    var sheetCurrent = editEl.querySelector('[data-dom-id="sheet-current"]');

    if (sheetTitle) {
      var dp = date.split('-');
      sheetTitle.textContent = '修改出勤 - ' + parseInt(dp[2], 10) + '/' + parseInt(dp[1], 10);
    }
    if (sheetSubtitle) sheetSubtitle.textContent = employeeName + ' ' + (state.editTarget.employee_id || '');
    if (sheetCurrent) sheetCurrent.innerHTML = '<span>当前:</span> <strong>' + currentStatus + ' (' + statusLabel(currentStatus) + ')</strong>';

    editEl.classList.add('visible');
  }

  function closeEditPanel() {
    state.editTarget = null;
    if (editEl) editEl.classList.remove('visible');
  }

  function submitStatusChange(newStatus) {
    if (!state.editTarget) return;
    var et = state.editTarget;
    apiFetch('/attendance/toggle', {
      method: 'POST',
      body: { employee_id: et.employee_id, date: et.date, status: newStatus }
    }).then(function() {
      // update local data
      for (var i = 0; i < state.allEmployees.length; i++) {
        if (state.allEmployees[i].employee_id === et.employee_id) {
          var days = state.allEmployees[i].days || [];
          var found = false;
          for (var d = 0; d < days.length; d++) {
            if (days[d].date === et.date) { days[d].status = newStatus; found = true; break; }
          }
          if (!found) days.push({ date: et.date, status: newStatus });
          state.allEmployees[i].days = days;
          break;
        }
      }
      closeEditPanel();
      refreshEmployeeCard(et.employee_id);
    }).catch(function(err) {
      alert('修改失败: ' + err.message);
    });
  }

  /* ================================================================
     BATCH PANEL
     ================================================================ */
  function openBatchPanel() {
    if (!batchEl) return;
    state.batchSelectedEmpIds = {};
    renderBatchEmployeeList();
    updateBatchCount();
    batchEl.style.display = 'block';
  }

  function closeBatchPanel() {
    if (!batchEl) return;
    batchEl.style.display = 'none';
    state.batchSelectedEmpIds = {};
  }

  function renderBatchEmployeeList() {
    var container = $('batch-employee-list');
    if (!container) return;
    container.innerHTML = '';
    var employees = state.allEmployees;
    for (var i = 0; i < employees.length; i++) {
      var emp = employees[i];
      var div = document.createElement('div');
      div.className = 'batch-emp' + (state.batchSelectedEmpIds[emp.employee_id] ? ' checked' : '');
      div.setAttribute('tabindex', '0');
      div.setAttribute('role', 'checkbox');
      div.setAttribute('aria-checked', state.batchSelectedEmpIds[emp.employee_id] ? 'true' : 'false');
      div.setAttribute('data-employee-id', emp.employee_id);
      div.innerHTML = '<span class="batch-checkbox">' + (state.batchSelectedEmpIds[emp.employee_id] ? '&#x2713;' : '') + '</span>' +
        '<span class="batch-emp-name">' + (emp.name || '') + ' ' + (emp.en_name || '') + '</span>';
      div.addEventListener('click', (function(eid) {
        return function() { toggleBatchEmployee(eid); };
      })(emp.employee_id));
      container.appendChild(div);
    }
  }

  function toggleBatchEmployee(employeeId) {
    if (state.batchSelectedEmpIds[employeeId]) {
      delete state.batchSelectedEmpIds[employeeId];
    } else {
      state.batchSelectedEmpIds[employeeId] = true;
    }
    updateBatchCount();
    renderBatchEmployeeList();
  }

  function updateBatchCount() {
    var count = Object.keys(state.batchSelectedEmpIds).length;
    var countEl = $('batch-selected-count');
    var applyBtn = $('batch-apply-btn');
    if (countEl) countEl.textContent = '已选: ' + count + ' 人';
    if (applyBtn) applyBtn.textContent = '应用到选中 ' + count + ' 人';
  }

  function selectBatchStatus(status) {
    state.batchSelectedStatus = status;
    var btns = document.querySelectorAll('#batch-status-row .batch-status-btn');
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle('batch-status-sel', btns[i].getAttribute('data-status') === status);
    }
  }

  function applyBatch() {
    var empIds = Object.keys(state.batchSelectedEmpIds);
    if (empIds.length === 0) { alert('请至少选择一名员工'); return; }

    var startDate = ($('batch-date-start') || {}).value || state.month + '-01';
    var endDate = ($('batch-date-end') || {}).value || state.month + '-31';
    var status = state.batchSelectedStatus;

    // generate date list
    var dates = [];
    var cur = new Date(startDate + 'T00:00:00');
    var end = new Date(endDate + 'T00:00:00');
    while (cur <= end) {
      var ds = cur.toISOString().slice(0, 10);
      dates.push(ds);
      cur.setDate(cur.getDate() + 1);
    }

    var totalOps = empIds.length * dates.length;
    var completed = 0;
    var progressEl = $('batch-progress');
    var progressFill = $('batch-progress-fill');
    var progressText = $('batch-progress-text');
    var applyBtn = $('batch-apply-btn');

    if (applyBtn) applyBtn.disabled = true;
    if (progressEl) progressEl.style.display = 'flex';

    function updateProgress() {
      var pct = totalOps > 0 ? Math.round(completed / totalOps * 100) : 0;
      if (progressFill) progressFill.style.width = pct + '%';
      if (progressText) progressText.textContent = '正在标记 ' + completed + '/' + totalOps + '...';
    }

    function processNext(empIdx, dateIdx) {
      if (empIdx >= empIds.length) {
        // done
        if (progressText) progressText.textContent = '完成! 已标记 ' + completed + ' 条记录';
        if (applyBtn) applyBtn.disabled = false;
        // reload all data
        setTimeout(function() {
          if (progressEl) progressEl.style.display = 'none';
          loadAttendance(state.month);
        }, 800);
        return;
      }
      if (dateIdx >= dates.length) {
        processNext(empIdx + 1, 0);
        return;
      }

      apiFetch('/attendance/toggle', {
        method: 'POST',
        body: { employee_id: empIds[empIdx], date: dates[dateIdx], status: status }
      }).then(function() {
        completed++;
        updateProgress();
        processNext(empIdx, dateIdx + 1);
      }).catch(function(err) {
        completed++;
        updateProgress();
        console.error('Batch toggle failed:', err);
        processNext(empIdx, dateIdx + 1);
      });
    }

    updateProgress();
    processNext(0, 0);
  }

  /* ================================================================
     MONTH SWITCHING
     ================================================================ */
  function switchMonth(direction) {
    var parts = state.month.split('-');
    var y = parseInt(parts[0], 10);
    var m = parseInt(parts[1], 10);
    if (direction === 'prev') { m--; if (m < 1) { m = 12; y--; } }
    else { m++; if (m > 12) { m = 1; y++; } }
    state.month = y + '-' + (m < 10 ? '0' : '') + m;
    loadAttendance(state.month);
  }

  /* ================================================================
     SEARCH & FILTER
     ================================================================ */
  function setupSearch() {
    if (!searchInput) return;
    var debounceTimer;
    searchInput.addEventListener('input', function() {
      clearTimeout(debounceTimer);
      var self = this;
      debounceTimer = setTimeout(function() {
        state.searchQuery = self.value;
        applyFilters();
      }, 300);
    });
  }

  /* ================================================================
     QUICK ACTIONS
     ================================================================ */
  function setupQuickActions() {
    var leaveBtn = document.querySelector('[data-dom-id="quick-action-leave"]');
    var sickBtn = document.querySelector('[data-dom-id="quick-action-sick"]');

    if (leaveBtn) {
      leaveBtn.addEventListener('click', function() {
        // Switch to OA leave subpage via hash navigation
        if (window.parent && window.parent.location) {
          window.parent.location.hash = '#oa/leave';
        } else {
          window.location.hash = '#oa/leave';
        }
      });
    }

    if (sickBtn) {
      sickBtn.addEventListener('click', function() {
        var empId = prompt('请输入员工工号 (employee_id):');
        if (!empId) return;
        var date = prompt('请输入日期 (如 2026-08-13):', state.month + '-13');
        if (!date) return;
        var reason = prompt('请输入病假原因:');
        if (!reason) return;
        apiFetch('/api/leave/sick', {
          method: 'POST',
          body: { employee_id: empId, date: date, reason: reason }
        }).then(function() {
          alert('病假登记成功');
          loadAttendance(state.month);
        }).catch(function(err) {
          alert('病假登记失败: ' + err.message);
        });
      });
    }
  }

  /* ================================================================
     EVENT DELEGATION
     ================================================================ */
  function setupEventDelegation() {
    // Edit panel status buttons
    if (editEl) {
      editEl.addEventListener('click', function(e) {
        var btn = e.target.closest('.status-btn');
        if (btn) {
          var newStatus = btn.getAttribute('data-status');
          if (newStatus) submitStatusChange(newStatus);
        }
        if (e.target.closest('[data-dom-id="sheet-cancel"]')) {
          closeEditPanel();
        }
      });
    }

    // Batch panel
    if (batchEl) {
      batchEl.addEventListener('click', function(e) {
        if (e.target.closest('#batch-cancel-btn')) {
          closeBatchPanel();
        }
        if (e.target.closest('#batch-apply-btn')) {
          applyBatch();
        }
        var statusBtn = e.target.closest('#batch-status-row .batch-status-btn');
        if (statusBtn) {
          selectBatchStatus(statusBtn.getAttribute('data-status'));
        }
      });
    }

    // Click outside edit panel to close (on backdrop)
    document.addEventListener('click', function(e) {
      if (editEl && editEl.classList.contains('visible')) {
        if (!editEl.contains(e.target) && !e.target.closest('.status-cell')) {
          closeEditPanel();
        }
      }
    });
  }

  /* ================================================================
     PERIOD BAR - Month Navigation
     ================================================================ */
  function setupPeriodBar() {
    var bar = document.querySelector('[data-dom-id="period-bar"]');
    if (!bar) return;
    bar.style.cursor = 'pointer';
    bar.addEventListener('click', function(e) {
      var rect = bar.getBoundingClientRect();
      var midX = rect.left + rect.width / 2;
      if (e.clientX < midX) switchMonth('prev');
      else switchMonth('next');
    });
    bar.title = '点击左侧切换上月，右侧切换下月';
  }

  /* ================================================================
     BATCH MODE TOGGLE (via long-press or button)
     ================================================================ */
  function setupBatchToggle() {
    // Add a batch mode button to the header area
    var filterRow = document.querySelector('[data-dom-id="filter-row"]');
    if (filterRow) {
      var batchBtn = document.createElement('button');
      batchBtn.className = 'filter-select';
      batchBtn.style.cssText = 'flex: 0 0 auto; min-width: 80px;';
      batchBtn.innerHTML = '<span>批量</span>';
      batchBtn.addEventListener('click', openBatchPanel);
      filterRow.appendChild(batchBtn);
    }
  }

  /* ================================================================
   I18N
   ================================================================ */
  var LANG = (function(){
    var stored = localStorage.getItem('enprizon_lang') || 'zh';
    var dict = {
      zh: {
        dashboard: '数据台', employees_tab: '员工', collection: '采集', attendance: '考勤', salary: '薪资',
        status_labels: { P: '日薪/月薪', A: '旷工', L: '请假', D: '井下白班', N: '井下夜班', C: '破碎', R: '钻工', B: '双班' },
        status_short: { P: 'P', A: 'A', L: 'L', D: 'D', N: 'N', C: 'C', R: 'R', B: 'B' },
        search_placeholder: '搜索员工...', load_more: '加载更多', no_data: '暂无出勤数据',
        loading: '加载中...', error: '加载失败', retry: '重试', login_required: '请先登录',
        edit_status: '修改出勤', batch_mark: '批量标记', day: '天', total_days: '天',
        cancel: '取消', confirm: '确认', leave_apply: '请假申请', sick_register: '病假登记',
        apply: '应用', marking: '正在标记', progress: '{n}/{total}'
      },
      en: {
        dashboard: 'Dashboard', employees_tab: 'Employees', collection: 'Collection', attendance: 'Attendance', salary: 'Salary',
        status_labels: { P: 'Present', A: 'Absent', L: 'Leave', D: 'UG Day', N: 'UG Night', C: 'Crush', R: 'Driller', B: 'D+N' },
        status_short: { P: 'P', A: 'A', L: 'L', D: 'D', N: 'N', C: 'C', R: 'R', B: 'B' },
        search_placeholder: 'Search...', load_more: 'Load More', no_data: 'No attendance data',
        loading: 'Loading...', error: 'Load Failed', retry: 'Retry', login_required: 'Please login first',
        edit_status: 'Edit Status', batch_mark: 'Batch Mark', day: 'd', total_days: ' days',
        cancel: 'Cancel', confirm: 'Confirm', leave_apply: 'Leave Request', sick_register: 'Sick Leave',
        apply: 'Apply', marking: 'Marking', progress: '{n}/{total}'
      }
    };
    function t(key){ return (dict[stored]||dict.zh)[key] || key; }
    function setLang(lang){
      stored = lang;
      localStorage.setItem('enprizon_lang', lang);
      applyLang();
    }
    function applyLang(){
      var tabLabels = document.querySelectorAll('.tab-item-label');
      var tabKeys = ['dashboard','employees_tab','collection','attendance','salary'];
      tabLabels.forEach(function(el,i){ if(tabKeys[i]) el.textContent = t(tabKeys[i]); });
      document.querySelectorAll('.lang-option').forEach(function(o){
        o.classList.toggle('active', o.dataset.lang === stored);
      });
      var searchInput = document.querySelector('.search-bar input');
      if(searchInput) searchInput.placeholder = t('search_placeholder');
      var h1 = document.querySelector('.header-title');
      if(h1) h1.textContent = t('attendance') + ' - ' + (state.monthLabel || '2026年8月');
    }
    document.addEventListener('DOMContentLoaded', function(){
      var sw = document.querySelector('[data-dom-id="lang-switch"]');
      if(sw){
        sw.addEventListener('click', function(){
          setLang(stored === 'zh' ? 'en' : 'zh');
        });
      }
      applyLang();
    });
    return { t: t, setLang: setLang, current: stored };
  })();

  /* ================================================================
     INIT
     ================================================================ */
  function init() {
    setupSearch();
    setupPeriodBar();
    setupEventDelegation();
    setupQuickActions();
    setupBatchToggle();
    loadAttendance(state.month);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
