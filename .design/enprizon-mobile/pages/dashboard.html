<body>
<div class="mobile-frame">
  <!-- Period Bar -->
  <div class="period-bar">
    <button class="month-label" data-dom-id="month-selector" aria-label="选择月份">
      <span aria-hidden="true">&#x25C0;</span>
      2026年8月
      <span aria-hidden="true">&#x25B6;</span>
    </button>
    <button class="search-btn" data-dom-id="search-icon" aria-label="搜索">
      &#x2315;
    </button>
    <button class="lang-switch" data-dom-id="lang-switch" aria-label="切换语言">
      <span class="lang-option active" data-lang="zh">中</span>
      <span class="lang-sep">/</span>
      <span class="lang-option" data-lang="en">EN</span>
    </button>
  </div>

  <!-- Control Bar (collapsible) -->
  <div class="control-bar">
    <input type="checkbox" id="filter-toggle" class="filter-checkbox">
    <label for="filter-toggle" class="row1">
      <span class="section-title">数据台</span>
      <span class="filter-trigger" data-dom-id="filter-toggle">筛选 &#x25BE;</span>
    </label>
    <div class="filter-panel">
      <div class="seg-group">
        <span class="seg-label">班次</span>
        <div class="seg-row">
          <button class="seg-btn active" data-dom-id="seg-all">全部</button>
          <button class="seg-btn" data-dom-id="seg-day">白班</button>
          <button class="seg-btn" data-dom-id="seg-night">夜班</button>
        </div>
      </div>
      <div class="seg-group">
        <span class="seg-label">矿石类型</span>
        <div class="seg-row">
          <button class="seg-btn active" data-dom-id="seg-ore-all">全部</button>
          <button class="seg-btn" data-dom-id="seg-nh">NH</button>
          <button class="seg-btn" data-dom-id="seg-nl">NL</button>
          <button class="seg-btn" data-dom-id="seg-mw">MW</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scrollable Content -->
  <div class="scroll-content">

    <!-- KPI Cards (2x3) -->
    <div class="kpi-grid">
      <div class="kpi-card" data-dom-id="kpi-nh">
        <div class="indicator ind-i2"></div>
        <div class="kpi-body">
          <span class="kpi-label">本月 NH</span>
          <span class="kpi-value">1,234</span>
        </div>
      </div>
      <div class="kpi-card" data-dom-id="kpi-nl">
        <div class="indicator ind-i4"></div>
        <div class="kpi-body">
          <span class="kpi-label">本月 NL</span>
          <span class="kpi-value">456</span>
        </div>
      </div>
      <div class="kpi-card" data-dom-id="kpi-mw">
        <div class="indicator ind-i5"></div>
        <div class="kpi-body">
          <span class="kpi-label">本月 MW</span>
          <span class="kpi-value">789</span>
        </div>
      </div>
      <div class="kpi-card" data-dom-id="kpi-daily-avg">
        <div class="indicator ind-neutral"></div>
        <div class="kpi-body">
          <span class="kpi-label">日均车次</span>
          <span class="kpi-value">93.5</span>
        </div>
      </div>
      <div class="kpi-card" data-dom-id="kpi-daily-max">
        <div class="indicator ind-i5"></div>
        <div class="kpi-body">
          <span class="kpi-label">日最高</span>
          <span class="kpi-value">132</span>
          <span class="kpi-sub" style="font-size:11px;color:hsl(var(--muted-foreground))">--</span>
        </div>
      </div>
      <div class="kpi-card" data-dom-id="kpi-shift-ratio">
        <div class="indicator ind-neutral"></div>
        <div class="kpi-body">
          <span class="kpi-label">白夜班比</span>
          <span class="kpi-value">1.2:1</span>
        </div>
      </div>
    </div>

    <!-- Error State -->
    <div class="state-message" id="state-error" style="display:none">
      <div class="state-icon">&#x26A0;</div>
      <div class="state-text" id="err-msg">数据加载失败</div>
      <button class="state-action" id="btn-retry">重试</button>
    </div>
    <!-- Empty State -->
    <div class="state-message" id="state-empty" style="display:none">
      <div class="state-icon">&#x2205;</div>
      <div class="state-text">暂无产量数据</div>
    </div>

    <!-- 产量趋势 Chart -->
    <div class="chart-panel" data-dom-id="chart-trend">
      <div class="chart-header">
        <h3 class="chart-title">产量趋势</h3>
        <div class="legend">
          <span><span class="swatch sw-i2" aria-hidden="true"></span>白班</span>
          <span><span class="swatch sw-i4" aria-hidden="true"></span>夜班</span>
          <span><span class="swatch sw-i5" aria-hidden="true"></span>合计</span>
        </div>
      </div>
      <div class="chart-canvas-wrap"><canvas id="chart-trend"></canvas></div>
    </div>

    <!-- 白班 vs 夜班 Chart -->
    <div class="chart-panel" data-dom-id="chart-compare">
      <div class="chart-header">
        <h3 class="chart-title">白班 vs 夜班</h3>
        <div class="compare-tabs">
          <button class="cmp-tab active" data-dom-id="tab-nh">NH</button>
          <button class="cmp-tab" data-dom-id="tab-nl">NL</button>
          <button class="cmp-tab" data-dom-id="tab-mw">MW</button>
          <button class="cmp-tab" data-dom-id="tab-total">合计</button>
        </div>
      </div>
      <div class="legend">
        <span><span class="swatch sw-i2" aria-hidden="true"></span>白班</span>
        <span><span class="swatch sw-i4" aria-hidden="true"></span>夜班</span>
      </div>
      <div class="chart-canvas-wrap"><canvas id="chart-compare"></canvas></div>

  .crush-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: calc(var(--spacing) * 3) calc(var(--spacing) * 4);
    border-bottom: 1px solid hsl(var(--border));
  }
  .crush-head .crush-title {
    margin: 0;
    font-size: 15px;
    line-height: 1.2;
    font-weight: 600;
  }
  .crush-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    align-items: center;
    padding: calc(var(--spacing) * 2.5) calc(var(--spacing) * 4);
    border-bottom: 1px solid hsl(var(--border));
    font-size: 13px;
    transition: background-color .18s ease;
  }
  .crush-row:hover {
    background: hsl(var(--accent) / 0.22);
  }
  .crush-row:last-of-type {
    border-bottom: 0;
  }
  .crush-row .col-date {
    color: hsl(var(--foreground));
    font-weight: 500;
  }
  .crush-row .col-bags {
    color: hsl(var(--foreground));
    font-weight: 600;
    text-align: center;
  }
  .crush-row .col-workers {
    color: hsl(var(--muted-foreground));
    text-align: right;
  }
  .crush-total {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    align-items: center;
    padding: calc(var(--spacing) * 2.5) calc(var(--spacing) * 4);
    background: hsl(var(--muted));
    font-size: 13px;
    font-weight: 600;
    color: hsl(var(--foreground));
  }
  .crush-total .col-bags {
    text-align: center;
  }
  .crush-total .col-workers {
    text-align: right;
    color: hsl(var(--muted-foreground));
  }

  /* ===== Interactive States ===== */
  button {
    font: inherit;
    letter-spacing: inherit;
  }
  button:focus-visible {
    outline: none;
    box-shadow: 0 0 0 2px hsl(var(--ring));
  }
</style>
    <style>
      @keyframes sk-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      .skeleton { background: hsl(var(--muted)); border-radius: calc(var(--radius) * 0.3); animation: sk-pulse 1.5s ease-in-out infinite; }
      .sk-val { display: block; width: 70%; height: 24px; margin-top: 2px; }
      .sk-row { height: 36px; margin: 4px 0; width: 100%; border-radius: calc(var(--radius) * 0.3); }
      .chart-loading { position: relative; }
      .chart-loading::after { content: ''; position: absolute; inset: 0; background: hsl(var(--muted)); border-radius: calc(var(--radius) * 0.3); animation: sk-pulse 1.5s ease-in-out infinite; z-index: 1; }
      .chart-canvas-wrap { position: relative; width: 100%; height: 160px; }
      .chart-canvas-wrap canvas { width: 100% !important; height: 100% !important; }
      .donut-canvas-wrap { width: 160px; height: 160px; flex-shrink: 0; }
      .state-message { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: calc(var(--spacing) * 6) calc(var(--spacing) * 4); text-align: center; gap: calc(var(--spacing) * 2.5); }
      .state-message .state-icon { font-size: 28px; color: hsl(var(--muted-foreground)); opacity: 0.6; }
      .state-message .state-text { font-size: 13px; color: hsl(var(--muted-foreground)); }
      .state-message .state-action { min-height: 36px; padding: calc(var(--spacing) * 1.5) calc(var(--spacing) * 4); border: 1px solid hsl(var(--border)); border-radius: calc(var(--radius) * 0.76); background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); font: inherit; font-size: 13px; cursor: pointer; transition: transform .18s ease; }
      .state-message .state-action:hover { transform: translateY(-1px); }
      .state-message .state-action:active { transform: scale(0.98); }
      .kpi-sub { font-size: 11px; color: hsl(var(--muted-foreground)); }
    </style>
    <script>
(function() {
  'use strict';
  if (typeof Chart === 'undefined') { console.warn('Chart.js not loaded'); return; }
  var charts = {};
  function $(sel) { return document.querySelector(sel); }
  function $$(sel) { return document.querySelectorAll(sel); }
  function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  function hslC(v) { return 'hsl(' + cssVar(v) + ')'; }
  var C = {
    chart1: function() { return hslC('--chart-1'); },
    chart2: function() { return hslC('--chart-2'); },
    chart3: function() { return hslC('--chart-3'); },
    chart4: function() { return hslC('--chart-4'); },
    chart5: function() { return hslC('--chart-5'); },
    mutedFg: function() { return hslC('--muted-foreground'); },
    foreground: function() { return hslC('--foreground'); },
    muted: function() { return hslC('--muted'); },
    border: function() { return hslC('--border'); },
    font: function() { var f = cssVar('--font-sans'); return f.split(',')[0].replace(/['"]/g, ''); }
  };
  var currentData = null;

  /* --- State management --- */
  function showLoading() {
    $$('.kpi-value').forEach(function(el) { el.innerHTML = '<span class="skeleton sk-val"></span>'; });
    $$('.chart-canvas-wrap').forEach(function(el) { el.classList.add('chart-loading'); });
    var cr = $('#crush-rows'); if (cr) cr.innerHTML = '<div class="skeleton sk-row"></div><div class="skeleton sk-row"></div><div class="skeleton sk-row"></div>';
    ['state-error','state-empty'].forEach(function(id) { var e = $('#'+id); if (e) e.style.display = 'none'; });
  }
  function showError(msg) {
    var e = $('#state-empty'); if (e) e.style.display = 'none';
    $$('.kpi-value').forEach(function(el) { el.textContent = '--'; });
    $$('.chart-canvas-wrap').forEach(function(el) { el.classList.remove('chart-loading'); });
    var err = $('#state-error'); if (err) { err.style.display = 'flex'; var m = $('#err-msg'); if (m) m.textContent = msg || '数据加载失败'; }
  }
  function showEmpty() {
    var e = $('#state-error'); if (e) e.style.display = 'none';
    var emp = $('#state-empty'); if (emp) emp.style.display = 'flex';
  }
  function showContent() {
    ['state-error','state-empty'].forEach(function(id) { var e = $('#'+id); if (e) e.style.display = 'none'; });
    $$('.chart-canvas-wrap').forEach(function(el) { el.classList.remove('chart-loading'); });
  }

  /* --- Data fetching --- */
  async function loadDashboard() {
    showLoading();
    try {
      var resp = await fetch('/api/production/dashboard', { credentials: 'same-origin' });
      if (resp.status === 401) { showError('请先登录'); return; }
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      var data = await resp.json();
      if (!data || !data.kpi) { showEmpty(); return; }
      currentData = data;
      renderAll(data);
    } catch (err) { showError(err.message || '网络错误'); }
  }

  /* --- Render --- */
  function renderAll(data) {
    showContent();
    renderKPIs(data.kpi, data.trend);
    renderTrendChart(data.trend);
    renderCompareChart(data.trend);
    renderDrillerChart(data.driller_groups);
    renderDonutChart(data.kpi);
    renderCrushTable(data.crush);
  }
  function setKPIVal(sel, val) {
    var el = $(sel); if (el) el.textContent = (typeof val === 'number') ? val.toLocaleString() : String(val);
  }
  function renderKPIs(kpi, trend) {
    setKPIVal('[data-dom-id="kpi-nh"] .kpi-value', kpi.total_nickel_h || 0);
    setKPIVal('[data-dom-id="kpi-nl"] .kpi-value', kpi.total_nickel_l || 0);
    setKPIVal('[data-dom-id="kpi-mw"] .kpi-value', kpi.total_mawe || 0);
    var days = (trend && trend.length) ? trend.length : 1;
    var total = (kpi.total_nickel_h || 0) + (kpi.total_nickel_l || 0) + (kpi.total_mawe || 0);
    setKPIVal('[data-dom-id="kpi-daily-avg"] .kpi-value', (total / days).toFixed(1));
    var maxVal = 0, maxDate = '';
    if (trend) trend.forEach(function(d) { var t = (d.day_shift||0)+(d.night_shift||0); if (t>maxVal) { maxVal=t; maxDate=d.date; } });
    setKPIVal('[data-dom-id="kpi-daily-max"] .kpi-value', maxVal);
    var subEl = $('[data-dom-id="kpi-daily-max"] .kpi-sub');
    if (subEl && maxDate) subEl.textContent = maxDate.slice(5);
    var ds = kpi.day_shifts || 0, ns = kpi.night_shifts || 0;
    setKPIVal('[data-dom-id="kpi-shift-ratio"] .kpi-value', ns > 0 ? (ds/ns).toFixed(1)+':1' : '--');
  }

  /* --- Chart helpers --- */
  function destroyChart(id) { if (charts[id]) { charts[id].destroy(); charts[id] = null; } }
  function makeLineOpts() {
    return { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
      scales: { x: { ticks: { font: { size: 9 }, color: C.mutedFg(), maxRotation: 0 }, grid: { display: false } },
        y: { ticks: { font: { size: 9 }, color: C.mutedFg() }, grid: { color: C.border() }, beginAtZero: true } },
      interaction: { intersect: false, mode: 'index' } };
  }
  function makeBarOpts(stacked) {
    return { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
      scales: { x: { stacked: !!stacked, ticks: { font: { size: 9 }, color: C.mutedFg(), maxRotation: 0 }, grid: { display: false } },
        y: { stacked: !!stacked, ticks: { font: { size: 9 }, color: C.mutedFg() }, grid: { color: C.border() }, beginAtZero: true } } };
  }

  /* --- Trend Chart (line) --- */
  function renderTrendChart(trend) {
    if (!trend || !trend.length) return;
    destroyChart('trend');
    var c = $('#chart-trend'); if (!c) return; c = c.getContext('2d');
    charts.trend = new Chart(c, {
      type: 'line', data: { labels: trend.map(function(d){return d.date.slice(5);}),
        datasets: [
          { label: '白班', data: trend.map(function(d){return d.day_shift||0;}), borderColor: C.chart2(), backgroundColor: 'transparent', borderWidth: 2, pointRadius: 2, pointHoverRadius: 4, tension: 0.3 },
          { label: '夜班', data: trend.map(function(d){return d.night_shift||0;}), borderColor: C.chart4(), backgroundColor: 'transparent', borderWidth: 2, pointRadius: 2, pointHoverRadius: 4, tension: 0.3 },
          { label: '合计', data: trend.map(function(d){return (d.day_shift||0)+(d.night_shift||0);}), borderColor: C.chart5(), backgroundColor: 'transparent', borderWidth: 1.5, borderDash: [4,3], pointRadius: 1, pointHoverRadius: 3, tension: 0.3 }
        ] }, options: makeLineOpts() });
  }

  /* --- Compare Chart (grouped bar) --- */
  function renderCompareChart(trend) {
    if (!trend || !trend.length) return;
    destroyChart('compare');
    var c = $('#chart-compare'); if (!c) return; c = c.getContext('2d');
    var d = trend.slice(-7);
    charts.compare = new Chart(c, {
      type: 'bar', data: { labels: d.map(function(x){return x.date.slice(5);}),
        datasets: [
          { label: '白班', data: d.map(function(x){return x.day_shift||0;}), backgroundColor: C.chart2(), borderRadius: 4 },
          { label: '夜班', data: d.map(function(x){return x.night_shift||0;}), backgroundColor: C.chart4(), borderRadius: 4 }
        ] }, options: makeBarOpts(false) });
  }

  /* --- Driller Chart (stacked bar) --- */
  function renderDrillerChart(groups) {
    if (!groups || !groups.length) return;
    destroyChart('driller');
    var c = $('#chart-driller'); if (!c) return; c = c.getContext('2d');
    var allDates = [], dateSet = {};
    groups.forEach(function(g) { (g.daily||[]).forEach(function(d) { if (!dateSet[d.date]) { dateSet[d.date]=true; allDates.push(d.date); } }); });
    allDates.sort();
    var labels = allDates.map(function(d){return d.slice(5);});
    var colors = [C.chart2(), C.chart4(), C.chart5(), C.chart1(), C.chart3()];
    var datasets = groups.map(function(g,i) { return {
      label: g.group, data: labels.map(function(lb) {
        var day = (g.daily||[]).find(function(d){return d.date.slice(5)===lb;});
        return day ? (day.nickel_h||0)+(day.nickel_l||0)+(day.mawe||0) : 0;
      }), backgroundColor: colors[i%colors.length], borderRadius: 0 }; });
    charts.driller = new Chart(c, { type: 'bar', data: { labels: labels, datasets: datasets }, options: makeBarOpts(true) });
  }

  /* --- Donut Chart --- */
  var centerTextPlugin = {
    id: 'centerText', afterDraw: function(chart) {
      var ctx = chart.ctx, w = chart.width, h = chart.height;
      var total = chart.data.datasets[0].data.reduce(function(a,b){return a+b;},0);
      ctx.save(); ctx.font = 'bold 20px ' + C.font(); ctx.fillStyle = C.foreground();
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(total.toLocaleString(), w/2, h/2 - 8);
      ctx.font = '10px '+C.font(); ctx.fillStyle = C.mutedFg(); ctx.fillText('总车次', w/2, h/2+12); ctx.restore();
    }
  };
  function renderDonutChart(kpi) {
    if (!kpi) return;
    destroyChart('donut');
    var nh=kpi.total_nickel_h||0, nl=kpi.total_nickel_l||0, mw=kpi.total_mawe||0, total=nh+nl+mw;
    var leg = $('#donut-legend');
    if (total===0) { if(leg) leg.innerHTML='<span style="color:hsl(var(--muted-foreground))">暂无数据</span>'; return; }
    var c = $('#chart-donut'); if (!c) return; c = c.getContext('2d');
    charts.donut = new Chart(c, {
      type: 'doughnut', data: { labels: ['NH','NL','MW'], datasets: [{ data: [nh,nl,mw], backgroundColor: [C.chart2(),C.chart4(),C.chart5()], borderColor: C.muted(), borderWidth: 2 }] },
      options: { responsive: true, maintainAspectRatio: true, cutout: '65%', plugins: { legend: { display: false } } }, plugins: [centerTextPlugin] });
    function pct(v){return total>0?Math.round(v/total*100)+'%':'0%';}
    if(leg) leg.innerHTML='<span>NH <span class="lbl-val">'+pct(nh)+'</span></span><span>NL <span class="lbl-val">'+pct(nl)+'</span></span><span>MW <span class="lbl-val">'+pct(mw)+'</span></span>';
  }

  /* --- Crush Table --- */
  function renderCrushTable(crush) {
    var rowsEl=$('#crush-rows'), totalEl=$('#crush-total');
    if(!rowsEl||!totalEl) return;
    if(!crush||!crush.length) {
      rowsEl.innerHTML='<div class="crush-row"><span class="col-date">--</span><span class="col-bags">暂无数据</span><span class="col-workers">--</span></div>';
      totalEl.innerHTML='<span>合计</span><span class="col-bags">--</span><span class="col-workers">--</span>'; return;
    }
    var totalBags=0, html='';
    crush.forEach(function(d){ totalBags+=d.bags||0;
      html+='<div class="crush-row"><span class="col-date">'+(d.date?d.date.slice(5):'--')+'</span><span class="col-bags">'+(d.bags||0)+'袋</span><span class="col-workers">'+(d.team_size||0)+'人</span></div>'; });
    rowsEl.innerHTML=html;
    totalEl.innerHTML='<span>合计</span><span class="col-bags">'+totalBags+'袋</span><span class="col-workers">--</span>';
  }

  /* --- i18n --- */
  var LANG = (function(){
    var stored = localStorage.getItem('enprizon_lang') || 'zh';
    var dict = {
      zh: {
        dashboard: '数据台', employees: '员工', collection: '采集', attendance: '考勤', salary: '薪资',
        period_label: '年', month: '月', total_days: '天',
        kpi_nickel_h: 'NICKEL(H) 总车次', kpi_nickel_l: 'NICKEL(L) 总车次', kpi_mawe: 'MAWE 总车次',
        kpi_avg_daily: '日均车次', kpi_day_max: '日最高车次', kpi_ratio: '白/夜班比',
        chart_trend: '产量趋势', chart_compare: '白班 vs 夜班', chart_driller: '钻工组产量', chart_donut: '矿石类型占比',
        crush_table: '破碎产量明细', loading: '加载中...', error: '加载失败', retry: '重试',
        no_data: '暂无产量数据', login_required: '请先登录', day_shift: '白班', night_shift: '夜班', total: '合计'
      },
      en: {
        dashboard: 'Dashboard', employees: 'Employees', collection: 'Collection', attendance: 'Attendance', salary: 'Salary',
        period_label: '', month: '', total_days: ' days',
        kpi_nickel_h: 'NICKEL(H) Total', kpi_nickel_l: 'NICKEL(L) Total', kpi_mawe: 'MAWE Total',
        kpi_avg_daily: 'Avg Daily', kpi_day_max: 'Daily Max', kpi_ratio: 'Day/Night Ratio',
        chart_trend: 'Production Trend', chart_compare: 'Day vs Night', chart_driller: 'Driller Output', chart_donut: 'Ore Type',
        crush_table: 'Crush Production', loading: 'Loading...', error: 'Load Failed', retry: 'Retry',
        no_data: 'No production data', login_required: 'Please login first', day_shift: 'Day', night_shift: 'Night', total: 'Total'
      }
    };
    function t(key){ return (dict[stored]||dict.zh)[key] || key; }
    function setLang(lang){
      stored = lang;
      localStorage.setItem('enprizon_lang', lang);
      applyLang();
    }
    function applyLang(){
      // Update tab labels
      var tabs = document.querySelectorAll('.tab-item-label');
      var tabKeys = ['dashboard','employees','collection','attendance','salary'];
      tabs.forEach(function(el,i){ if(tabKeys[i]) el.textContent = t(tabKeys[i]); });
      // Update lang switch
      document.querySelectorAll('.lang-option').forEach(function(o){
        o.classList.toggle('active', o.dataset.lang === stored);
      });
      // Update page title
      var h1 = document.querySelector('h1');
      if(h1) h1.textContent = t('dashboard');
      // Update KPI labels
      var kpiLabels = document.querySelectorAll('.kpi-label');
      var kpiKeys = ['kpi_nickel_h','kpi_nickel_l','kpi_mawe','kpi_avg_daily','kpi_day_max','kpi_ratio'];
      kpiLabels.forEach(function(el,i){ if(kpiKeys[i]) el.textContent = t(kpiKeys[i]); });
      // Update chart titles
      var chartTitles = document.querySelectorAll('.chart-title');
      var chartKeys = ['chart_trend','chart_compare','chart_driller','chart_donut'];
      chartTitles.forEach(function(el,i){ if(chartKeys[i]) el.textContent = t(chartKeys[i]); });
      // Update crush table title
      var crushTitle = document.querySelector('.crush-header .chart-title');
      if(crushTitle) crushTitle.textContent = t('crush_table');
      // Update chart labels if Chart.js is loaded
      if(typeof Chart !== 'undefined'){
        [chartTrend, chartCompare, chartDriller, chartDonut].forEach(function(c){
          if(!c) return;
          if(c.data && c.data.datasets){
            c.data.datasets.forEach(function(ds){
              if(ds.label === '白班' || ds.label === 'Day') ds.label = t('day_shift');
              if(ds.label === '夜班' || ds.label === 'Night') ds.label = t('night_shift');
              if(ds.label === '合计' || ds.label === 'Total') ds.label = t('total');
            });
          }
          c.update();
        });
      }
    }
    // Init lang switch
    document.addEventListener('DOMContentLoaded', function(){
      var sw = document.querySelector('[data-dom-id="lang-switch"]');
      if(sw){
        sw.addEventListener('click', function(){
          setLang(stored === 'zh' ? 'en' : 'zh');
        });
      }
      applyLang();
    });
    return { t: t, setLang: setLang, current: stored };
  })();

  /* --- Init --- */
  function init() {
    var btn=$('#btn-retry'); if(btn) btn.addEventListener('click',function(){loadDashboard();});
    loadDashboard();
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init);
  else init();
})();
    </script>
