<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="hsl(40 16% 98%)">
  <link rel="manifest" href="{{ static_url('manifest.webmanifest') }}">
  <meta name="mobile-web-app-capable" content="yes">
  <title>ENPRIZON LINDI</title>
  <link rel="stylesheet" href="{{ static_url('css/mobile.css') }}?v={{ version }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- 登录页（未认证时显示） -->
  <div id="login-screen" class="login-wrap" style="display:none;">
    <div class="login-logo">
      <h1>ENPRIZON LINDI</h1>
      <p data-i18n="login_sub">薪资与产量管理系统 · 移动端</p>
    </div>
    <form id="login-form" onsubmit="return doLogin(event)">
      <div class="field">
        <label class="field__label" data-i18n="username">用户名</label>
        <input type="text" id="login-user" autocomplete="username" required>
      </div>
      <div class="field">
        <label class="field__label" data-i18n="password">密码</label>
        <input type="password" id="login-pass" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" data-i18n="login">登录</button>
    </form>
  </div>

  <!-- 主应用 -->
  <div id="app" style="display:none;">
    <!-- 顶栏 -->
    <header class="top-bar">
      <button class="top-bar__back" id="topback" onclick="popPage()" aria-label="返回">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="22" height="22"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div style="flex:1; min-width:0;">
        <div class="top-bar__title" id="top-title" data-i18n="tab_dashboard">数据台</div>
        <div class="top-bar__month" id="top-month" onclick="openMonthSheet()">—</div>
      </div>
      <div class="top-bar__actions">
        <button class="icon-btn" id="search-btn" onclick="toggleSearch()" title="搜索" aria-label="搜索">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        </button>
        <button class="icon-btn lang-pill" id="lang-btn" onclick="toggleLang()" title="语言">中</button>
        <button class="icon-btn" id="theme-btn" onclick="toggleTheme()" title="主题" aria-label="主题">
          <svg id="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg id="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22" style="display:none;"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </header>

    <!-- 搜索栏（默认隐藏） -->
    <div id="search-bar" style="display:none; padding:8px 16px; background:var(--card); border-bottom:1px solid var(--border);">
      <input type="search" id="search-input" data-i18n-placeholder="search" placeholder="搜索..." oninput="onSearch(this.value)" style="width:100%; min-height:44px; padding:8px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--background);">
    </div>

    <main class="main-content">
      <!-- 数据台 -->
      <section class="tab-page active" id="tab-dashboard">
        <!-- 骨架屏 -->
        <div id="dash-skeleton" style="display:none;">
          <div class="kpi-grid">
            <div class="skeleton-card kpi"></div><div class="skeleton-card kpi"></div>
            <div class="skeleton-card kpi"></div><div class="skeleton-card kpi"></div>
            <div class="skeleton-card kpi"></div><div class="skeleton-card kpi"></div>
          </div>
          <div class="skeleton-card chart"></div>
          <div class="skeleton-card chart"></div>
        </div>
        <!-- 错误/空态 -->
        <div id="dash-error" class="state-box" style="display:none;">
          <div class="state-box__icon">⚠️</div>
          <div class="state-box__title" data-i18n="load_fail">加载失败</div>
          <div class="state-box__desc" id="dash-error-desc"></div>
          <button class="state-box__action" onclick="loadDashboard()" data-i18n="retry">重试</button>
        </div>
        <div id="dash-empty" class="state-box" style="display:none;">
          <div class="state-box__icon">∅</div>
          <div class="state-box__title" data-i18n="no_data">暂无产量数据</div>
        </div>
        <div id="dash-content" style="display:none;">
          <!-- 筛选控制栏（可折叠） -->
          <div class="control-bar" id="dash-control">
            <button class="control-bar__trigger" onclick="toggleDashFilter()">
              <span data-i18n="dashboard_title">数据台</span>
              <span class="ctrl-wrap"><span data-i18n="filter">筛选</span><span class="ctrl-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M6 9l6 6 6-6"/></svg></span></span>
            </button>
            <div class="control-bar__body">
              <div class="filter-group">
                <div class="filter-group__label" data-i18n="shift">班次</div>
                <div class="segmented" id="dash-shift-seg">
                  <div class="segmented__option active" data-v="all" onclick="setShiftFilter('all')" data-i18n="all">全部</div>
                  <div class="segmented__option" data-v="day" onclick="setShiftFilter('day')" data-i18n="day_shift">白班</div>
                  <div class="segmented__option" data-v="night" onclick="setShiftFilter('night')" data-i18n="night_shift">夜班</div>
                </div>
              </div>
              <div class="filter-group">
                <div class="filter-group__label" data-i18n="ore_type">矿石类型</div>
                <div class="segmented" id="dash-ore-seg">
                  <div class="segmented__option active" data-v="all" onclick="setOreFilter('all')" data-i18n="all">全部</div>
                  <div class="segmented__option ore-tag" data-v="nh" onclick="setOreFilter('nh')" data-i18n="nh">NICKEL(H)</div>
                  <div class="segmented__option ore-tag" data-v="nl" onclick="setOreFilter('nl')" data-i18n="nl">NICKEL(L)</div>
                  <div class="segmented__option ore-tag" data-v="mw" onclick="setOreFilter('mw')" data-i18n="mw">MAWE</div>
                </div>
              </div>
            </div>
          </div>
          <div class="kpi-grid" id="kpi-grid"></div>
          <div class="chart-box">
            <div class="chart-box__title" data-i18n="trend">产量趋势</div>
            <div class="chart-canvas-wrap chart-loading" style="height:160px;"><canvas id="chart-trend"></canvas></div>
          </div>
          <div class="chart-box">
            <div class="chart-header">
              <div class="chart-box__title" data-i18n="day_night">白班 vs 夜班</div>
              <div class="cmp-tab" id="dn-cmp-tab">
                <button class="cmp-tab__item active" data-v="all" onclick="setDnTab('all')" data-i18n="total">合计</button>
                <button class="cmp-tab__item" data-v="nh" onclick="setDnTab('nh')" data-i18n="nh">NICKEL(H)</button>
                <button class="cmp-tab__item" data-v="nl" onclick="setDnTab('nl')" data-i18n="nl">NICKEL(L)</button>
                <button class="cmp-tab__item" data-v="mw" onclick="setDnTab('mw')" data-i18n="mw">MAWE</button>
              </div>
            </div>
            <div class="chart-canvas-wrap" style="height:160px;"><canvas id="chart-daynight"></canvas></div>
          </div>
          <div class="chart-box">
            <div class="chart-box__title" data-i18n="driller_output">钻工组产量</div>
            <div class="chart-canvas-wrap" style="height:160px;"><canvas id="chart-driller"></canvas></div>
            <div class="chart-note" data-i18n="chart_drill_note">点击柱子查看逐日明细</div>
          </div>
          <div class="chart-box">
            <div class="chart-box__title" data-i18n="ore_type">矿石类型占比</div>
            <div class="donut-wrap">
              <div class="donut-canvas-wrap">
                <canvas id="chart-ore"></canvas>
                <div class="donut-center"><span class="donut-center__value" id="donut-total">0</span><span class="donut-center__label" data-i18n="total">合计</span></div>
              </div>
              <div class="donut-legend" id="ore-legend"></div>
            </div>
          </div>
          <div class="card">
            <div class="card-title" data-i18n="crush_table">破碎产量</div>
            <div class="crush-table">
              <div class="crush-table__row head"><span data-i18n="date">日期</span><span data-i18n="bags">袋数</span><span data-i18n="emp">人数</span></div>
              <div id="crush-list"></div>
              <div class="crush-total-row"><span data-i18n="total">合计</span><span class="num" id="crush-total-bags">0</span><span id="crush-total-emp">0</span></div>
            </div>
          </div>
        </div>
      </section>

      <!-- 员工 -->
      <section class="tab-page" id="tab-employees">
        <!-- 分段控制（999px 胶囊 + 待审红色 badge） -->
        <div class="segmented segmented--pills" id="emp-seg" style="margin-bottom:12px;">
          <div class="segmented__option active" data-v="list" onclick="setEmpSeg('list')" data-i18n="emp_list">员工列表</div>
          <div class="segmented__option" data-v="pending" onclick="setEmpSeg('pending')"><span class="seg-pill-label"><span data-i18n="oa_pending">待审</span><span class="oa-badge" id="oa-pending-n" style="display:none;">0</span></span></div>
          <div class="segmented__option" data-v="history" onclick="setEmpSeg('history')" data-i18n="oa_history">已审批</div>
        </div>
        <!-- 搜索栏 -->
        <div id="emp-search-wrap" class="search-field" style="display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="search" id="emp-search" data-i18n-placeholder="search_emp_ph" placeholder="搜索员工..." oninput="onEmpSearch(this.value)">
        </div>
        <!-- 员工列表 -->
        <div id="emp-list">
          <div class="skeleton-card kpi" id="emp-list-skeleton"></div>
          <div class="skeleton-card kpi"></div>
          <div class="skeleton-card kpi"></div>
        </div>
        <!-- 员工档案 -->
        <div id="emp-detail" style="display:none;"></div>
        <!-- OA 待审/已审批 -->
        <div id="oa-list" style="display:none;"></div>
      </section>

      <!-- 采集 -->
      <section class="tab-page" id="tab-collection">
        <div id="col-home"></div>
        <div id="col-form" style="display:none;"></div>
      </section>

      <!-- 出勤 -->
      <section class="tab-page" id="tab-attendance">
        <div id="attRoot"></div>
      </section>
    </main>

    <!-- 底部 Tab Bar -->
    <nav class="tab-bar">
      <div class="tab-bar__item active" data-tab="dashboard" onclick="switchTab('dashboard')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        <span data-i18n="tab_dashboard">数据台</span>
      </div>
      <div class="tab-bar__item" data-tab="employees" onclick="switchTab('employees')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M21 21v-2a4 4 0 0 0-3-3.87"/></svg>
        <span data-i18n="tab_employees">员工</span>
      </div>
      <div class="tab-bar__item" data-tab="collection" onclick="switchTab('collection')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></svg>
        <span data-i18n="tab_collection">采集</span>
      </div>
      <div class="tab-bar__item" data-tab="attendance" onclick="switchTab('attendance')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span data-i18n="tab_attendance">出勤</span>
      </div>
    </nav>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- 底部 Sheet -->
    <div class="sheet-overlay" id="sheet" onclick="if(event.target===this)closeSheet()">
      <div class="sheet-content" id="sheet-content">
        <div class="sheet-handle"></div>
        <div class="sheet-header"><span id="sheet-title"></span><button class="icon-btn" onclick="closeSheet()">✕</button></div>
        <div id="sheet-body"></div>
      </div>
    </div>

    <!-- 编辑档案 Modal（modal-sheet 三区） -->
    <div id="modal-overlay" class="modal-overlay" style="display:none;" onclick="if(event.target===this)closeModal()">
      <div class="modal-sheet">
        <div class="modal-header">
          <div class="modal-title" id="modal-title"></div>
          <button class="modal-close-btn" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body" id="modal-body"></div>
        <div class="modal-footer" id="modal-footer"></div>
      </div>
    </div>
  </div>

  <script src="{{ static_url('js/i18n.js') }}?v={{ version }}"></script>
  <script src="{{ static_url('js/chart.umd.min.js') }}"></script>
  <script src="{{ static_url('js/chartjs-plugin-datalabels.min.js') }}"></script>
  <script src="{{ static_url('js/chartjs-plugin-zoom.min.js') }}"></script>
  <script>
  // ═══════════════════════════════════════════════
  //  P16 移动端 SPA — Phase 1: 骨架 + 数据台
  // ═══════════════════════════════════════════════
  const STATE = {
    auth: null,
    currentMonth: '',
    dashboard: null,
    theme: localStorage.getItem('m_theme') || 'light',
    lang: localStorage.getItem('m_lang') || 'zh',
    shiftFilter: 'all',
    charts: {},
    attendance: null,
    attBatch: false,
    attBatchSel: null,
    _batchStatus: '',
    attJump: '',
  };

  const I18N = null; // 已废弃：统一使用 static/js/i18n.js 的 I18N_DICT
  function t(key, vars){
    let s;
    if (window.I18N_DICT) {
      const dict = I18N_DICT[STATE.lang] || I18N_DICT.zh || {};
      s = dict[key] !== undefined ? dict[key] : key;
    } else {
      // 兼容回退：i18n.js 未加载时返回 key 本身
      s = key;
    }
    if (vars && s.includes('{')) {
      for (const k in vars) s = s.split('{'+k+'}').join(String(vars[k]));
    }
    return s;
  }

  // ── 工具 ──
  // P0 修复: 子路径部署兼容(/salary/m → API_BASE=/salary),对齐桌面端 index.html
  const API_BASE = (function() {
    const p = window.location.pathname;
    const i = p.indexOf('/', 1);
    return i > 0 ? p.substring(0, i) : '';
  })();
  function api(path, opts){ return fetch(API_BASE + path, Object.assign({ credentials:'same-origin', headers:{'Content-Type':'application/json'} }, opts)).then(r=>r.json()); }
  // 带 HTTP 状态返回（用于区分 403 等场景），不破坏 api() 调用方
  function apiStatus(path, opts){ return fetch(API_BASE + path, Object.assign({ credentials:'same-origin', headers:{'Content-Type':'application/json'} }, opts)).then(r=>r.json().then(j=>({status:r.status, json:j}))); }
  function fmt(n){ n = Number(n)||0; return n.toLocaleString('en-US'); }
  function toast(msg, type){ const el=document.getElementById('toast'); el.textContent=msg; el.className='toast show'+(type?(' '+type):''); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),2500); }

  // ── 主题/语言 ──
  function applyTheme(){
    document.documentElement.classList.toggle('dark', STATE.theme==='dark');
    const moon=document.getElementById('theme-icon-moon'), sun=document.getElementById('theme-icon-sun');
    if(moon) moon.style.display = STATE.theme==='dark'?'none':'block';
    if(sun) sun.style.display = STATE.theme==='dark'?'block':'none';
    const tc=document.querySelector('meta[name="theme-color"]');
    if(tc) tc.setAttribute('content', STATE.theme==='dark'?'hsl(12 71.43% 1.37%)':'hsl(40 16% 98%)');
  }
  function toggleTheme(){ STATE.theme = STATE.theme==='dark'?'light':'dark'; localStorage.setItem('m_theme', STATE.theme); applyTheme(); }
  function applyLang(){
    document.querySelectorAll('[data-i18n]').forEach(e=>{ const k=e.getAttribute('data-i18n'); if(k) e.textContent=t(k); });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(e=>{ const k=e.getAttribute('data-i18n-placeholder'); if(k) e.placeholder=t(k); });
    document.documentElement.lang = STATE.lang;
    const lb=document.getElementById('lang-btn'); if(lb) lb.textContent = STATE.lang==='zh'?'中':'EN';
  }
  function toggleLang(){ STATE.lang = STATE.lang==='zh'?'en':'zh'; localStorage.setItem('m_lang', STATE.lang); applyLang(); if(activeTab==='dashboard') renderDashboard(); }

  // ── Tab 路由 ──
  const TAB_TITLES = { dashboard:'tab_dashboard', employees:'tab_employees', collection:'tab_collection', attendance:'tab_attendance' };
  let activeTab = 'dashboard';
  let _pageStack = [];  // 子页栈: ['emp-profile:123', 'col-form:underground']
  function switchTab(name){
    activeTab = name;
    _pageStack = [];
    document.querySelectorAll('.tab-page').forEach(p=>p.classList.remove('active'));
    document.getElementById('tab-'+name).classList.add('active');
    document.querySelectorAll('.tab-bar__item').forEach(i=>i.classList.toggle('active', i.dataset.tab===name));
    document.getElementById('top-title').textContent = t(TAB_TITLES[name]);
    document.getElementById('topback').classList.remove('visible');
    window.scrollTo(0,0);
    if(name==='dashboard' && !STATE.dashboard) loadDashboard();
    if(name==='employees'){ if(!STATE.employees.length) loadEmployees(); loadOAPendingCount(); }
    if(name==='collection'){ if(!STATE.employees.length) loadEmployees(); loadCollectionHome(); }
    if(name==='attendance') loadAttendance();
  }
  function loadOAPendingCount(){
    api('/api/oa/pending/count').then(d=>{
      const n=d.count||0; const badge=document.getElementById('oa-pending-n');
      if(badge){ badge.textContent=n; badge.style.display=n>0?'inline-flex':'none'; }
    }).catch(()=>{});
  }
  function pushPage(title){ _pageStack.push(title||''); document.getElementById('topback').classList.add('visible'); }
  function popPage(){
    _pageStack.pop();
    if(_pageStack.length) return;  // 还有更上层子页
    document.getElementById('topback').classList.remove('visible');
    // 按当前 tab 回到根视图
    if(activeTab==='employees'){
      document.getElementById('emp-detail').style.display='none';
      document.getElementById('emp-list').style.display='block';
      document.getElementById('emp-search-wrap').style.display='block';
      renderEmpList();
    } else if(activeTab==='collection'){
      backColHome();
    }
  }

  // ── 搜索 ──
  function toggleSearch(){ const b=document.getElementById('search-bar'); b.style.display = b.style.display==='none'?'block':'none'; if(b.style.display==='block') document.getElementById('search-input').focus(); }

  // ── 月份 Sheet ──
  function openMonthSheet(){
    const body = document.getElementById('sheet-body');
    body.innerHTML = '<div class="loading">'+t('loading')+'</div>';
    openSheet(t('month'), body);
    api('/available-months').then(months=>{
      if(!months || !months.length){ body.innerHTML='<div class="empty-state">'+t('month')+'</div>'; return; }
      body.innerHTML = months.map(m=>'<div class="card-item" onclick="selectMonth(\''+m+'\')"><div class="card-item__body"><div class="card-item__title">'+m+'</div></div><div class="card-item__trailing">›</div></div>').join('');
    }).catch(()=>{ body.innerHTML='<div class="empty-state">'+t('month')+'</div>'; });
  }
  function selectMonth(m){
    closeSheet();
    api('/set-month', { method:'POST', body: JSON.stringify({ month:m }) }).then(r=>{
      if(r.ok){ STATE.dashboard=null; loadDashboard(); toast(m); } else { toast('无权限切换月份', 'warning'); }
    }).catch(()=>toast('切换失败','error'));
  }

  // ── Sheet ──
  function openSheet(title, bodyEl){ document.getElementById('sheet-title').textContent=title; document.getElementById('sheet').classList.add('show'); }
  function closeSheet(){ document.getElementById('sheet').classList.remove('show'); }

  // ── 认证 ──
  function checkAuth(){
    return api('/api/auth/status').then(a=>{
      STATE.auth = a;
      if(a.logged_in){ showApp(); return true; }
      showLogin(); return false;
    });
  }
  function showLogin(){ document.getElementById('login-screen').style.display='flex'; document.getElementById('app').style.display='none'; }
  function showApp(){ document.getElementById('login-screen').style.display='none'; document.getElementById('app').style.display='flex'; applyTheme(); applyLang(); loadDashboard(); loadOAPendingCount(); }
  function doLogin(e){
    e.preventDefault();
    const u=document.getElementById('login-user').value.trim(), p=document.getElementById('login-pass').value;
    api('/api/login', { method:'POST', body: JSON.stringify({ username:u, password:p }) }).then(r=>{
      if(r.ok){ showApp(); } else { toast(r.error==='invalid_credentials'?'用户名或密码错误':'登录失败','error'); }
    }).catch(()=>toast('登录失败','error'));
    return false;
  }

  // ── 数据台 ──
  STATE.dashOreFilter = 'all';   // all|nh|nl|mw
  STATE.dnTab = 'all';           // all|nh|nl|mw
  STATE.dashLoaded = false;

  function loadDashboard(){
    const sk=document.getElementById('dash-skeleton'), err=document.getElementById('dash-error'), empty=document.getElementById('dash-empty'), content=document.getElementById('dash-content');
    sk.style.display='block'; err.style.display='none'; empty.style.display='none'; content.style.display='none';
    api('/api/production/dashboard').then(d=>{
      // 需求1: 后端 shift_production 未排序,按日期升序(ISO 字符串可直接比较)
      if(Array.isArray(d.shift_production)) d.shift_production.sort((a,b)=> a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
      if(Array.isArray(d.driller_production)) d.driller_production.sort((a,b)=> a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
      if(Array.isArray(d.crush_production)) d.crush_production.sort((a,b)=> a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
      STATE.dashboard = d; STATE.currentMonth = d.month || '';
      document.getElementById('top-month').textContent = STATE.currentMonth;
      sk.style.display='none';
      const hasData = (d.shift_production||[]).length || (d.driller_production||[]).length || (d.crush_production||[]).length;
      if(!hasData){ empty.style.display='block'; return; }
      content.style.display='block';
      renderDashboard();
    }).catch(()=>{
      sk.style.display='none'; err.style.display='block';
      document.getElementById('dash-error-desc').textContent = STATE.currentMonth||'';
    });
  }

  function toggleDashFilter(){ document.getElementById('dash-control').classList.toggle('open'); }

  function setShiftFilter(v){ STATE.shiftFilter=v; document.querySelectorAll('#dash-shift-seg .segmented__option').forEach(o=>o.classList.toggle('active', o.dataset.v===v)); renderDashboard(); }
  function setOreFilter(v){ STATE.dashOreFilter=v; document.querySelectorAll('#dash-ore-seg .segmented__option').forEach(o=>o.classList.toggle('active', o.dataset.v===v)); renderDashboard(); }
  function setDnTab(v){ STATE.dnTab=v; document.querySelectorAll('#dn-cmp-tab .cmp-tab__item').forEach(o=>o.classList.toggle('active', o.dataset.v===v)); drawDayNight(); }

  // 按班次 + 矿石类型双重过滤，返回逐日 {date, nh, nl, mw, total}
  function filteredShift(){
    const d = STATE.dashboard; if(!d) return [];
    const ore = STATE.dashOreFilter; // all 时取合计
    return (d.shift_production||[]).map(s=>{
      let nh, nl, mw;
      if(STATE.shiftFilter==='day'){ nh=s.day_nh||0; nl=s.day_nl||0; mw=s.day_mw||0; }
      else if(STATE.shiftFilter==='night'){ nh=s.night_nh||0; nl=s.night_nl||0; mw=s.night_mw||0; }
      else { nh=s.total_nh||0; nl=s.total_nl||0; mw=s.total_mw||0; }
      if(ore==='nh'){ nh=nh; nl=0; mw=0; }
      else if(ore==='nl'){ nh=0; nl=nl; mw=0; }
      else if(ore==='mw'){ nh=0; nl=0; mw=mw; }
      return { date:s.date, nh, nl, mw, total:nh+nl+mw };
    });
  }

  function renderDashboard(){
    if(!STATE.dashboard) return;
    const data = filteredShift();
    const sum = (k)=>data.reduce((a,s)=>a+(s[k]||0),0);
    const totals = { nh:sum('nh'), nl:sum('nl'), mw:sum('mw') };
    const dayTot = data.map(s=>s.total).filter(x=>x>0);
    const avg = dayTot.length? dayTot.reduce((a,b)=>a+b,0)/dayTot.length : 0;
    const maxVal = dayTot.length? Math.max(...dayTot) : 0;
    // 日最高对应日期
    const maxDate = maxVal? (data.find(s=>s.total===maxVal)||{}).date||'' : '';
    // 白夜班比（不受矿石过滤影响，用原始 shift 数据）
    const daySum = (STATE.dashboard.shift_production||[]).reduce((a,s)=>a+s.day_nh+s.day_nl+s.day_mw,0);
    const nightSum = (STATE.dashboard.shift_production||[]).reduce((a,s)=>a+s.night_nh+s.night_nl+s.night_mw,0);
    const ratio = nightSum? (daySum/nightSum).toFixed(2)+':1' : '—';

    // 6 KPI：本月NH/NL/MW + 日均 + 日最高(带kpi-sub) + 白夜班比
    const kpis = [
      { l:t('kpi_nh_month'), v:fmt(totals.nh), ind:'ind-i4' },
      { l:t('kpi_nl_month'), v:fmt(totals.nl), ind:'ind-i2' },
      { l:t('kpi_mw_month'), v:fmt(totals.mw), ind:'ind-i5' },
      { l:t('kpi_daily_avg'), v:fmt(Math.round(avg)), ind:'ind-neutral' },
      { l:t('kpi_day_max'), v:fmt(maxVal), sub:maxDate? maxDate.slice(5).replace('-','/') : '', ind:'ind-i2' },
      { l:t('kpi_ratio'), v:ratio, ind:'ind-i4' },
    ];
    document.getElementById('kpi-grid').innerHTML = kpis.map(k=>'<div class="kpi '+k.ind+'"><div class="kpi__label">'+k.l+'</div><div class="kpi__value">'+k.v+'</div>'+(k.sub?'<div class="kpi-sub">'+k.sub+'</div>':'')+'</div>').join('');

    drawTrend();
    drawDayNight();
    drawDriller();
    drawOre(totals);
    renderCrush();
  }

  function newChart(id, cfg){
    if(STATE.charts[id]) STATE.charts[id].destroy();
    const el=document.getElementById(id);
    if(!el) return;
    // 移除 chart-loading 遮罩
    const wrap=el.closest('.chart-loading'); if(wrap) wrap.classList.remove('chart-loading');
    STATE.charts[id] = new Chart(el, cfg);
  }
  function baseOpts(){ return { responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false }, datalabels:{ display:false } }, scales:{ x:{ ticks:{ font:{size:9}, maxRotation:0 }, grid:{ display:false } }, y:{ ticks:{ font:{size:9} }, grid:{ color:'hsl(44 26.32% 88.82%)' } } } }; }

  // 产量趋势：白班/夜班/合计 三线（设计稿 dashboard.html:450-460）
  // 趋势图直接读原始 shift 数据（三线本身即班次维度），矿石过滤生效
  // 需求3: K线式交互 — 缩放/平移(chartjs-plugin-zoom 本地引入) + 十字光标 + tooltip 三值
  let _trendZoomAvailable = (typeof ChartZoom !== 'undefined');
  const crosshairPlugin = {
    id: 'mobileCrosshair',
    afterDraw(chart){
      if(chart.$cx === undefined || chart.$cy === undefined) return;
      const ctx = chart.ctx, area = chart.chartArea;
      ctx.save();
      ctx.strokeStyle = 'rgba(60,53,43,0.28)';
      ctx.setLineDash([3,3]);
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(chart.$cx, area.top); ctx.lineTo(chart.$cx, area.bottom); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(area.left, chart.$cy); ctx.lineTo(area.right, chart.$cy); ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }
  };
  function trendHover(e, els, chart){
    const area = chart.chartArea;
    if(e.x >= area.left && e.x <= area.right && e.y >= area.top && e.y <= area.bottom){
      chart.$cx = e.x; chart.$cy = e.y;
    } else { chart.$cx = undefined; chart.$cy = undefined; }
    chart.draw();
  }
  function drawTrend(){
    const sp = STATE.dashboard.shift_production || [];
    if(!sp.length) return;
    const ore = STATE.dashOreFilter;
    const labels = sp.map(s=>s.date.slice(5));
    const pick = (s, f)=> ore==='nh'? (s[f+'_nh']||0) : ore==='nl'? (s[f+'_nl']||0) : ore==='mw'? (s[f+'_mw']||0) : (s[f+'_nh']||0)+(s[f+'_nl']||0)+(s[f+'_mw']||0);
    const opts = Object.assign(baseOpts(), {
      plugins:{
        legend:{ display:true, position:'bottom', labels:{ font:{size:9} } },
        tooltip:{ mode:'index', intersect:false },
      },
      hover:{ mode:'index', intersect:false },
      onHover: trendHover,
    });
    if(_trendZoomAvailable){
      opts.plugins.zoom = {
        pan: { enabled: true, mode:'x' },
        zoom: { wheel: { enabled: true }, pinch: { enabled: true }, mode:'x' },
      };
    }
    newChart('chart-trend', { type:'line', data:{ labels, datasets:[
      { label:t('day'), data:sp.map(s=>pick(s,'day')), borderColor:'hsl(200 60% 45%)', backgroundColor:'hsl(200 60% 45% / 0.08)', fill:true, tension:0.3, pointRadius:0 },
      { label:t('night'), data:sp.map(s=>pick(s,'night')), borderColor:'hsl(180 50% 40%)', backgroundColor:'hsl(180 50% 40% / 0.08)', fill:false, tension:0.3, pointRadius:0 },
      { label:t('total'), data:sp.map(s=>pick(s,'total')), borderColor:'hsl(28.99 91.75% 61.96%)', backgroundColor:'transparent', borderWidth:2, tension:0.3, pointRadius:0 },
    ]}, options: opts, plugins:[crosshairPlugin] });
    // 修复: zoom 插件精简版(12KB)defaults 无 doubleClick 配置,双击重置不生效。
    // 改手动 dblclick 监听调用 chart.resetZoom()(函数存在且可用),防重复绑定用 canvas 标志。
    const _trendEl = document.getElementById('chart-trend');
    if(_trendEl && !_trendEl._zoomDblListener){
      _trendEl._zoomDblListener = true;
      _trendEl.addEventListener('dblclick', ()=>{ const c=STATE.charts['chart-trend']; if(c && c.resetZoom) c.resetZoom(); });
    }
  }
  // 白班 vs 夜班：按 dnTab 切换 NH/NL/MW/合计 双柱
  function drawDayNight(){
    const sp = STATE.dashboard.shift_production || [];
    const labels = sp.map(s=>s.date.slice(5));
    const ore = STATE.dnTab;
    const field = ore==='nh'?'nh':(ore==='nl'?'nl':(ore==='mw'?'mw':null));
    const dayData = sp.map(s=> field? (s['day_'+field]||0) : (s.day_nh+s.day_nl+s.day_mw));
    const nightData = sp.map(s=> field? (s['night_'+field]||0) : (s.night_nh+s.night_nl+s.night_mw));
    newChart('chart-daynight', { type:'bar', data:{ labels, datasets:[
      { label:t('day_shift'), data:dayData, backgroundColor:'hsl(200 60% 45%)', borderRadius:3 },
      { label:t('night_shift'), data:nightData, backgroundColor:'hsl(180 50% 40%)', borderRadius:3 },
    ]}, options: Object.assign(baseOpts(), { plugins:{ legend:{ display:true, position:'bottom', labels:{ font:{size:9} } } } }) });
  }
  // 钻工组产量：堆叠柱按 NH/NL/MW（支持点击下钻占位）
  function drawDriller(){
    const dp = STATE.dashboard.driller_production || [];
    if(!dp.length){ document.getElementById('chart-driller').style.display='none'; return; }
    document.getElementById('chart-driller').style.display='block';
    const labels = dp.map(s=>s.date.slice(5));
    newChart('chart-driller', { type:'bar', data:{ labels, datasets:[
      { label:t('nh'), data:dp.map(s=>s.nh||0), backgroundColor:'hsl(55 24% 49%)', borderRadius:2 },
      { label:t('nl'), data:dp.map(s=>s.nl||0), backgroundColor:'hsl(0 15% 32%)', borderRadius:2 },
      { label:t('mw'), data:dp.map(s=>s.mw||0), backgroundColor:'hsl(70 10% 50%)', borderRadius:2 },
    ]}, options: Object.assign(baseOpts(), { plugins:{ legend:{ display:true, position:'bottom', labels:{ font:{size:9} } } }, scales:{ x:{ stacked:true, ticks:{font:{size:9}, maxRotation:0} }, y:{ stacked:true, ticks:{font:{size:9}} } } }) });
  }
  // 矿石类型占比：环形图 + 中心总车次 + 右侧百分比 legend
  function drawOre(totals){
    const sum = totals.nh+totals.nl+totals.mw;
    document.getElementById('donut-total').textContent = fmt(sum);
    const colors = ['hsl(55 24% 49%)','hsl(0 15% 32%)','hsl(70 10% 50%)'];
    const items = [[t('nh'),totals.nh,'st-nh'],[t('nl'),totals.nl,'st-nl'],[t('mw'),totals.mw,'st-mw']];
    document.getElementById('ore-legend').innerHTML = items.map(([lab,v,dummy],i)=>{
      const pct = sum? Math.round(v/sum*100) : 0;
      return '<div class="donut-legend__item"><span class="donut-legend__dot" style="background:'+colors[i]+'"></span>'+lab+'<span class="donut-legend__pct">'+pct+'%</span></div>';
    }).join('');
    newChart('chart-ore', { type:'doughnut', data:{ labels:[t('nh'),t('nl'),t('mw')], datasets:[{ data:[totals.nh,totals.nl,totals.mw], backgroundColor:colors, borderWidth:2, borderColor:'var(--card)' }] },
      options:{ responsive:true, maintainAspectRatio:false, cutout:'62%', plugins:{ legend:{ display:false }, datalabels:{ display:false } } } });
  }
  // 破碎产量三列表
  function renderCrush(){
    const cp = STATE.dashboard.crush_production || [];
    const list = document.getElementById('crush-list');
    if(!cp.length){ list.innerHTML=''; document.getElementById('crush-total-bags').textContent='0'; document.getElementById('crush-total-emp').textContent='0'; return; }
    let tb=0, te=0;
    list.innerHTML = cp.map(c=>{ tb+=c.bags; te+=c.personnel_count||0;
      return '<div class="crush-table__row"><span>'+c.date.slice(5).replace('-','/')+'</span><span class="num">'+fmt(c.bags)+'</span><span>'+((c.personnel_count||0))+'</span></div>'; }).join('');
    document.getElementById('crush-total-bags').textContent = fmt(tb);
    document.getElementById('crush-total-emp').textContent = te;
  }

  // ── 员工模块 (Phase 2) ──
  STATE.employees = [];
  STATE.empSeg = 'list';
  STATE._empSearchTimer = null;
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function empCard(e){

    const nameParts = String(e.name||'').trim().split(/\s+/);
    const enName = nameParts.length>1? nameParts.slice(1).join(' ') : '';

    if(e.position) meta.push(e.position);

      + '<div class="emp-card__body"><div class="emp-card__name">'+esc(e.name||'')+(e.alias?(' ('+esc(e.alias)+')'):'')+'</div>'
      + '<div class="emp-card__meta">'+meta.join(' · ')+'</div></div>'

  function renderEmpList(){

  function openEmpProfile(id){
    pushPage(t('emp_profile'));
    document.getElementById('emp-list').style.display='none';
    document.getElementById('emp-search-wrap').style.display='none';

  function kv(k,v){ return '<div class="info-row"><span class="info-row__label">'+k+'</span><span class="info-row__value">'+esc(v)+'</span></div>'; }
  function renderEmpProfile(e, att, sal){
    const role = STATE.auth && STATE.auth.role;
    const canEdit = role==='admin' || role==='super_admin';
    const isSuper = role==='super_admin';
    // 出勤统计
    let attDays=0, leaveDays=0, absentDays=0;
    const attRow = att && att.rows ? att.rows.find(r=>r.id===e.id) : null;
    if(attRow && attRow.days){ Object.values(attRow.days).forEach(s=>{ const v=(s||'').toUpperCase(); if(v==='P'||v==='D'||v==='N'||v==='C'||v==='R'||v==='B') attDays++; else if(v==='L') leaveDays++; else if(v==='A') absentDays++; }); }
    // 薪资概览
    let gross=null, net=null;
    const salRow = sal && sal.result && sal.result.employees ? sal.result.employees.find(r=>r.employee_id===e.id) : null;
    if(salRow){ gross=salRow.gross; net=salRow.net; }
    const base = STATE.employees.find(x=>x.id===e.id) || {};
    const idTags = [];
    if(e.custom_number) idTags.push('<span class="profile-tag profile-tag--primary">#'+esc(e.custom_number)+'</span>');
    if(e.alias) idTags.push('<span class="profile-tag">'+esc(e.alias)+'</span>');

    let html = '<div class="profile-header"><div class="profile-avatar">'+(e.avatar_path?('<img src="'+esc(e.avatar_path)+'">'):esc((e.name||'?').slice(0,1)))+'</div>'
      + '<div class="profile-name">'+esc(e.name||'')+'</div>'
      + (idTags.length?'<div class="profile-id-tags">'+idTags.join('')+'</div>':'')
      + '</div>';
    // 基本信息
    html += '<div class="info-section"><div class="info-section__title">'+t('basic_info')+'</div>';
    const info = [['dept',e.department],['team',base.team||e.team||''],['position',base.position||''],['gender',e.gender],['dob',e.date_of_birth||''],['salary_type',e.override_type||e.default_type||''],['phone',e.phone],['nida',e.nida_number],['nssf',e.nssf_number],['bank',e.bank_name||'']];
    info.forEach(r=>{ if(r[1]!=null&&r[1]!=='') html+=kv(t(r[0]), r[1]); });
    html += '</div>';
    // 出勤统计 mini 卡
    html += '<div class="info-section"><div class="info-section__title">'+t('att_stats')+'</div>'
      + '<div class="mini-card-row">'
      + '<div class="mini-stat-card"><span class="mini-stat-card__value">'+attDays+'</span><span class="mini-stat-card__label">'+t('att_days')+'</span></div>'
      + '<div class="mini-stat-card"><span class="mini-stat-card__value">'+leaveDays+'</span><span class="mini-stat-card__label">'+t('leave_days')+'</span></div>'
      + '<div class="mini-stat-card"><span class="mini-stat-card__value">'+absentDays+'</span><span class="mini-stat-card__label">'+t('absent_days')+'</span></div>'
      + '</div></div>';
    // 薪资概览
    if(gross!=null || net!=null){
      html += '<div class="info-section"><div class="info-section__title">'+t('salary_overview')+'</div>'
        + '<div class="mini-card-row">'
        + '<div class="mini-stat-card"><span class="mini-stat-card__value">'+fmt(gross||0)+'</span><span class="mini-stat-card__label">'+t('gross')+'</span></div>'
        + '<div class="mini-stat-card"><span class="mini-stat-card__value">'+fmt(net||0)+'</span><span class="mini-stat-card__label">'+t('net')+'</span></div>'
        + '</div></div>';
    }
    // 操作
    html += '<div class="profile-actions">'
      + '<button class="btn" onclick="openLeave(\''+esc(e.id)+'\')">'+t('leave_apply')+'</button>'
      + (canEdit?'<button class="btn btn-primary" onclick="openEditEmp(\''+esc(e.id)+'\')">'+t('edit_profile')+'</button>':'')
      + '</div>';
    document.getElementById('emp-detail').innerHTML = html;
  }

  function submitEditEmp(id){
    const data = { team: document.getElementById('ed-team').value.trim(), position: document.getElementById('ed-position').value.trim(), phone: document.getElementById('ed-phone').value.trim(), alias: document.getElementById('ed-alias').value.trim(), custom_number: document.getElementById('ed-custom-number').value.trim() };

  function loadOAPendingCount(){
    api('/api/oa/pending/count').then(d=>{
      const n = d.count||0;
      const badge = document.getElementById('oa-pending-n');
      if(badge){ badge.textContent = n; badge.style.display = n>0? 'inline-flex':'none'; }

  function loadOA(mode){
    const el = document.getElementById('oa-list');
    el.innerHTML='<div class="skeleton-card kpi"></div><div class="skeleton-card kpi"></div>';
    const url = mode==='history' ? '/api/oa/history' : '/api/oa/pending';
    api(url).then(d=>{
      const evs = d.events||[];
      if(mode!=='history'){ const badge=document.getElementById('oa-pending-n'); if(badge){ badge.textContent=evs.length; badge.style.display=evs.length>0?'inline-flex':'none'; } }
      if(!evs.length){
        el.innerHTML='<div class="state-box"><div class="state-box__icon">✅</div><div class="state-box__title">'+(mode==='history'?t('oa_done_desc'):t('no_oa'))+'</div></div>';
        return;
      }
      el.innerHTML = evs.map(ev=>oaCard(ev, mode)).join('');
    }).catch(()=>{ el.innerHTML='<div class="state-box"><div class="state-box__icon">⚠️</div><div class="state-box__title">'+t('load_fail')+'</div><button class="state-box__action" onclick="loadOA(\''+mode+'\')">'+t('retry')+'</button></div>'; });
  }
  function oaCard(ev, mode){
    const typeMap = { hire:t('oa_hire'), transfer:t('oa_transfer'), dismiss:t('oa_dismiss'), resign:t('oa_resign'), leave:t('oa_leave'), salary_change:t('oa_salary') };
    let summary='';
    try { const p = JSON.parse(ev.payload||'{}'); summary = p.note || (p.days? (p.days+' '+t('days')) : (p.new_position? t('oa_transfer')+': '+p.new_position : '')); } catch(e){}
    let html = '<div class="oa-card">'
      + '<div class="oa-card__head"><span class="oa-card__type">'+esc(typeMap[ev.event_type]||ev.event_type)+'</span><span class="oa-card__emp">'+esc(ev.employee_name||ev.employee_id)+'</span></div>'
      + (summary?'<div class="oa-card__desc">'+esc(summary)+'</div>':'')
      + '<div class="oa-card__date">'+esc(ev.effective_date||'')+'</div>';
    if(mode==='pending'){
      html += '<div class="oa-card__actions"><button class="btn btn-primary" onclick="approveOA('+ev.id+')">'+t('approve')+'</button><button class="btn" onclick="openRejectModal('+ev.id+',\''+esc(ev.employee_name||'')+'\')">'+t('reject')+'</button></div>';
    } else {
      const st = ev.status==='approved';
      html += '<div class="oa-card__desc" style="margin-top:6px;"><span class="oa-status-badge '+(st?'approved':'rejected')+'">'+(st?t('approved'):t('rejected'))+'</span>'+(ev.reject_reason?(' <span style="color:var(--muted-foreground);">'+esc(ev.reject_reason)+'</span>'):'')+'</div>';
    }
    html += '</div>';
    return html;
  }
  function approveOA(id){ api('/api/oa/events/'+id+'/approve', { method:'POST', body:'{}' }).then(r=>{ if(r.ok){ toast(t('approved')); loadOA('pending'); } else toast(r.error||t('fail'),'error'); }); }
  // 拒绝原因 Modal（非 prompt）
  function openRejectModal(id, empName){
    const body = '<div class="oa-card" style="margin-bottom:12px;"><div class="oa-card__head"><span class="oa-card__type">'+t('reject')+'</span><span class="oa-card__emp">'+esc(empName||'')+'</span></div></div>'
      + '<div class="field"><label class="field__label">'+t('reject_reason')+'</label><textarea id="rj-reason" rows="3" placeholder="'+t('reject_hint')+'"></textarea></div>';

  function submitRejectOA(id){

  // ── 全局搜索（员工列表过滤，防抖 300ms）──
  function onSearch(v){ STATE._empSearch = v||''; if(activeTab==='employees' && STATE.empSeg==='list') renderEmpList(); }

  // ── 数据采集 (Phase 3) ──
  STATE.colType = '';
  function ck(id){ return (document.getElementById(id).value||'').split(',').filter(Boolean); }
  // 需求5: 部门池工具(中文关键字 contains)
  function deptHas(e,k){ return (e.department||'').includes(k); }
  function deptPool(kind){
    return STATE.employees.filter(e=>{
      const d=e.department||'';
      if(kind==='underground') return d.includes('井下');
      if(kind==='driller') return d.includes('钻工');
      if(kind==='crush') return d.includes('破碎')||d.includes('分拣');
      if(kind==='other') return !(d.includes('井下')||d.includes('钻工')||d.includes('破碎')||d.includes('分拣'));
      return true;
    });
  }
  // 人员多选行（worker-item：checkbox + 姓名 + 工号）。pool 限定可选员工，缺省为全部
  function empChecklistHTML(hid, selected, prefix, pool){
    const list = pool || STATE.employees;
    const sel = new Set(selected||[]);
    const p = prefix||'';
    return '<div id="'+hid+'List" style="max-height:36vh;overflow:auto;border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px;margin-top:6px;">'
      + (list.length? list.map(e=>'<div class="worker-item" onclick="if(event.target.tagName!==\'INPUT\')this.querySelector(\'input\').click()"><input type="checkbox" value="'+esc(e.id)+'" '+(sel.has(e.id)?'checked':'')+' onchange="syncChecklist(\''+hid+'\',\''+p+'\')"> <span class="worker-item__name">'+esc(e.name||'')+'</span> <span class="worker-item__id">#'+esc(e.custom_number||e.id)+'</span></div>').join('') : '<div class="worker-item" style="justify-content:center;color:var(--muted-foreground);">'+t('no_emp')+'</div>')
      + '</div>';
  }
  function syncChecklist(hid, prefix){
    const ids=[...document.querySelectorAll('#'+hid+'List input:checked')].map(c=>c.value);
    document.getElementById(hid).value=ids.join(',');
    if(prefix && document.getElementById(prefix+'-count')) document.getElementById(prefix+'-count').textContent = ids.length;
    // 需求5: 井下出勤人员勾选 → 联动刷新驾驶员候选
    if(hid==='ugDayEmps') refreshUgDrivers('ugDay');
    else if(hid==='ugNightEmps') refreshUgDrivers('ugNight');
  }

  // ── 采集首页：4 entry 大卡 + 最近提交历史 ──
  function loadCollectionHome(){
    const home = document.getElementById('col-home');
    // SVG 图标（对齐 §3.1 决策：emoji 仅内容场景，采集图标统一 inline SVG）
    const SVG_UG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M14 4l6 6-9 9-3-3 9-9-3-3zM5 17l-2 2 3 3 2-2"/></svg>';
    const SVG_DR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M14 6l4 4-8 8H6v-4l8-8z"/><path d="M3 21l3-3"/></svg>';
    const SVG_CR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M3 17l4-6 4 4 3-5 7 9H3z"/><circle cx="9" cy="9" r="1.5"/></svg>';
    const SVG_AT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><rect x="5" y="4" width="14" height="17" rx="1"/><path d="M9 4V2h6v2"/><path d="M8 9h8M8 13h6M8 17h4"/></svg>';
    const types = [['underground',t('col_ug'),SVG_UG],['driller',t('col_dr'),SVG_DR],['crush',t('col_cr'),SVG_CR],['attendance',t('col_att'),SVG_AT]];
    home.innerHTML =
      '<div class="entry-grid">'+types.map(([ty,label,icon])=>'<button class="entry-card" onclick="openColForm(\''+ty+'\')">'
        + '<div class="entry-card__icon">'+icon+'</div>'
        + '<div class="entry-card__title">'+label+'</div>'
        + '<div class="entry-card__meta" id="col-cnt-'+ty+'">'+t('loading')+'</div>'
        + '<div class="entry-card__footer"><span data-i18n="col_enter">进入采集</span><span class="entry-card__chevron">›</span></div>'
        + '</button>').join('')+'</div>'
      + '<div class="section-title">'+t('col_history')+'</div>'
      + '<div class="history-list" id="col-recent"><div class="history-row"><span class="history-row__date">'+t('loading')+'</span></div></div>';
    ['underground','driller','crush','attendance'].forEach(ty=>{
      apiStatus('/api/collection/history?form_type='+ty).then(({status,json})=>{
        const el=document.getElementById('col-cnt-'+ty); if(!el) return;
        if(status===403){ el.innerHTML = t('need_editor'); return; }
        if(status!==200){ el.innerHTML = t('load_fail'); return; }
        const s=(json.submissions||[]);
        const monthCount = s.filter(x=>(x.submission_date||'').startsWith(STATE.currentMonth)).length;
        const last = s[0];
        let html = t('col_month_count',{n:monthCount});
        if(last) html += '<br>'+t('col_last_submit',{d:last.submission_date||''});
        else html += '<br>'+t('no_submit');
        el.innerHTML = html;
      }).catch(()=>{ const el=document.getElementById('col-cnt-'+ty); if(el) el.innerHTML=t('need_editor'); });
    });
    apiStatus('/api/collection/history').then(({status,json})=>{
      const subs=(json.submissions||[]).slice(0,8);
      const el=document.getElementById('col-recent'); if(!el) return;
      if(status===403){ el.innerHTML='<div class="history-row"><span class="history-row__date">'+t('need_editor')+'</span></div>'; return; }
      if(status!==200){ el.innerHTML='<div class="history-row"><span class="history-row__date">'+t('load_fail')+'</span></div>'; return; }
      const typeLabel = { underground:t('col_ug'), driller:t('col_dr'), crush:t('col_cr'), attendance:t('col_att') };
      el.innerHTML = subs.length? subs.map(s=>{
        // 解析班次标注
        let shiftChip='', sub='';
        try{
          const p = JSON.parse(s.payload||'{}');
          if(s.form_type==='underground'){
            const dayEmps=(p.day&&p.day.emps)||[], nightEmps=(p.night&&p.night.emps)||[];
            if(dayEmps.length && nightEmps.length){ shiftChip='<span class="shift-chip day">D</span><span class="shift-chip night">N</span>'; }
            else if(dayEmps.length) shiftChip='<span class="shift-chip day">D</span>';
            else if(nightEmps.length) shiftChip='<span class="shift-chip night">N</span>';
            sub = (dayEmps.length+nightEmps.length)+' '+t('emp');
          } else if(s.form_type==='driller'){ const teams=p.teams||[]; sub = teams.length+' '+t('add_team'); }
          else if(s.form_type==='crush'){ sub = (p.bags||0)+' '+t('bags')+' · '+((p.emps||[]).length)+' '+t('emp'); }
          else if(s.form_type==='attendance'){ sub = (p.marks||[]).length+' '+t('emp'); }
        }catch(e){}
        return '<div class="history-row"><span class="history-row__date">'+esc(s.submission_date||'')+shiftChip+'</span><span class="history-row__type">'+esc(typeLabel[s.form_type]||s.form_type)+'</span><span class="history-row__sub">'+sub+'</span></div>';
      }).join('') : '<div class="history-row"><span class="history-row__date">'+t('no_history')+'</span></div>';
    }).catch(()=>{ const el=document.getElementById('col-recent'); if(el) el.innerHTML='<div class="history-row"><span class="history-row__date">'+t('load_fail')+'</span></div>'; });
  }
  function openColForm(ty){ STATE.colType=ty; const titleKey = ty==='underground'?'col_ug':(ty==='driller'?'col_dr':(ty==='crush'?'col_cr':'col_att')); pushPage(t(titleKey)); document.getElementById('top-title').textContent = t(titleKey); document.getElementById('col-home').style.display='none'; document.getElementById('col-form').style.display='block';
    if(ty==='underground') renderUgForm(); else if(ty==='driller') renderDrForm(); else if(ty==='crush') renderCrForm(); else renderAttForm(); }
  function backColHome(){ _pageStack=[]; document.getElementById('topback').classList.remove('visible'); document.getElementById('col-form').style.display='none'; document.getElementById('col-home').style.display='block'; document.getElementById('top-title').textContent = t('tab_collection'); loadCollectionHome(); }

  // form-message 内联校验 + 提交 loading 态
  function showFormMsg(ty, msg, ok){
    const el=document.getElementById('colFormMsg');
    if(!el) return;
    el.textContent = msg||'';
    el.className = 'form-message visible '+(ok?'success':'error');
  }
  function clearFormMsg(){ const el=document.getElementById('colFormMsg'); if(el){ el.textContent=''; el.className='form-message'; } }
  function colSubmit(ty, payload, validate){
    const date=document.getElementById('colDate').value;
    if(!date){ showFormMsg(ty, t('val_date'), false); return; }
    if(validate && !validate(payload)) return;
    const btn = document.getElementById('colSubmitBtn');
    if(btn){ btn.disabled=true; btn.textContent=t('submitting'); }
    api('/api/collection/submit', { method:'POST', body: JSON.stringify({ form_type:ty, submission_date:date, payload }) }).then(r=>{
      if(r.ok){ showFormMsg(ty, t('success'), true); setTimeout(()=>{ backColHome(); }, 500); }
      else { showFormMsg(ty, r.error||t('fail'), false); if(btn){ btn.disabled=false; btn.textContent=t('submit'); } }
    }).catch(()=>{ showFormMsg(ty, t('fail'), false); if(btn){ btn.disabled=false; btn.textContent=t('submit'); } });
  }

  // 需求5: 驾驶员候选 = 已选中的出勤人员(天然是 emps 子集)
  function refreshUgDrivers(seg){
    const empIds = ck(seg+'Emps');
    const cand = STATE.employees.filter(e=>empIds.includes(e.id));
    const prev = ck(seg+'Drivers').filter(id=>empIds.includes(id)); // 保留仍合法的已选
    document.getElementById(seg+'Drivers').value = prev.join(',');
    const cnt = document.getElementById(seg+'Drv-count'); if(cnt) cnt.textContent = t('col_selected_count',{n:prev.length});
    document.getElementById(seg+'DriversBox').innerHTML = empChecklistHTML(seg+'Drivers', prev, seg+'Drv', cand);
  }
  function submitUg(){
    const payload={ submission_date:document.getElementById('colDate').value,
      day:{ nh:+document.getElementById('ugDayNh').value||0, nl:+document.getElementById('ugDayNl').value||0, mw:+document.getElementById('ugDayMw').value||0, emps:ck('ugDayEmps'), drivers:ck('ugDayDrivers') },
      night:{ nh:+document.getElementById('ugNightNh').value||0, nl:+document.getElementById('ugNightNl').value||0, mw:+document.getElementById('ugNightMw').value||0, emps:ck('ugNightEmps'), drivers:ck('ugNightDrivers') } };
    colSubmit('underground', payload, (p)=>{
      if(p.day.emps.length===0 && p.night.emps.length===0){ showFormMsg('underground', t('val_workers'), false); return false; }

      + '<div class="field"><label class="field__label">'+t('captain')+'</label><select id="drCap'+i+'" onchange="STATE._drSlots['+i+'].captain=this.value">'+capOpts(s.captain)+'</select></div>'
      + '<div style="display:flex;gap:6px;"><div class="field" style="flex:1;"><label class="field__label">'+t('nh')+'</label><input type="number" id="drNh'+i+'" value="'+s.nh+'" min="0" inputmode="numeric" pattern="[0-9]*"></div><div class="field" style="flex:1;"><label class="field__label">'+t('nl')+'</label><input type="number" id="drNl'+i+'" value="'+s.nl+'" min="0" inputmode="numeric" pattern="[0-9]*"></div><div class="field" style="flex:1;"><label class="field__label">'+t('mw')+'</label><input type="number" id="drMw'+i+'" value="'+s.mw+'" min="0" inputmode="numeric" pattern="[0-9]*"></div></div>'
      + '<div class="field"><label class="field__label">'+t('members')+'</label><input type="hidden" id="drMem'+i+'" value="'+(s.members||[]).join(',')+'"><div class="col-count-hint" id="drMem'+i+'-count">'+t('col_selected_count',{n:(s.members||[]).length})+'</div><div id="drMemBox'+i+'"></div></div>'
      + (STATE._drSlots.length>1?'<button class="btn btn-block" onclick="removeDrSlotM('+i+')" style="margin-top:6px;">'+t('remove')+'</button>':'')+'</div>').join('');
    STATE._drSlots.forEach((s,i)=>{ const box=document.getElementById('drMemBox'+i); if(box) box.innerHTML=empChecklistHTML('drMem'+i, s.members||[], 'drMem'+i, deptPool('driller')); });
  }
  function syncDrSlotsFromDom(){ STATE._drSlots.forEach((s,i)=>{ const c=document.getElementById('drCap'+i); if(c) s.captain=c.value; const nh=document.getElementById('drNh'+i); if(nh) s.nh=+nh.value||0; const nl=document.getElementById('drNl'+i); if(nl) s.nl=+nl.value||0; const mw=document.getElementById('drMw'+i); if(mw) s.mw=+mw.value||0; s.members=ck('drMem'+i); }); }
  function addDrSlotM(){ syncDrSlotsFromDom(); STATE._drSlots.push({captain:'',nh:0,nl:0,mw:0,members:[]}); renderDrSlotsM(); }
  function removeDrSlotM(i){ syncDrSlotsFromDom(); STATE._drSlots.splice(i,1); renderDrSlotsM(); }
  function submitDr(){ const date=document.getElementById('colDate').value; if(!date){ showFormMsg('driller', t('val_date'), false); return; } const teams=[];
    for(let i=0;i<STATE._drSlots.length;i++){ const cap=document.getElementById('drCap'+i).value; if(!cap) continue; teams.push({ captain:cap, nh:+document.getElementById('drNh'+i).value||0, nl:+document.getElementById('drNl'+i).value||0, mw:+document.getElementById('drMw'+i).value||0, members:ck('drMem'+i) }); }
    if(!teams.length){ showFormMsg('driller', t('pick_captain'), false); return; }
    colSubmit('driller', { submission_date:date, teams }, null); }

  // 破碎计件
  function renderCrForm(){ const d=new Date().toISOString().slice(0,10);
    document.getElementById('col-form').innerHTML='<div class="form-head"><span class="form-head__title">'+t('col_cr')+'</span></div>'
      + '<div class="field"><label class="field__label">'+t('date')+'</label><input type="date" id="colDate" value="'+d+'"></div>'
      + '<div class="form-message" id="colFormMsg"></div>'
      + '<div class="field"><label class="field__label">'+t('bags')+'</label><input type="number" id="crBags" value="0" min="0" inputmode="numeric" pattern="[0-9]*"></div>'
      + '<div class="field"><label class="field__label">'+t('crush_crew')+'</label><input type="hidden" id="crEmps"><div class="col-count-hint" id="crEmps-count">'+t('col_selected_count',{n:0})+'</div><div id="crEmpsBox"></div></div>'
      + '<div class="field"><label class="field__label">'+t('remark')+'</label><input type="text" id="crRemark"></div>'
      + '<button class="btn btn-primary btn-block" id="colSubmitBtn" onclick="submitCr()">'+t('submit')+'</button>';
    document.getElementById('crEmpsBox').innerHTML=empChecklistHTML('crEmps',[],'crEmps', deptPool('crush'));
  }
  function submitCr(){ const date=document.getElementById('colDate').value; if(!date){ showFormMsg('crush', t('val_date'), false); return; }
    const bags=+document.getElementById('crBags').value||0;
    if(bags<=0){ showFormMsg('crush', t('val_bags'), false); return; }
    if(!ck('crEmps').length){ showFormMsg('crush', t('val_workers'), false); return; }
    colSubmit('crush', { submission_date:date, bags, emps:ck('crEmps'), remark:document.getElementById('crRemark').value.trim() }, null); }

  // 出勤收集（需求5: 仅"其他"部门 — 除井下/钻工/破碎/分拣）
  async function renderAttForm(){ const d=new Date().toISOString().slice(0,10); const pool=deptPool('other');
    const depts=[...new Set(pool.map(e=>e.department).filter(Boolean))].sort();
    document.getElementById('col-form').innerHTML='<div class="form-head"><span class="form-head__title">'+t('col_att')+'</span></div>'
      + '<div class="field"><label class="field__label">'+t('date')+'</label><input type="date" id="colDate" value="'+d+'"></div>'
      + '<div class="form-message" id="colFormMsg"></div>'
      + '<div class="field"><label class="field__label">'+t('dept')+'</label><select id="attDept" onchange="renderAttRoster()">'+'<option value="">'+t('all_depts')+'</option>'+depts.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('')+'</select></div>'
      + '<div class="col-batch-row"><button class="btn" onclick="attBatchAll(\'P\')">'+t('batch_all_p')+'</button><button class="btn" onclick="attBatchAll(\'A\')">'+t('batch_all_a')+'</button></div>'
      + '<div id="attRoster" style="max-height:45vh;overflow:auto;"></div>'
      + '<div class="col-count-hint" id="attRosterCount"></div>'
      + '<button class="btn btn-primary btn-block" id="colSubmitBtn" onclick="submitAtt()">'+t('submit')+'</button>';
    renderAttRoster();
  }
  function attRosterEmpIds(){
    const sel=document.getElementById('attDept').value;
    return deptPool('other').filter(e=>!sel||e.department===sel);
  }
  function renderAttRoster(){ const list=attRosterEmpIds();
    const box=document.getElementById('attRoster'); if(!box) return;
    box.innerHTML=list.map(e=>'<div class="worker-item"><span class="worker-item__name" style="flex:1;">'+esc(e.name||'')+' <span class="worker-item__id">#'+esc(e.custom_number||e.id)+'</span></span><select id="attSt'+esc(e.id)+'" onchange="" style="min-height:44px;padding:4px 8px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;background:var(--background);color:var(--foreground);"><option value="P">P</option><option value="A">A</option><option value="L">L</option><option value="D">D</option><option value="N">N</option><option value="C">C</option><option value="R">R</option><option value="B">B</option></select></div>').join('');
    const c=document.getElementById('attRosterCount'); if(c) c.textContent=t('col_total_count',{n:list.length});
  }
  function attBatchAll(status){ const list=attRosterEmpIds(); list.forEach(e=>{ const el=document.getElementById('attSt'+e.id); if(el) el.value=status; }); }
  function submitAtt(){ const date=document.getElementById('colDate').value; if(!date){ showFormMsg('attendance', t('val_date'), false); return; }
    const marks=attRosterEmpIds().map(e=>({employee_id:e.id, status:document.getElementById('attSt'+e.id).value}));
    colSubmit('attendance', { submission_date:date, marks }, null); }

  // ── 出勤模块 (Phase 4 / 2e) ──
  const ATT_STATUS = ['P','A','L','D','N','C','R','B'];
  const ATT_PAGE_SIZE = 20;
  function attStatusLabel(s){ return t('st_'+s.toLowerCase()); }
  function isWeekend(dt){ const d=new Date(dt+'T00:00:00'); const w=d.getDay(); return w===0||w===6; }

  function loadAttendance(){
    const root=document.getElementById('attRoot');
    root.innerHTML='<div class="skeleton-card kpi"></div><div class="skeleton-card kpi"></div><div class="skeleton-card kpi"></div>';
    api('/attendance').then(d=>{
      STATE.attendance=d; STATE.attBatch=false; STATE.attBatchSel=new Set(); STATE._batchStatus=''; STATE.attBatchStart=null; STATE.attBatchEnd=null; STATE._attPage=0;
      buildAttUI();
    }).catch(()=>{ root.innerHTML='<div class="state-box"><div class="state-box__icon">⚠️</div><div class="state-box__title">'+t('load_fail')+'</div><button class="state-box__action" onclick="loadAttendance()">'+t('retry')+'</button></div>'; });
  }
  function buildAttUI(){
    const d=STATE.attendance; if(!d) return;
    const ym = (d.dates&&d.dates[0]||'').slice(0,7);
    const ymLabel = ym? (ym.slice(0,4)+'年'+parseInt(ym.slice(5,7),10)+'月') : '';
    const daysCount = (d.dates||[]).length;
    const depts=[...new Set((d.rows||[]).map(r=>r.department).filter(Boolean))].sort();
    const root=document.getElementById('attRoot');
    root.innerHTML =
      '<div class="att-page-head"><div class="att-page-head__sub">'+ymLabel+' · '+daysCount+' '+t('days')+'</div></div>'
      + '<div class="att-toolbar">'
      + '<input class="att-search" id="attSearch" placeholder="'+t('search')+'" oninput="renderAttGrid()">'
      + '<select id="attDept" onchange="renderAttGrid()"><option value="">'+t('all_depts')+'</option>'+depts.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('')+'</select>'
      + '<button class="icon-btn" onclick="openAttJump()" title="'+t('jump_date')+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></button>'
      + '<button class="icon-btn" id="attBatchBtn" onclick="toggleAttBatch()">'+t('batch_mark')+'</button>'
      + '</div>'
      // Legend 8 色
      + '<div class="legend-strip">'
      + '<span class="legend-item"><span class="legend-dot st-D"></span>'+t('st_d')+'</span>'
      + '<span class="legend-item"><span class="legend-dot st-N"></span>'+t('st_n')+'</span>'
      + '<span class="legend-item"><span class="legend-dot st-P"></span>'+t('st_p')+'</span>'
      + '<span class="legend-item"><span class="legend-dot st-A"></span>'+t('st_a')+'</span>'
      + '<span class="legend-item"><span class="legend-dot st-L"></span>'+t('st_l')+'</span>'
      + '<span class="legend-item"><span class="legend-dot st-C"></span>'+t('st_c')+'</span>'
      + '<span class="legend-item"><span class="legend-dot st-R"></span>'+t('st_r')+'</span>'
      + '<span class="legend-item"><span class="legend-dot st-B"></span>'+t('st_b')+'</span>'
      + '</div>'
      + '<div id="attGrid" class="att-grid"></div>'
      + '<div id="attBatchPanel" class="batch-panel" style="display:none;">'
      + '  <div class="batch-panel__header"><div class="batch-panel__title">'+t('batch_title')+'</div><button class="icon-btn" onclick="toggleAttBatch()">✕</button></div>'
      + '  <div class="batch-panel__date-row"><span>'+t('batch_range')+'</span><input type="date" id="attBatchStart" value="'+(d.dates[0]||'')+'"><span>'+t('batch_to')+'</span><input type="date" id="attBatchEnd" value="'+(d.dates[d.dates.length-1]||'')+'"></div>'
      + '  <div class="batch-panel__status-row" id="attBatchStatus"></div>'
      + '  <div class="batch-panel__list" id="attBatchList"></div>'
      + '  <div class="batch-panel__progress" id="attBatchProgress"><div class="batch-panel__bar"><div class="batch-panel__fill" id="attBatchFill"></div></div><span class="batch-panel__progress-text" id="attBatchProgressText"></span></div>'
      + '  <button class="btn btn-primary btn-block" onclick="applyAttBatch()">'+t('batch_apply',{n:0})+'</button>'
      + '</div>'
      + '<div class="section-label" style="padding:0 var(--space-md);">'+t('quick_actions')+'</div>'
      + '<div class="quick-actions"><button class="quick-action-btn" onclick="quickLeave()"><span class="qa-icon">+</span><span>'+t('leave_apply')+'</span></button><button class="quick-action-btn" onclick="quickSick()"><span class="qa-icon">+</span><span>'+t('leave_sick')+'</span></button></div>';
    renderAttGrid();
  }
  // 出勤卡：左固定 100px 信息栏 + 右 28px 圆形状态格横向滚动
  function renderAttGrid(){
    const d=STATE.attendance; if(!d) return;
    const q=(document.getElementById('attSearch').value||'').toLowerCase().trim();
    const dept=document.getElementById('attDept').value;
    const today=new Date().toISOString().slice(0,10);
    // 需求4: 与员工列表一致,按姓名排序(localeCompare 中文/英文均可)
    const allRows=(d.rows||[]).filter(r=>(!dept||r.department===dept)&&(!q||(r.name||'').toLowerCase().includes(q)||String(r.id).toLowerCase().includes(q)||String(r.custom_number||'').includes(q))).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    STATE._attAllRows = allRows;
    const grid=document.getElementById('attGrid'); if(!grid) return;
    if(!allRows.length){ grid.innerHTML='<div class="state-box"><div class="state-box__icon">📋</div><div class="state-box__title">'+t('no_att_data')+'</div></div>'; return; }
    const page = STATE._attPage||0;
    const slice = allRows.slice(0, (page+1)*ATT_PAGE_SIZE);
    grid.innerHTML=slice.map(r=>{
      const sel = STATE.attBatch ? '<input type="checkbox" class="att-sel" data-eid="'+esc(r.id)+'" '+(STATE.attBatchSel.has(r.id)?'checked':'')+' onchange="onAttSel(\''+esc(r.id)+'\',this.checked)">' : '';
      const dateCells=d.dates.map(dt=>'<div class="date-cell'+(isWeekend(dt)?' weekend':'')+(dt===today?' att-today':'')+'">'+dt.slice(5).replace('-','/')+'</div>').join('');
      const statusCells=d.dates.map(dt=>{ const st=r.days[dt]||''; return '<div class="status-cell st-'+st+'" data-eid="'+esc(r.id)+'" data-d="'+dt+'" onclick="openAttEdit(\''+esc(r.id)+'\',\''+dt+'\')">'+(st||'·')+'</div>'; }).join('');
      return '<div class="att-card"><div class="att-card__row">'
        + '<div class="card-left">'+sel+'<div class="card-avatar">'+esc(initials(r.name))+'</div><div class="card-name">'+esc(r.name||'')+'</div><div class="card-id">#'+esc(r.custom_number||r.id)+'</div></div>'
        + '<div class="card-right"><div class="date-strip-scroll"><div class="date-strip"><div class="date-row">'+dateCells+'</div><div class="status-row">'+statusCells+'</div></div></div></div>'
        + '</div></div>';
    }).join('');
    if(allRows.length > slice.length){
      grid.innerHTML += '<button class="load-more-btn" onclick="STATE._attPage++; renderAttGrid()">'+t('load_more',{a:slice.length,b:allRows.length})+'</button>';
    }
    if(STATE.attBatch) renderAttBatchUI();
  }
  function initials(name){ if(!name) return '?'; const p=String(name).trim().split(/\s+/); return (p[0][0]+(p[1]?p[1][0]:'')).toUpperCase(); }
  function openAttEdit(eid, date){
    const r=(STATE.attendance.rows||[]).find(x=>x.id===eid);
    const cur=(r&&r.days[date])||'';
    const name=r? r.name : eid;
    const empId = r? (r.custom_number||r.id) : '';
    let html='<div class="att-edit-name">'+esc(name)+'</div>'
      + '<div class="att-edit-cur">'+t('att_current_label')+' <b class="st-'+cur+'">'+(cur?cur+' · '+attStatusLabel(cur):'·')+'</b></div>'
      + '<div class="att-edit-btns">'+ATT_STATUS.map(s=>'<button class="att-st-btn'+(cur===s?' active':'')+'" onclick="doAttToggle(\''+esc(eid)+'\',\''+date+'\',\''+s+'\')"><span class="att-st-dot st-'+s+'"></span><span>'+s+' · '+attStatusLabel(s)+'</span></button>').join('')+'</div>'
      + '<button class="btn btn-block" style="margin-top:12px;" onclick="closeSheet()">'+t('cancel')+'</button>';
    document.getElementById('sheet-title').textContent=t('edit_att')+' - '+(date||'').slice(5).replace('-','/')+(empId?' · #'+empId:'');
    document.getElementById('sheet-body').innerHTML=html;
    document.getElementById('sheet').classList.add('show');
  }
  function doAttToggle(eid, date, status){
    api('/attendance/toggle',{method:'POST',body:JSON.stringify({employee_id:eid,date,status})}).then(r=>{
      if(r.ok){ const row=(STATE.attendance.rows||[]).find(x=>x.id===eid); if(row) row.days[date]=status; closeSheet(); renderAttGrid(); toast(t('saved')); }
      else if(r.need_admin){ toast(t('need_editor'),'error'); }
      else toast(r.error||t('fail'),'error');
    }).catch(()=>toast(t('fail'),'error'));
  }
  // 批量标记：员工勾选 + 日期范围 + 进度条
  function toggleAttBatch(){
    STATE.attBatch=!STATE.attBatch;
    if(!STATE.attBatch){ STATE.attBatchSel.clear(); }
    const panel=document.getElementById('attBatchPanel'); if(panel) panel.style.display=STATE.attBatch?'block':'none';
    const b=document.getElementById('attBatchBtn'); if(b) b.textContent=STATE.attBatch?t('cancel_batch'):t('batch_mark');
    renderAttGrid();
  }
  function onAttSel(eid, checked){
    if(checked) STATE.attBatchSel.add(eid); else STATE.attBatchSel.delete(eid);
    updateBatchApplyBtn();
  }
  function updateBatchApplyBtn(){
    const btn=document.querySelector('#attBatchPanel .btn-primary');
    if(btn) btn.innerHTML=t('batch_apply',{n:STATE.attBatchSel.size});
  }
  function renderAttBatchUI(){
    // 状态按钮（8 状态）
    const box=document.getElementById('attBatchStatus'); if(box) box.innerHTML=ATT_STATUS.map(s=>'<button class="batch-status-btn st-'+s+(STATE._batchStatus===s?' active':'')+'" onclick="setBatchStatus(\''+s+'\')">'+s+'</button>').join('');
    // 员工勾选列表
    const list=document.getElementById('attBatchList'); if(list) list.innerHTML=(STATE._attAllRows||[]).map(r=>'<div class="worker-item" onclick="if(event.target.tagName!==\'INPUT\')this.querySelector(\'input\').click()"><input type="checkbox" value="'+esc(r.id)+'" '+(STATE.attBatchSel.has(r.id)?'checked':'')+' onchange="onAttSel(\''+esc(r.id)+'\',this.checked)"> <span class="worker-item__name">'+esc(r.name||'')+'</span> <span class="worker-item__id">#'+esc(r.custom_number||r.id)+'</span></div>').join('');
    updateBatchApplyBtn();
  }
  function setBatchStatus(s){ STATE._batchStatus=s; renderAttBatchUI(); }
  function applyAttBatch(){
    const start=document.getElementById('attBatchStart').value;
    const end=document.getElementById('attBatchEnd').value;
    const st=STATE._batchStatus;
    if(!start||!end){ toast(t('fill_date'),'warning'); return; }
    if(!st){ toast(t('pick_status'),'warning'); return; }
    const ids=[...STATE.attBatchSel];
    if(!ids.length){ toast(t('pick_emp'),'warning'); return; }
    // 生成日期范围
    const dates=[]; let cur=new Date(start+'T00:00:00'), last=new Date(end+'T00:00:00');
    while(cur<=last){ dates.push(cur.toISOString().slice(0,10)); cur.setDate(cur.getDate()+1); }
    const tasks=[];
    ids.forEach(eid=>dates.forEach(dt=>tasks.push([eid,dt])));
    // 进度条
    const prog=document.getElementById('attBatchProgress'); if(prog) prog.style.display='block';
    const fill=document.getElementById('attBatchFill'); const ptext=document.getElementById('attBatchProgressText');
    let done=0, okCount=0;
    const total=tasks.length;
    (function next(){
      if(!tasks.length){ if(ptext) ptext.textContent=t('batch_done',{n:okCount}); toast(t('batch_done',{n:okCount})); setTimeout(()=>{ STATE.attBatch=false; const panel=document.getElementById('attBatchPanel'); if(panel) panel.style.display='none'; const b=document.getElementById('attBatchBtn'); if(b) b.textContent=t('batch_mark'); loadAttendance(); }, 800); return; }
      const [eid,dt]=tasks.shift();
      api('/attendance/toggle',{method:'POST',body:JSON.stringify({employee_id:eid,date:dt,status:st})}).then(r=>{ if(r.ok) okCount++; }).catch(()=>{})
      .finally(()=>{
        done++; if(fill) fill.style.width=Math.round(done/total*100)+'%';
        if(ptext) ptext.textContent=t('batch_progress',{a:done,b:total});
        next();
      });
    })();
  }
  function openAttJump(){ const today=new Date().toISOString().slice(0,10); const body=document.getElementById('sheet-body'); body.innerHTML='<div class="field"><label class="field__label">'+t('jump_date')+'</label><input type="date" id="attJumpDate" value="'+(STATE.attendance.dates.includes(today)?today:STATE.attendance.dates[0]||today)+'"></div><button class="btn btn-primary btn-block" onclick="doAttJump()">'+t('jump_date')+'</button>'; openSheet(t('jump_date'), body); }
  function doAttJump(){ const dt=document.getElementById('attJumpDate').value; closeSheet(); if(!dt) return; STATE.attJump=dt; renderAttGrid(); const cell=document.querySelector('.status-cell[data-d="'+dt+'"]'); if(cell) cell.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'}); }

  // 请假快捷入口
  function quickLeave(){ const body=document.getElementById('sheet-body'); const opts=(STATE.employees||[]).map(e=>'<option value="'+esc(e.id)+'">'+esc(e.name||'')+' #'+esc(e.custom_number||e.id)+'</option>').join(''); body.innerHTML='<div class="field"><label class="field__label">'+t('emp_list')+'</label><select id="ql-emp">'+opts+'</select></div><button class="btn btn-primary btn-block" onclick="openLeave(document.getElementById(\'ql-emp\').value)">'+t('next')+'</button>'; openSheet(t('leave_apply'), body); }
  function quickSick(){ const body=document.getElementById('sheet-body'); const opts=(STATE.employees||[]).map(e=>'<option value="'+esc(e.id)+'">'+esc(e.name||'')+' #'+esc(e.custom_number||e.id)+'</option>').join(''); body.innerHTML='<div class="field"><label class="field__label">'+t('emp_list')+'</label><select id="qs-emp">'+opts+'</select></div><div class="field"><label class="field__label">'+t('date')+'</label><input type="date" id="qs-date" value="'+new Date().toISOString().slice(0,10)+'"></div><button class="btn btn-primary btn-block" onclick="submitQuickSick()">'+t('submit')+'</button>'; openSheet(t('leave_sick'), body); }
  function submitQuickSick(){ const eid=document.getElementById('qs-emp').value; const date=document.getElementById('qs-date').value; if(!eid||!date){ toast(t('fill_date'),'warning'); return; } api('/api/leave/sick',{method:'POST',body:JSON.stringify({employee_id:eid,start_date:date,days:1})}).then(r=>{ if(r.ok){ toast(t('submitted')); closeSheet(); } else toast(r.error||t('fail'),'error'); }).catch(()=>toast(t('fail'),'error')); }

  // ── 启动 ──
  applyTheme();
  applyLang();
  checkAuth();
  </script>
</body>
</html>
