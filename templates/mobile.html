<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="hsl(40 16% 98%)">
  <link rel="manifest" href="{{ static_url('manifest.webmanifest') }}">
  <meta name="mobile-web-app-capable" content="yes">
  <title>ENPRIZON LINDI</title>
  <link rel="stylesheet" href="{{ static_url('css/mobile.css') }}?v={{ version }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- 登录页（未认证时显示） -->
  <div id="login-screen" class="login-wrap" style="display:none;">
    <div class="login-logo">
      <h1>ENPRIZON LINDI</h1>
      <p data-i18n="login_sub">薪资与产量管理系统 · 移动端</p>
    </div>
    <form id="login-form" onsubmit="return doLogin(event)">
      <div class="field">
        <label class="field__label" data-i18n="username">用户名</label>
        <input type="text" id="login-user" autocomplete="username" required>
      </div>
      <div class="field">
        <label class="field__label" data-i18n="password">密码</label>
        <input type="password" id="login-pass" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" data-i18n="login">登录</button>
    </form>
  </div>

  <!-- 主应用 -->
  <div id="app" style="display:none;">
    <!-- 顶栏 -->
    <header class="top-bar">
      <button class="top-bar__back" id="topback" onclick="popPage()" aria-label="返回">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="22" height="22"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div style="flex:1; min-width:0;">
        <div class="top-bar__title" id="top-title" data-i18n="tab_dashboard">数据台</div>
        <div class="top-bar__month" id="top-month" onclick="openMonthSheet()">—</div>
      </div>
      <div class="top-bar__actions">
        <button class="icon-btn" id="search-btn" onclick="toggleSearch()" title="搜索" aria-label="搜索">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        </button>
        <button class="icon-btn lang-pill" id="lang-btn" onclick="toggleLang()" title="语言">中</button>
        <button class="icon-btn" id="theme-btn" onclick="toggleTheme()" title="主题" aria-label="主题">
          <svg id="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg id="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22" style="display:none;"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </header>

    <!-- 搜索栏（默认隐藏） -->
    <div id="search-bar" style="display:none; padding:8px 16px; background:var(--card); border-bottom:1px solid var(--border);">
      <input type="search" id="search-input" data-i18n-placeholder="search" placeholder="搜索..." oninput="onSearch(this.value)" style="width:100%; min-height:44px; padding:8px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--background);">
    </div>

    <main class="main-content">
      <!-- 数据台 -->
      <section class="tab-page active" id="tab-dashboard">
        <!-- 骨架屏 -->
        <div id="dash-skeleton" style="display:none;">
          <div class="kpi-grid">
            <div class="skeleton-card kpi"></div><div class="skeleton-card kpi"></div>
            <div class="skeleton-card kpi"></div><div class="skeleton-card kpi"></div>
            <div class="skeleton-card kpi"></div><div class="skeleton-card kpi"></div>
          </div>
          <div class="skeleton-card chart"></div>
          <div class="skeleton-card chart"></div>
        </div>
        <!-- 错误/空态 -->
        <div id="dash-error" class="state-box" style="display:none;">
          <div class="state-box__icon">⚠️</div>
          <div class="state-box__title" data-i18n="load_fail">加载失败</div>
          <div class="state-box__desc" id="dash-error-desc"></div>
          <button class="state-box__action" onclick="loadDashboard()" data-i18n="retry">重试</button>
        </div>
        <div id="dash-empty" class="state-box" style="display:none;">
          <div class="state-box__icon">∅</div>
          <div class="state-box__title" data-i18n="no_data">暂无产量数据</div>
        </div>
        <div id="dash-content" style="display:none;">
          <!-- 筛选控制栏（可折叠） -->
          <div class="control-bar" id="dash-control">
            <button class="control-bar__trigger" onclick="toggleDashFilter()">
              <span data-i18n="dashboard_title">数据台</span>
              <span class="ctrl-arrow" data-i18n="filter">筛选 ▾</span>
            </button>
            <div class="control-bar__body">
              <div class="filter-group">
                <div class="filter-group__label" data-i18n="shift">班次</div>
                <div class="segmented" id="dash-shift-seg">
                  <div class="segmented__option active" data-v="all" onclick="setShiftFilter('all')" data-i18n="all">全部</div>
                  <div class="segmented__option" data-v="day" onclick="setShiftFilter('day')" data-i18n="day_shift">白班</div>
                  <div class="segmented__option" data-v="night" onclick="setShiftFilter('night')" data-i18n="night_shift">夜班</div>
                </div>
              </div>
              <div class="filter-group">
                <div class="filter-group__label" data-i18n="ore_type">矿石类型</div>
                <div class="segmented" id="dash-ore-seg">
                  <div class="segmented__option active" data-v="all" onclick="setOreFilter('all')" data-i18n="all">全部</div>
                  <div class="segmented__option ore-tag" data-v="nh" onclick="setOreFilter('nh')" data-i18n="nh">NICKEL(H)</div>
                  <div class="segmented__option ore-tag" data-v="nl" onclick="setOreFilter('nl')" data-i18n="nl">NICKEL(L)</div>
                  <div class="segmented__option ore-tag" data-v="mw" onclick="setOreFilter('mw')" data-i18n="mw">MAWE</div>
                </div>
              </div>
            </div>
          </div>
          <div class="kpi-grid" id="kpi-grid"></div>
          <div class="chart-box">
            <div class="chart-box__title" data-i18n="trend">产量趋势</div>
            <div class="chart-canvas-wrap chart-loading" style="height:160px;"><canvas id="chart-trend"></canvas></div>
          </div>
          <div class="chart-box">
            <div class="chart-header">
              <div class="chart-box__title" data-i18n="day_night">白班 vs 夜班</div>
              <div class="cmp-tab" id="dn-cmp-tab">
                <button class="cmp-tab__item active" data-v="all" onclick="setDnTab('all')" data-i18n="total">合计</button>
                <button class="cmp-tab__item" data-v="nh" onclick="setDnTab('nh')" data-i18n="nh">NICKEL(H)</button>
                <button class="cmp-tab__item" data-v="nl" onclick="setDnTab('nl')" data-i18n="nl">NICKEL(L)</button>
                <button class="cmp-tab__item" data-v="mw" onclick="setDnTab('mw')" data-i18n="mw">MAWE</button>
              </div>
            </div>
            <div class="chart-canvas-wrap" style="height:160px;"><canvas id="chart-daynight"></canvas></div>
          </div>
          <div class="chart-box">
            <div class="chart-box__title" data-i18n="driller_output">钻工组产量</div>
            <div class="chart-canvas-wrap" style="height:160px;"><canvas id="chart-driller"></canvas></div>
            <div class="chart-note" data-i18n="chart_drill_note">点击柱子查看逐日明细</div>
          </div>
          <div class="chart-box">
            <div class="chart-box__title" data-i18n="ore_type">矿石类型占比</div>
            <div class="donut-wrap">
              <div class="donut-canvas-wrap">
                <canvas id="chart-ore"></canvas>
                <div class="donut-center"><span class="donut-center__value" id="donut-total">0</span><span class="donut-center__label" data-i18n="total">合计</span></div>
              </div>
              <div class="donut-legend" id="ore-legend"></div>
            </div>
          </div>
          <div class="card">
            <div class="card-title" data-i18n="crush_table">破碎产量</div>
            <div class="crush-table">
              <div class="crush-table__row head"><span data-i18n="date">日期</span><span data-i18n="bags">袋数</span><span data-i18n="emp">人数</span></div>
              <div id="crush-list"></div>
              <div class="crush-total-row"><span data-i18n="total">合计</span><span class="num" id="crush-total-bags">0</span><span id="crush-total-emp">0</span></div>
            </div>
          </div>
        </div>
      </section>

      <!-- 员工 -->
      <section class="tab-page" id="tab-employees">
        <div class="segmented" id="emp-seg" style="margin-bottom:12px;">
          <div class="segmented__option active" data-v="list" onclick="setEmpSeg('list')" data-i18n="emp_list">员工列表</div>
          <div class="segmented__option" data-v="pending" onclick="setEmpSeg('pending')"><span data-i18n="oa_pending">待审</span>(<span id="oa-pending-n">0</span>)</div>
          <div class="segmented__option" data-v="history" onclick="setEmpSeg('history')" data-i18n="oa_history">已审批</div>
        </div>
        <div id="emp-list"></div>
        <div id="emp-detail" style="display:none;"></div>
        <div id="oa-list" style="display:none;"></div>
      </section>

      <!-- 采集 -->
      <section class="tab-page" id="tab-collection">
        <div id="col-home"></div>
        <div id="col-form" style="display:none;"></div>
      </section>

      <!-- 出勤 -->
      <section class="tab-page" id="tab-attendance">
        <div id="attRoot"></div>
      </section>
    </main>

    <!-- 底部 Tab Bar -->
    <nav class="tab-bar">
      <div class="tab-bar__item active" data-tab="dashboard" onclick="switchTab('dashboard')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        <span data-i18n="tab_dashboard">数据台</span>
      </div>
      <div class="tab-bar__item" data-tab="employees" onclick="switchTab('employees')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M21 21v-2a4 4 0 0 0-3-3.87"/></svg>
        <span data-i18n="tab_employees">员工</span>
      </div>
      <div class="tab-bar__item" data-tab="collection" onclick="switchTab('collection')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></svg>
        <span data-i18n="tab_collection">采集</span>
      </div>
      <div class="tab-bar__item" data-tab="attendance" onclick="switchTab('attendance')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span data-i18n="tab_attendance">出勤</span>
      </div>
    </nav>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- 底部 Sheet -->
    <div class="sheet-overlay" id="sheet" onclick="if(event.target===this)closeSheet()">
      <div class="sheet-content" id="sheet-content">
        <div class="sheet-handle"></div>
        <div class="sheet-header"><span id="sheet-title"></span><button class="icon-btn" onclick="closeSheet()">✕</button></div>
        <div id="sheet-body"></div>
      </div>
    </div>
  </div>

  <script src="{{ static_url('js/i18n.js') }}?v={{ version }}"></script>
  <script src="{{ static_url('js/chart.umd.min.js') }}"></script>
  <script src="{{ static_url('js/chartjs-plugin-datalabels.min.js') }}"></script>
  <script>
  // ═══════════════════════════════════════════════
  //  P16 移动端 SPA — Phase 1: 骨架 + 数据台
  // ═══════════════════════════════════════════════
  const STATE = {
    auth: null,
    currentMonth: '',
    dashboard: null,
    theme: localStorage.getItem('m_theme') || 'light',
    lang: localStorage.getItem('m_lang') || 'zh',
    shiftFilter: 'all',
    charts: {},
    attendance: null,
    attBatch: false,
    attBatchSel: null,
    _batchStatus: '',
    attJump: '',
  };

  const I18N = null; // 已废弃：统一使用 static/js/i18n.js 的 I18N_DICT
  function t(key, vars){
    let s;
    if (window.I18N_DICT) {
      const dict = I18N_DICT[STATE.lang] || I18N_DICT.zh || {};
      s = dict[key] !== undefined ? dict[key] : key;
    } else {
      // 兼容回退：i18n.js 未加载时返回 key 本身
      s = key;
    }
    if (vars && s.includes('{')) {
      for (const k in vars) s = s.split('{'+k+'}').join(String(vars[k]));
    }
    return s;
  }

  // ── 工具 ──
  function api(path, opts){ return fetch(path, Object.assign({ credentials:'same-origin', headers:{'Content-Type':'application/json'} }, opts)).then(r=>r.json()); }
  function fmt(n){ n = Number(n)||0; return n.toLocaleString('en-US'); }
  function toast(msg, type){ const el=document.getElementById('toast'); el.textContent=msg; el.className='toast show'+(type?(' '+type):''); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),2500); }

  // ── 主题/语言 ──
  function applyTheme(){
    document.documentElement.classList.toggle('dark', STATE.theme==='dark');
    const moon=document.getElementById('theme-icon-moon'), sun=document.getElementById('theme-icon-sun');
    if(moon) moon.style.display = STATE.theme==='dark'?'none':'block';
    if(sun) sun.style.display = STATE.theme==='dark'?'block':'none';
    const tc=document.querySelector('meta[name="theme-color"]');
    if(tc) tc.setAttribute('content', STATE.theme==='dark'?'hsl(12 71.43% 1.37%)':'hsl(40 16% 98%)');
  }
  function toggleTheme(){ STATE.theme = STATE.theme==='dark'?'light':'dark'; localStorage.setItem('m_theme', STATE.theme); applyTheme(); }
  function applyLang(){
    document.querySelectorAll('[data-i18n]').forEach(e=>{ const k=e.getAttribute('data-i18n'); if(k) e.textContent=t(k); });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(e=>{ const k=e.getAttribute('data-i18n-placeholder'); if(k) e.placeholder=t(k); });
    document.documentElement.lang = STATE.lang;
    const lb=document.getElementById('lang-btn'); if(lb) lb.textContent = STATE.lang==='zh'?'中':'EN';
  }
  function toggleLang(){ STATE.lang = STATE.lang==='zh'?'en':'zh'; localStorage.setItem('m_lang', STATE.lang); applyLang(); if(activeTab==='dashboard') renderDashboard(); }

  // ── Tab 路由 ──
  const TAB_TITLES = { dashboard:'tab_dashboard', employees:'tab_employees', collection:'tab_collection', attendance:'tab_attendance' };
  let activeTab = 'dashboard';
  function switchTab(name){
    activeTab = name;
    document.querySelectorAll('.tab-page').forEach(p=>p.classList.remove('active'));
    document.getElementById('tab-'+name).classList.add('active');
    document.querySelectorAll('.tab-bar__item').forEach(i=>i.classList.toggle('active', i.dataset.tab===name));
    document.getElementById('top-title').textContent = t(TAB_TITLES[name]);
    document.getElementById('topback').classList.remove('visible');
    window.scrollTo(0,0);
    if(name==='dashboard' && !STATE.dashboard) loadDashboard();
    if(name==='employees'){ if(!STATE.employees.length) loadEmployees(); loadOAPendingCount(); }
    if(name==='attendance') loadAttendance();
  }
  function loadOAPendingCount(){ api('/api/oa/pending/count').then(d=>{ document.getElementById('oa-pending-n').textContent = d.count||0; }).catch(()=>{}); }
  function pushPage(){ document.getElementById('topback').classList.add('visible'); }
  function popPage(){ document.getElementById('topback').classList.remove('visible'); }

  // ── 搜索 ──
  function toggleSearch(){ const b=document.getElementById('search-bar'); b.style.display = b.style.display==='none'?'block':'none'; if(b.style.display==='block') document.getElementById('search-input').focus(); }

  // ── 月份 Sheet ──
  function openMonthSheet(){
    const body = document.getElementById('sheet-body');
    body.innerHTML = '<div class="loading">'+t('loading')+'</div>';
    openSheet(t('month'), body);
    api('/available-months').then(months=>{
      if(!months || !months.length){ body.innerHTML='<div class="empty-state">'+t('month')+'</div>'; return; }
      body.innerHTML = months.map(m=>'<div class="card-item" onclick="selectMonth(\''+m+'\')"><div class="card-item__body"><div class="card-item__title">'+m+'</div></div><div class="card-item__trailing">›</div></div>').join('');
    }).catch(()=>{ body.innerHTML='<div class="empty-state">'+t('month')+'</div>'; });
  }
  function selectMonth(m){
    closeSheet();
    api('/set-month', { method:'POST', body: JSON.stringify({ month:m }) }).then(r=>{
      if(r.ok){ STATE.dashboard=null; loadDashboard(); toast(m); } else { toast('无权限切换月份', 'warning'); }
    }).catch(()=>toast('切换失败','error'));
  }

  // ── Sheet ──
  function openSheet(title, bodyEl){ document.getElementById('sheet-title').textContent=title; document.getElementById('sheet').classList.add('show'); }
  function closeSheet(){ document.getElementById('sheet').classList.remove('show'); }

  // ── 认证 ──
  function checkAuth(){
    return api('/api/auth/status').then(a=>{
      STATE.auth = a;
      if(a.logged_in){ showApp(); return true; }
      showLogin(); return false;
    });
  }
  function showLogin(){ document.getElementById('login-screen').style.display='flex'; document.getElementById('app').style.display='none'; }
  function showApp(){ document.getElementById('login-screen').style.display='none'; document.getElementById('app').style.display='flex'; applyTheme(); applyLang(); loadDashboard(); loadOAPendingCount(); }
  function doLogin(e){
    e.preventDefault();
    const u=document.getElementById('login-user').value.trim(), p=document.getElementById('login-pass').value;
    api('/api/login', { method:'POST', body: JSON.stringify({ username:u, password:p }) }).then(r=>{
      if(r.ok){ showApp(); } else { toast(r.error==='invalid_credentials'?'用户名或密码错误':'登录失败','error'); }
    }).catch(()=>toast('登录失败','error'));
    return false;
  }

  // ── 数据台 ──
  STATE.dashOreFilter = 'all';   // all|nh|nl|mw
  STATE.dnTab = 'all';           // all|nh|nl|mw
  STATE.dashLoaded = false;

  function loadDashboard(){
    const sk=document.getElementById('dash-skeleton'), err=document.getElementById('dash-error'), empty=document.getElementById('dash-empty'), content=document.getElementById('dash-content');
    sk.style.display='block'; err.style.display='none'; empty.style.display='none'; content.style.display='none';
    api('/api/production/dashboard').then(d=>{
      STATE.dashboard = d; STATE.currentMonth = d.month || '';
      document.getElementById('top-month').textContent = STATE.currentMonth;
      sk.style.display='none';
      const hasData = (d.shift_production||[]).length || (d.driller_production||[]).length || (d.crush_production||[]).length;
      if(!hasData){ empty.style.display='block'; return; }
      content.style.display='block';
      renderDashboard();
    }).catch(()=>{
      sk.style.display='none'; err.style.display='block';
      document.getElementById('dash-error-desc').textContent = STATE.currentMonth||'';
    });
  }

  function toggleDashFilter(){ document.getElementById('dash-control').classList.toggle('open'); }

  function setShiftFilter(v){ STATE.shiftFilter=v; document.querySelectorAll('#dash-shift-seg .segmented__option').forEach(o=>o.classList.toggle('active', o.dataset.v===v)); renderDashboard(); }
  function setOreFilter(v){ STATE.dashOreFilter=v; document.querySelectorAll('#dash-ore-seg .segmented__option').forEach(o=>o.classList.toggle('active', o.dataset.v===v)); renderDashboard(); }
  function setDnTab(v){ STATE.dnTab=v; document.querySelectorAll('#dn-cmp-tab .cmp-tab__item').forEach(o=>o.classList.toggle('active', o.dataset.v===v)); drawDayNight(); }

  // 按班次 + 矿石类型双重过滤，返回逐日 {date, nh, nl, mw, total}
  function filteredShift(){
    const d = STATE.dashboard; if(!d) return [];
    const ore = STATE.dashOreFilter; // all 时取合计
    return (d.shift_production||[]).map(s=>{
      let nh, nl, mw;
      if(STATE.shiftFilter==='day'){ nh=s.day_nh||0; nl=s.day_nl||0; mw=s.day_mw||0; }
      else if(STATE.shiftFilter==='night'){ nh=s.night_nh||0; nl=s.night_nl||0; mw=s.night_mw||0; }
      else { nh=s.total_nh||0; nl=s.total_nl||0; mw=s.total_mw||0; }
      if(ore==='nh'){ nh=nh; nl=0; mw=0; }
      else if(ore==='nl'){ nh=0; nl=nl; mw=0; }
      else if(ore==='mw'){ nh=0; nl=0; mw=mw; }
      return { date:s.date, nh, nl, mw, total:nh+nl+mw };
    });
  }

  function renderDashboard(){
    if(!STATE.dashboard) return;
    const data = filteredShift();
    const sum = (k)=>data.reduce((a,s)=>a+(s[k]||0),0);
    const totals = { nh:sum('nh'), nl:sum('nl'), mw:sum('mw') };
    const dayTot = data.map(s=>s.total).filter(x=>x>0);
    const avg = dayTot.length? dayTot.reduce((a,b)=>a+b,0)/dayTot.length : 0;
    const maxVal = dayTot.length? Math.max(...dayTot) : 0;
    // 日最高对应日期
    const maxDate = maxVal? (data.find(s=>s.total===maxVal)||{}).date||'' : '';
    // 白夜班比（不受矿石过滤影响，用原始 shift 数据）
    const daySum = (STATE.dashboard.shift_production||[]).reduce((a,s)=>a+s.day_nh+s.day_nl+s.day_mw,0);
    const nightSum = (STATE.dashboard.shift_production||[]).reduce((a,s)=>a+s.night_nh+s.night_nl+s.night_mw,0);
    const ratio = nightSum? (daySum/nightSum).toFixed(2)+':1' : '—';

    // 6 KPI：本月NH/NL/MW + 日均 + 日最高(带kpi-sub) + 白夜班比
    const kpis = [
      { l:t('kpi_nh_month'), v:fmt(totals.nh), ind:'ind-i4' },
      { l:t('kpi_nl_month'), v:fmt(totals.nl), ind:'ind-i2' },
      { l:t('kpi_mw_month'), v:fmt(totals.mw), ind:'ind-i5' },
      { l:t('kpi_daily_avg'), v:fmt(Math.round(avg)), ind:'ind-neutral' },
      { l:t('kpi_day_max'), v:fmt(maxVal), sub:maxDate? maxDate.slice(5).replace('-','/') : '', ind:'ind-i2' },
      { l:t('kpi_ratio'), v:ratio, ind:'ind-i4' },
    ];
    document.getElementById('kpi-grid').innerHTML = kpis.map(k=>'<div class="kpi '+k.ind+'"><div class="kpi__label">'+k.l+'</div><div class="kpi__value">'+k.v+'</div>'+(k.sub?'<div class="kpi-sub">'+k.sub+'</div>':'')+'</div>').join('');

    drawTrend();
    drawDayNight();
    drawDriller();
    drawOre(totals);
    renderCrush();
  }

  function newChart(id, cfg){

    const wrap=el.closest('.chart-loading'); if(wrap) wrap.classList.remove('chart-loading');

  function baseOpts(){ return { responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false }, datalabels:{ display:false } }, scales:{ x:{ ticks:{ font:{size:9}, maxRotation:0 }, grid:{ display:false } }, y:{ ticks:{ font:{size:9} }, grid:{ color:'hsl(44 26.32% 88.82%)' } } } }; }

  // 产量趋势：白班/夜班/合计 三线（设计稿 dashboard.html:450-460）
  // 趋势图直接读原始 shift 数据（三线本身即班次维度），矿石过滤生效
  function drawTrend(){
    const sp = STATE.dashboard.shift_production || [];
    if(!sp.length) return;
    const ore = STATE.dashOreFilter;
    const labels = sp.map(s=>s.date.slice(5));
    const pick = (s, f)=> ore==='nh'? (s[f+'_nh']||0) : ore==='nl'? (s[f+'_nl']||0) : ore==='mw'? (s[f+'_mw']||0) : (s[f+'_nh']||0)+(s[f+'_nl']||0)+(s[f+'_mw']||0);
    newChart('chart-trend', { type:'line', data:{ labels, datasets:[
      { label:t('day'), data:sp.map(s=>pick(s,'day')), borderColor:'hsl(200 60% 45%)', backgroundColor:'hsl(200 60% 45% / 0.08)', fill:true, tension:0.3, pointRadius:0 },
      { label:t('night'), data:sp.map(s=>pick(s,'night')), borderColor:'hsl(180 50% 40%)', backgroundColor:'hsl(180 50% 40% / 0.08)', fill:false, tension:0.3, pointRadius:0 },
      { label:t('total'), data:sp.map(s=>pick(s,'total')), borderColor:'hsl(28.99 91.75% 61.96%)', backgroundColor:'transparent', borderWidth:2, tension:0.3, pointRadius:0 },
    ]}, options: Object.assign(baseOpts(), { plugins:{ legend:{ display:true, position:'bottom', labels:{ font:{size:9} } } } }) });
  }
  // 白班 vs 夜班：按 dnTab 切换 NH/NL/MW/合计 双柱
  function drawDayNight(){
    const sp = STATE.dashboard.shift_production || [];
    const labels = sp.map(s=>s.date.slice(5));
    const ore = STATE.dnTab;
    const field = ore==='nh'?'nh':(ore==='nl'?'nl':(ore==='mw'?'mw':null));
    const dayData = sp.map(s=> field? (s['day_'+field]||0) : (s.day_nh+s.day_nl+s.day_mw));
    const nightData = sp.map(s=> field? (s['night_'+field]||0) : (s.night_nh+s.night_nl+s.night_mw));
    newChart('chart-daynight', { type:'bar', data:{ labels, datasets:[
      { label:t('day_shift'), data:dayData, backgroundColor:'hsl(200 60% 45%)', borderRadius:3 },
      { label:t('night_shift'), data:nightData, backgroundColor:'hsl(180 50% 40%)', borderRadius:3 },
    ]}, options: Object.assign(baseOpts(), { plugins:{ legend:{ display:true, position:'bottom', labels:{ font:{size:9} } } } }) });
  }
  // 钻工组产量：堆叠柱按 NH/NL/MW（支持点击下钻占位）
  function drawDriller(){
    const dp = STATE.dashboard.driller_production || [];
    if(!dp.length){ document.getElementById('chart-driller').style.display='none'; return; }
    document.getElementById('chart-driller').style.display='block';

    newChart('chart-driller', { type:'bar', data:{ labels, datasets:[
      { label:t('nh'), data:dp.map(s=>s.nh||0), backgroundColor:'hsl(55 24% 49%)', borderRadius:2 },
      { label:t('nl'), data:dp.map(s=>s.nl||0), backgroundColor:'hsl(0 15% 32%)', borderRadius:2 },
      { label:t('mw'), data:dp.map(s=>s.mw||0), backgroundColor:'hsl(70 10% 50%)', borderRadius:2 },
    ]}, options: Object.assign(baseOpts(), { plugins:{ legend:{ display:true, position:'bottom', labels:{ font:{size:9} } } }, scales:{ x:{ stacked:true, ticks:{font:{size:9}, maxRotation:0} }, y:{ stacked:true, ticks:{font:{size:9}} } } }) });

  // 矿石类型占比：环形图 + 中心总车次 + 右侧百分比 legend
  function drawOre(totals){
    const sum = totals.nh+totals.nl+totals.mw;
    document.getElementById('donut-total').textContent = fmt(sum);
    const colors = ['hsl(55 24% 49%)','hsl(0 15% 32%)','hsl(70 10% 50%)'];
    const items = [[t('nh'),totals.nh,'st-nh'],[t('nl'),totals.nl,'st-nl'],[t('mw'),totals.mw,'st-mw']];
    document.getElementById('ore-legend').innerHTML = items.map(([lab,v,dummy],i)=>{
      const pct = sum? Math.round(v/sum*100) : 0;
      return '<div class="donut-legend__item"><span class="donut-legend__dot" style="background:'+colors[i]+'"></span>'+lab+'<span class="donut-legend__pct">'+pct+'%</span></div>';
    }).join('');
    newChart('chart-ore', { type:'doughnut', data:{ labels:[t('nh'),t('nl'),t('mw')], datasets:[{ data:[totals.nh,totals.nl,totals.mw], backgroundColor:colors, borderWidth:2, borderColor:'var(--card)' }] },
      options:{ responsive:true, maintainAspectRatio:false, cutout:'62%', plugins:{ legend:{ display:false }, datalabels:{ display:false } } } });
  }

  function loadOA(mode){
    const el = document.getElementById('oa-list');

    const url = mode==='history' ? '/api/oa/history' : '/api/oa/pending';
    api(url).then(d=>{

      if(mode!=='history'){ document.getElementById('oa-pending-n').textContent = evs.length; }
      if(!evs.length){ el.innerHTML='<div class="empty-state"><div class="empty-state__icon">✅</div><div class="empty-state__desc">'+t('no_oa')+'</div></div>'; return; }
      el.innerHTML = evs.map(ev=>oaCard(ev, mode)).join('');
    }).catch(()=>{ el.innerHTML='<div class="empty-state">'+t('load_fail')+'</div>'; });

  function oaCard(ev, mode){
    const typeMap = { hire:t('oa_hire'), transfer:t('oa_transfer'), dismiss:t('oa_dismiss'), resign:t('oa_resign'), leave:t('oa_leave'), salary_change:t('oa_salary') };
    let summary='';
    try { const p = JSON.parse(ev.payload||'{}'); summary = p.note || (p.days? (p.days+' '+t('days')) : ''); } catch(e){}
    let html = '<div class="card-item" style="flex-direction:column;align-items:stretch;">'
      + '<div style="display:flex;justify-content:space-between;width:100%;"><span class="card-item__title">'+esc(typeMap[ev.event_type]||ev.event_type)+'</span><span class="card-item__meta">'+esc(ev.employee_name||ev.employee_id)+'</span></div>'
      + (summary?'<div class="card-item__meta">'+esc(summary)+'</div>':'')
      + '<div class="card-item__meta">'+esc(ev.effective_date||'')+'</div>';
    if(mode==='pending'){
      html += '<div style="display:flex;gap:8px;margin-top:8px;"><button class="btn btn-primary btn-block" onclick="approveOA('+ev.id+')">'+t('approve')+'</button><button class="btn btn-block" onclick="rejectOA('+ev.id+')">'+t('reject')+'</button></div>';
    } else {
      const st = ev.status==='approved'?t('approved'):t('rejected');
      html += '<div class="card-item__meta" style="margin-top:4px;">'+st+(ev.reject_reason?(': '+esc(ev.reject_reason)):'')+'</div>';
    }
    html += '</div>';
    return html;
  }

      + '<div class="field"><label class="field__label">'+t('date')+'</label><input type="date" id="colDate" value="'+d+'"></div>'
      + '<div class="card-title">'+t('day_shift')+'</div>'+shift('ugDay')
      + '<div class="card-title">'+t('night_shift')+'</div>'+shift('ugNight')
      + '<button class="btn btn-primary btn-block" onclick="submitUg()">'+t('submit')+'</button>';
    document.getElementById('ugDayEmpsBox').innerHTML=empChecklistHTML('ugDayEmps',[]);
    document.getElementById('ugDayDriversBox').innerHTML=empChecklistHTML('ugDayDrivers',[]);
    document.getElementById('ugNightEmpsBox').innerHTML=empChecklistHTML('ugNightEmps',[]);
    document.getElementById('ugNightDriversBox').innerHTML=empChecklistHTML('ugNightDrivers',[]);
  }
  function submitUg(){ colSubmit('underground', { submission_date:document.getElementById('colDate').value,
    day:{ nh:+document.getElementById('ugDayNh').value||0, nl:+document.getElementById('ugDayNl').value||0, mw:+document.getElementById('ugDayMw').value||0, emps:ck('ugDayEmps'), drivers:ck('ugDayDrivers') },
    night:{ nh:+document.getElementById('ugNightNh').value||0, nl:+document.getElementById('ugNightNl').value||0, mw:+document.getElementById('ugNightMw').value||0, emps:ck('ugNightEmps'), drivers:ck('ugNightDrivers') } }); }

  // 钻工组
  STATE._drSlots=[];
  async function renderDrForm(){
    const d=new Date().toISOString().slice(0,10);
    STATE._drSlots=[{captain:'',nh:0,nl:0,mw:0,members:[]}];
    let caps=[]; try{ caps=(await api('/api/driller-captains')).captains||[]; }catch(e){}
    STATE._drCaps=caps;
    document.getElementById('col-form').innerHTML='<h3 class="section-title">'+t('col_dr')+'</h3>'
      + '<div class="field"><label class="field__label">'+t('date')+'</label><input type="date" id="colDate" value="'+d+'"></div>'
      + '<div id="drSlots"></div>'
      + '<button class="btn btn-block" onclick="addDrSlotM()" style="margin:8px 0;">+ '+t('add_team')+'</button>'
      + '<button class="btn btn-primary btn-block" onclick="submitDr()">'+t('submit')+'</button>';
    renderDrSlotsM();
  }
  function capOpts(sel){ return (STATE._drCaps||[]).map(c=>'<option value="'+esc(c.employee_id)+'" '+(String(sel)===String(c.employee_id)?'selected':'')+'>'+esc(c.name)+'</option>').join(''); }
  function renderDrSlotsM(){ const c=document.getElementById('drSlots'); if(!c) return;
    c.innerHTML=STATE._drSlots.map((s,i)=>'<div class="card" style="padding:10px;"><div class="field"><label class="field__label">'+t('captain')+'</label><select id="drCap'+i+'" onchange="STATE._drSlots['+i+'].captain=this.value"><option value="">'+t('pick_captain')+'</option>'+capOpts(s.captain)+'</select></div>'
      + '<div style="display:flex;gap:6px;"><div class="field" style="flex:1;"><label class="field__label">'+t('nh')+'</label><input type="number" id="drNh'+i+'" value="'+s.nh+'" min="0"></div><div class="field" style="flex:1;"><label class="field__label">'+t('nl')+'</label><input type="number" id="drNl'+i+'" value="'+s.nl+'" min="0"></div><div class="field" style="flex:1;"><label class="field__label">'+t('mw')+'</label><input type="number" id="drMw'+i+'" value="'+s.mw+'" min="0"></div></div>'
      + '<div class="field"><label class="field__label">'+t('members')+'</label><input type="hidden" id="drMem'+i+'" value="'+(s.members||[]).join(',')+'"><div id="drMemBox'+i+'"></div></div>'
      + (STATE._drSlots.length>1?'<button class="btn btn-block" onclick="removeDrSlotM('+i+')" style="margin-top:6px;">'+t('remove')+'</button>':'')+'</div>').join('');
    STATE._drSlots.forEach((s,i)=>{ const box=document.getElementById('drMemBox'+i); if(box) box.innerHTML=empChecklistHTML('drMem'+i, s.members||[]); });
  }
  function syncDrSlotsFromDom(){ STATE._drSlots.forEach((s,i)=>{ const c=document.getElementById('drCap'+i); if(c) s.captain=c.value; const nh=document.getElementById('drNh'+i); if(nh) s.nh=+nh.value||0; const nl=document.getElementById('drNl'+i); if(nl) s.nl=+nl.value||0; const mw=document.getElementById('drMw'+i); if(mw) s.mw=+mw.value||0; s.members=ck('drMem'+i); }); }
  function addDrSlotM(){ syncDrSlotsFromDom(); STATE._drSlots.push({captain:'',nh:0,nl:0,mw:0,members:[]}); renderDrSlotsM(); }
  function removeDrSlotM(i){ syncDrSlotsFromDom(); STATE._drSlots.splice(i,1); renderDrSlotsM(); }
  function submitDr(){ const date=document.getElementById('colDate').value; if(!date){toast(t('fill_date'),'warning');return;} const teams=[];
    for(let i=0;i<STATE._drSlots.length;i++){ const cap=document.getElementById('drCap'+i).value; if(!cap) continue; teams.push({ captain:cap, nh:+document.getElementById('drNh'+i).value||0, nl:+document.getElementById('drNl'+i).value||0, mw:+document.getElementById('drMw'+i).value||0, members:ck('drMem'+i) }); }
    if(!teams.length){ toast(t('pick_captain'),'warning'); return; }
    colSubmit('driller', { submission_date:date, teams }); }

  // 破碎计件
  function renderCrForm(){ const d=new Date().toISOString().slice(0,10);
    document.getElementById('col-form').innerHTML='<h3 class="section-title">'+t('col_cr')+'</h3>'
      + '<div class="field"><label class="field__label">'+t('date')+'</label><input type="date" id="colDate" value="'+d+'"></div>'
      + '<div class="field"><label class="field__label">'+t('bags')+'</label><input type="number" id="crBags" value="0" min="0"></div>'
      + '<div class="field"><label class="field__label">'+t('col_emps')+'</label><input type="hidden" id="crEmps"><div id="crEmpsBox"></div></div>'
      + '<button class="btn btn-primary btn-block" onclick="submitCr()">'+t('submit')+'</button>';
    document.getElementById('crEmpsBox').innerHTML=empChecklistHTML('crEmps',[]);
  }
  function submitCr(){ const date=document.getElementById('colDate').value; if(!date){toast(t('fill_date'),'warning');return;}
    colSubmit('crush', { submission_date:date, bags:+document.getElementById('crBags').value||0, emps:ck('crEmps') }); }

  // 出勤收集
  async function renderAttForm(){ const d=new Date().toISOString().slice(0,10); const pool=STATE.employees;
    const depts=[...new Set(pool.map(e=>e.department).filter(Boolean))].sort();
    document.getElementById('col-form').innerHTML='<h3 class="section-title">'+t('col_att')+'</h3>'
      + '<div class="field"><label class="field__label">'+t('date')+'</label><input type="date" id="colDate" value="'+d+'"></div>'
      + '<div class="field"><label class="field__label">'+t('dept')+'</label><select id="attDept" onchange="renderAttRoster()">'+'<option value="">'+t('all_depts')+'</option>'+depts.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('')+'</select></div>'
      + '<div id="attRoster" style="max-height:45vh;overflow:auto;"></div>'
      + '<button class="btn btn-primary btn-block" onclick="submitAtt()">'+t('submit')+'</button>';
    renderAttRoster();
  }
  function renderAttRoster(){ const sel=document.getElementById('attDept').value; const list=STATE.employees.filter(e=>!sel||e.department===sel);
    const box=document.getElementById('attRoster'); if(!box) return;
    box.innerHTML=list.map(e=>'<div style="display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--border);"><select id="attSt'+esc(e.id)+'" style="padding:4px 6px;border:1px solid var(--border);border-radius:8px;font-size:13px;"><option value="P">P</option><option value="A">A</option><option value="L">L</option><option value="D">D</option><option value="N">N</option><option value="C">C</option></select><span style="flex:1;">'+esc(e.name||'')+' <span style="color:var(--muted-foreground);font-size:11px;">#'+esc(e.custom_number||e.id)+'</span></span></div>').join(''); }
  function submitAtt(){ const date=document.getElementById('colDate').value; if(!date){toast(t('fill_date'),'warning');return;}
    const marks=STATE.employees.filter(e=>!document.getElementById('attDept').value||e.department===document.getElementById('attDept').value).map(e=>({employee_id:e.id, status:document.getElementById('attSt'+e.id).value}));
    colSubmit('attendance', { submission_date:date, marks }); }

  // ── 出勤模块 (Phase 4) ──
  const ATT_STATUS = ['P','A','L','D','N','C'];
  function attStatusLabel(s){ return t('st_'+s.toLowerCase()); }
  function loadAttendance(){
    const root=document.getElementById('attRoot');
    root.innerHTML='<div class="loading" style="padding:32px;text-align:center;color:var(--muted-foreground);">'+t('loading')+'</div>';
    api('/attendance').then(d=>{
      STATE.attendance=d; STATE.attBatch=false; STATE.attBatchSel=new Set(); STATE._batchStatus='';
      buildAttUI();
    }).catch(()=>{ root.innerHTML='<div class="empty-state">'+t('load_fail')+'</div>'; });
  }
  function buildAttUI(){
    const d=STATE.attendance; if(!d) return;
    const ym = (d.dates&&d.dates[0]||'').slice(0,7);
    const ymLabel = ym? (ym.slice(0,4)+'年'+parseInt(ym.slice(5,7),10)+'月') : '';
    const depts=[...new Set((d.rows||[]).map(r=>r.department).filter(Boolean))].sort();
    const root=document.getElementById('attRoot');
    root.innerHTML =
      '<div class="att-month">'+t('att_month')+ymLabel+'</div>'
      + '<div class="att-toolbar">'
      + '<input class="att-search" id="attSearch" placeholder="🔍 '+t('search')+'" oninput="renderAttGrid()">'
      + '<select id="attDept" onchange="renderAttGrid()"><option value="">'+t('all_depts')+'</option>'+depts.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('')+'</select>'
      + '<button class="icon-btn" onclick="openAttJump()" title="'+t('jump_date')+'">📅</button>'
      + '<button class="icon-btn" id="attBatchBtn" onclick="toggleAttBatch()">'+t('batch_mark')+'</button>'
      + '</div>'
      + '<div id="attGrid" class="att-grid"></div>'
      + '<div id="attBatchPanel" class="att-batch" style="display:none;">'
      + '  <div class="field"><label class="field__label">'+t('date')+'</label><input type="date" id="attBatchDate" value="'+new Date().toISOString().slice(0,10)+'"></div>'
      + '  <div class="seg-row" id="attBatchStatus"></div>'
      + '  <button class="btn btn-primary btn-block" onclick="applyAttBatch()">'+t('apply_selected')+' (<span id="attBatchCount">0</span>)</button>'
      + '</div>'
      + '<div class="quick-actions"><button class="btn" onclick="quickLeave()">+ '+t('leave_apply')+'</button><button class="btn" onclick="quickSick()">+ '+t('leave_sick')+'</button></div>';
    renderAttGrid();
  }
  function renderAttGrid(){
    const d=STATE.attendance; if(!d) return;
    const q=(document.getElementById('attSearch').value||'').toLowerCase().trim();
    const dept=document.getElementById('attDept').value;
    const today=new Date().toISOString().slice(0,10);
    const rows=(d.rows||[]).filter(r=>(!dept||r.department===dept)&&(!q||(r.name||'').toLowerCase().includes(q)||String(r.id).toLowerCase().includes(q)));
    const grid=document.getElementById('attGrid'); if(!grid) return;
    if(!rows.length){ grid.innerHTML='<div class="empty-state">'+t('no_emp')+'</div>'; return; }
    grid.innerHTML=rows.map(r=>{
      const sel = STATE.attBatch ? '<input type="checkbox" class="att-sel" data-eid="'+esc(r.id)+'" '+(STATE.attBatchSel.has(r.id)?'checked':'')+' onchange="onAttSel(\''+esc(r.id)+'\',this.checked)">' : '';
      const cells=d.dates.map(dt=>{ const st=r.days[dt]||''; const isToday=dt===today; const jp=dt===STATE.attJump?' att-jump':''; return '<div class="att-cell'+jp+'" data-eid="'+esc(r.id)+'" data-d="'+dt+'" onclick="openAttEdit(\''+esc(r.id)+'\',\''+dt+'\')"><div class="att-cell__d'+(isToday?' att-today':'')+'">'+dt.slice(5)+'</div><div class="att-cell__s st-'+st+'">'+(st||'·')+'</div></div>'; }).join('');
      return '<div class="att-card">'
        + '<div class="att-card__head">'+sel+'<div class="avatar">'+esc(initials(r.name))+'</div><div class="att-card__meta"><div class="att-card__name">'+esc(r.name||'')+'</div><div class="att-card__num">#'+esc(r.custom_number||r.id)+'</div></div></div>'
        + '<div class="att-row">'+cells+'</div>'
        + '</div>';
    }).join('');
    if(STATE.attBatch) renderAttBatchStatus();
  }
  function initials(name){ if(!name) return '?'; const p=String(name).trim().split(/\s+/); return (p[0][0]+(p[1]?p[1][0]:'')).toUpperCase(); }
  function openAttEdit(eid, date){
    const r=STATE.attendance.rows.find(x=>x.id===eid);
    const cur=(r&&r.days[date])||'';
    const name=r? r.name : eid;
    let html='<div class="att-edit-name">'+esc(name)+'</div>'
      + '<div class="att-edit-cur">'+t('edit_att')+': <b class="st-'+cur+'">'+(cur||'·')+'</b></div>'
      + '<div class="att-edit-btns">'+ATT_STATUS.map(s=>'<button class="att-st-btn st-'+s+'" onclick="doAttToggle(\''+esc(eid)+'\',\''+date+'\',\''+s+'\')"><span class="att-st-dot st-'+s+'"></span>'+s+' · '+attStatusLabel(s)+'</button>').join('')+'</div>';
    document.getElementById('sheet-title').textContent=t('edit_att')+' - '+date;
    document.getElementById('sheet-body').innerHTML=html;
    document.getElementById('sheet').classList.add('show');
  }
  function doAttToggle(eid, date, status){
    api('/attendance/toggle',{method:'POST',body:JSON.stringify({employee_id:eid,date,status})}).then(r=>{
      if(r.ok){ const row=STATE.attendance.rows.find(x=>x.id===eid); if(row) row.days[date]=status; closeSheet(); renderAttGrid(); toast(t('saved')); }
      else if(r.need_admin){ toast(t('need_editor'),'error'); }
      else toast(r.error||t('fail'),'error');
    }).catch(()=>toast(t('fail'),'error'));
  }
  function toggleAttBatch(){ STATE.attBatch=!STATE.attBatch; if(!STATE.attBatch){ STATE.attBatchSel.clear(); } document.getElementById('attBatchPanel').style.display=STATE.attBatch?'block':'none'; const b=document.getElementById('attBatchBtn'); if(b) b.textContent=STATE.attBatch?t('cancel_batch'):t('batch_mark'); renderAttGrid(); }
  function onAttSel(eid, checked){ if(checked) STATE.attBatchSel.add(eid); else STATE.attBatchSel.delete(eid); const c=document.getElementById('attBatchCount'); if(c) c.textContent=STATE.attBatchSel.size; }
  function renderAttBatchStatus(){ const box=document.getElementById('attBatchStatus'); if(!box) return; box.innerHTML=ATT_STATUS.map(s=>'<button class="seg-opt st-'+s+'" onclick="setBatchStatus(\''+s+'\')">'+s+'</button>').join(''); }
  function setBatchStatus(s){ STATE._batchStatus=s; document.querySelectorAll('#attBatchStatus .seg-opt').forEach(b=>b.classList.toggle('active', b.textContent===s)); }
  function applyAttBatch(){
    const date=document.getElementById('attBatchDate').value; const st=STATE._batchStatus;
    if(!date){ toast(t('fill_date'),'warning'); return; }
    if(!st){ toast(t('pick_status'),'warning'); return; }
    const ids=[...STATE.attBatchSel];
    if(!ids.length){ toast(t('pick_emp'),'warning'); return; }
    Promise.all(ids.map(eid=>api('/attendance/toggle',{method:'POST',body:JSON.stringify({employee_id:eid,date,status:st})}))).then(res=>{
      let ok=0; res.forEach((r,i)=>{ if(r.ok){ const row=STATE.attendance.rows.find(x=>x.id===ids[i]); if(row) row.days[date]=st; ok++; } });
      toast(t('saved')+' ('+ok+'/'+ids.length+')'); renderAttGrid();
    }).catch(()=>toast(t('fail'),'error'));
  }
  function openAttJump(){ const today=new Date().toISOString().slice(0,10); const body=document.getElementById('sheet-body'); body.innerHTML='<div class="field"><label class="field__label">'+t('jump_date')+'</label><input type="date" id="attJumpDate" value="'+(STATE.attendance.dates.includes(today)?today:STATE.attendance.dates[0]||today)+'"></div><button class="btn btn-primary btn-block" onclick="doAttJump()">'+t('jump_date')+'</button>'; openSheet(t('jump_date'), body); }
  function doAttJump(){ const dt=document.getElementById('attJumpDate').value; closeSheet(); if(!dt) return; STATE.attJump=dt; renderAttGrid(); const cell=document.querySelector('.att-cell[data-d="'+dt+'"]'); if(cell) cell.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'}); }

  // 请假快捷入口
  function quickLeave(){ const body=document.getElementById('sheet-body'); const opts=(STATE.employees||[]).map(e=>'<option value="'+esc(e.id)+'">'+esc(e.name||'')+' #'+esc(e.custom_number||e.id)+'</option>').join(''); body.innerHTML='<div class="field"><label class="field__label">'+t('emp_list')+'</label><select id="ql-emp">'+opts+'</select></div><button class="btn btn-primary btn-block" onclick="openLeave(document.getElementById(\'ql-emp\').value)">'+t('next')+'</button>'; openSheet(t('leave_apply'), body); }
  function quickSick(){ const body=document.getElementById('sheet-body'); const opts=(STATE.employees||[]).map(e=>'<option value="'+esc(e.id)+'">'+esc(e.name||'')+' #'+esc(e.custom_number||e.id)+'</option>').join(''); body.innerHTML='<div class="field"><label class="field__label">'+t('emp_list')+'</label><select id="qs-emp">'+opts+'</select></div><div class="field"><label class="field__label">'+t('date')+'</label><input type="date" id="qs-date" value="'+new Date().toISOString().slice(0,10)+'"></div><button class="btn btn-primary btn-block" onclick="submitQuickSick()">'+t('submit')+'</button>'; openSheet(t('leave_sick'), body); }
  function submitQuickSick(){ const eid=document.getElementById('qs-emp').value; const date=document.getElementById('qs-date').value; if(!eid||!date){ toast(t('fill_date'),'warning'); return; } api('/api/leave/sick',{method:'POST',body:JSON.stringify({employee_id:eid,start_date:date,days:1})}).then(r=>{ if(r.ok){ toast(t('submitted')); closeSheet(); } else toast(r.error||t('fail'),'error'); }).catch(()=>toast(t('fail'),'error')); }

  // 采集 Tab 进入时刷新首页
  // ── 启动 ──
  applyTheme();
  applyLang();
  checkAuth();
  </script>
</body>
</html>
