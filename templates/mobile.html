<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="hsl(40 16% 98%)">
  <link rel="manifest" href="{{ static_url('manifest.webmanifest') }}">
  <meta name="mobile-web-app-capable" content="yes">
  <title>ENPRIZON LINDI</title>
  <link rel="stylesheet" href="{{ static_url('css/mobile.css') }}?v={{ version }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- 登录页（未认证时显示） -->
  <div id="login-screen" class="login-wrap" style="display:none;">
    <button class="icon-btn lang-pill login-lang" id="login-lang-btn" onclick="toggleLang()" title="Language / 语言">中</button>
    <div class="login-logo">
      <h1>ENPRIZON LINDI</h1>
      <p data-i18n="login_sub">薪资与产量管理系统 · 移动端</p>
    </div>
    <form id="login-form" onsubmit="return doLogin(event)">
      <div class="field">
        <label class="field__label" data-i18n="username">用户名</label>
        <input type="text" id="login-user" autocomplete="username" required>
      </div>
      <div class="field">
        <label class="field__label" data-i18n="password">密码</label>
        <div style="position:relative;">
          <input type="password" id="login-pass" autocomplete="current-password" required style="padding-right:40px;">
          <button type="button" onclick="togglePwd('login-pass', this)" aria-label="切换密码可见" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);padding:4px;line-height:1;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
           </button>
        </div>
      </div>
       <div id="mLoginError" style="display:none;color:#e53e3e;font-size:12px;margin:-4px 0 12px;"></div>
      <button type="submit" class="btn btn-primary btn-block" data-i18n="login">登录</button>
    </form>
  </div>

  <!-- 主应用 -->
  <div id="app" style="display:none;">
    <!-- 顶栏 -->
    <header class="top-bar">
      <button class="top-bar__back" id="topback" onclick="popPage()" aria-label="返回">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="22" height="22"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div style="flex:1; min-width:0;">
        <div class="top-bar__title" id="top-title" data-i18n="tab_dashboard">数据台</div>
        <div class="top-bar__month" id="top-month" onclick="openMonthSheet()">—</div>
      </div>
      <div class="top-bar__actions">
        <button class="icon-btn" id="search-btn" onclick="toggleSearch()" title="搜索" aria-label="搜索">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        </button>
        <button class="icon-btn lang-pill" id="lang-btn" onclick="toggleLang()" title="语言">中</button>
        <!-- OA 重设计 R2: 通知铃铛（登录显示，角标=未读通知数） -->
        <button class="icon-btn" id="notif-bell-m" onclick="openNotifSheet()" style="display:none;position:relative;" aria-label="通知">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span id="notif-badge-m" style="display:none;position:absolute;top:2px;right:2px;min-width:15px;height:15px;padding:0 3px;border-radius:999px;background:var(--destructive);color:#fff;font-size:10px;font-weight:700;line-height:15px;text-align:center;"></span>
        </button>
        <button class="icon-btn" id="theme-btn" onclick="toggleTheme()" title="主题" aria-label="主题">
          <svg id="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg id="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22" style="display:none;"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <!-- 需求5: 三道杠菜单按钮 -->
        <button class="icon-btn" id="menu-btn" onclick="toggleUserMenu(event)" aria-label="菜单">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>
    </header>

    <!-- 需求5: 用户下拉菜单（登录名/改密/退出） -->
    <div id="user-menu" style="display:none;position:fixed;top:52px;right:12px;width:200px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:0 8px 24px rgba(0,0,0,0.15);z-index:300;padding:8px;">
      <div style="padding:8px 10px;font-size:13px;font-weight:600;border-bottom:1px solid var(--border);margin-bottom:6px;" id="menu-user-name">—</div>
      <button class="menu-item" onclick="openChangePwdSheet()" data-i18n="btn_change_pwd">改密</button>
      <button class="menu-item" onclick="doMobileLogout()" data-i18n="btn_logout">退出</button>
    </div>

    <!-- 搜索栏（默认隐藏） -->
    <div id="search-bar" style="display:none; padding:8px 16px; background:var(--card); border-bottom:1px solid var(--border);">
      <input type="search" id="search-input" data-i18n-placeholder="search" placeholder="搜索..." oninput="onSearch(this.value)" style="width:100%; min-height:44px; padding:8px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--background);">
    </div>

    <main class="main-content">
      <!-- 数据台 -->
      <section class="tab-page active" id="tab-dashboard">
        <!-- 骨架屏 -->
        <div id="dash-skeleton" style="display:none;">
          <div class="kpi-grid">
            <div class="skeleton-card kpi"></div><div class="skeleton-card kpi"></div>
            <div class="skeleton-card kpi"></div><div class="skeleton-card kpi"></div>
            <div class="skeleton-card kpi"></div><div class="skeleton-card kpi"></div>
          </div>
          <div class="skeleton-card chart"></div>
          <div class="skeleton-card chart"></div>
        </div>
        <!-- 错误/空态 -->
        <div id="dash-error" class="state-box" style="display:none;">
          <div class="state-box__icon">⚠️</div>
          <div class="state-box__title" data-i18n="load_fail">加载失败</div>
          <div class="state-box__desc" id="dash-error-desc"></div>
          <button class="state-box__action" onclick="loadDashboard()" data-i18n="retry">重试</button>
        </div>
        <div id="dash-empty" class="state-box" style="display:none;">
          <div class="state-box__icon">∅</div>
          <div class="state-box__title" data-i18n="no_data">暂无产量数据</div>
        </div>
        <div id="dash-content" style="display:none;">
          <!-- 筛选控制栏（可折叠） -->
          <div class="control-bar" id="dash-control">
            <button class="control-bar__trigger" onclick="toggleDashFilter()">
              <span data-i18n="dashboard_title">数据台</span>
              <span class="ctrl-wrap"><span data-i18n="filter">筛选</span><span class="ctrl-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M6 9l6 6 6-6"/></svg></span></span>
            </button>
            <div class="control-bar__body">
              <div class="filter-group">
                <div class="filter-group__label" data-i18n="shift">班次</div>
                <div class="segmented" id="dash-shift-seg">
                  <div class="segmented__option active" data-v="all" onclick="setShiftFilter('all')" data-i18n="all">全部</div>
                  <div class="segmented__option" data-v="day" onclick="setShiftFilter('day')" data-i18n="day_shift">白班</div>
                  <div class="segmented__option" data-v="night" onclick="setShiftFilter('night')" data-i18n="night_shift">夜班</div>
                </div>
              </div>
              <div class="filter-group">
                <div class="filter-group__label" data-i18n="ore_type">矿石类型</div>
                <div class="segmented" id="dash-ore-seg">
                  <div class="segmented__option active" data-v="all" onclick="setOreFilter('all')" data-i18n="all">全部</div>
                  <div class="segmented__option ore-tag" data-v="nh" onclick="setOreFilter('nh')" data-i18n="nh">NICKEL(H)</div>
                  <div class="segmented__option ore-tag" data-v="nl" onclick="setOreFilter('nl')" data-i18n="nl">NICKEL(L)</div>
                  <div class="segmented__option ore-tag" data-v="mw" onclick="setOreFilter('mw')" data-i18n="mw">MAWE</div>
                 </div>
               </div>
               <div class="filter-group">
                 <div class="filter-group__label" data-i18n="dash_date_range">日期范围</div>
                 <div style="display:flex;gap:6px;align-items:center;">
                   <input type="date" id="dashDateFrom" class="dash-date-input" style="flex:1;min-width:0;">
                   <span style="color:var(--text-muted);font-size:12px;">—</span>
                   <input type="date" id="dashDateTo" class="dash-date-input" style="flex:1;min-width:0;">
                 </div>
               </div>
             </div>
          </div>
          <div class="kpi-grid" id="kpi-grid"></div>
          <div class="chart-box">
            <div class="chart-box__title" data-i18n="trend">产量趋势</div>
            <div class="chart-canvas-wrap chart-loading" style="height:160px;"><canvas id="chart-trend"></canvas></div>
          </div>
          <div class="chart-box">
            <div class="chart-header">
              <div class="chart-box__title" id="chart-daynight-title" data-i18n="day_night">白班 vs 夜班</div>
              <div class="cmp-tab" id="dn-cmp-tab">
                <button class="cmp-tab__item active" data-v="all" onclick="setDnTab('all')" data-i18n="total">合计</button>
                <button class="cmp-tab__item" data-v="nh" onclick="setDnTab('nh')" data-i18n="nh">NICKEL(H)</button>
                <button class="cmp-tab__item" data-v="nl" onclick="setDnTab('nl')" data-i18n="nl">NICKEL(L)</button>
                <button class="cmp-tab__item" data-v="mw" onclick="setDnTab('mw')" data-i18n="mw">MAWE</button>
              </div>
            </div>
            <div class="chart-canvas-wrap" style="height:160px;"><canvas id="chart-daynight"></canvas></div>
          </div>
          <div class="chart-box">
            <div class="chart-box__title" data-i18n="dash_driller_salary">班组薪资对比</div>
            <div class="chart-canvas-wrap" style="height:170px;"><canvas id="chart-salary"></canvas></div>
          </div>
          <div class="chart-box">
            <div class="chart-box__title" data-i18n="driller_output">钻工组产量</div>
            <div class="chart-canvas-wrap" style="height:160px;"><canvas id="chart-driller"></canvas></div>
            <div class="chart-note" data-i18n="chart_drill_note">点击柱子查看逐日明细</div>
          </div>
          <div class="chart-box">
            <div class="chart-box__title" data-i18n="ore_type">矿石类型占比</div>
            <div class="donut-wrap">
              <div class="donut-canvas-wrap">
                <canvas id="chart-ore"></canvas>
                <div class="donut-center"><span class="donut-center__value" id="donut-total">0</span><span class="donut-center__label" data-i18n="total">合计</span></div>
              </div>
              <div class="donut-legend" id="ore-legend"></div>
            </div>
          </div>
          <div class="card">
            <div class="card-title" data-i18n="crush_table">破碎产量</div>
            <div class="crush-table">
              <div class="crush-table__row head"><span data-i18n="date">日期</span><span data-i18n="bags">袋数</span><span data-i18n="emp">人数</span></div>
              <div id="crush-list"></div>
              <div class="crush-total-row"><span data-i18n="total">合计</span><span class="num" id="crush-total-bags">0</span><span id="crush-total-emp">0</span></div>
            </div>
          </div>
        </div>
      </section>

      <!-- 员工 -->
      <section class="tab-page" id="tab-employees">
        <!-- 分段控制（999px 胶囊 + 待审红色 badge） -->
        <div class="segmented segmented--pills" id="emp-seg" style="margin-bottom:12px;">
          <div class="segmented__option active" data-v="list" onclick="setEmpSeg('list')" data-i18n="emp_list">员工列表</div>
          <div class="segmented__option" data-v="pending" onclick="setEmpSeg('pending')"><span class="seg-pill-label"><span data-i18n="oa_pending">待审</span><span class="oa-badge" id="oa-pending-n" style="display:none;">0</span></span></div>
          <div class="segmented__option" data-v="history" onclick="setEmpSeg('history')" data-i18n="oa_history">已审批</div>
          <div class="segmented__option" data-v="mine" id="emp-seg-mine" onclick="setEmpSeg('mine')" data-i18n="oa_mine_tab">我的申请</div>
        </div>
        <!-- 搜索栏 -->
        <div id="emp-search-wrap" class="search-field" style="display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="search" id="emp-search" data-i18n-placeholder="search_emp_ph" placeholder="搜索员工..." oninput="onEmpSearch(this.value)">
        </div>
        <!-- 员工列表 -->
        <div id="emp-list">
          <div class="skeleton-card kpi" id="emp-list-skeleton"></div>
          <div class="skeleton-card kpi"></div>
          <div class="skeleton-card kpi"></div>
        </div>
        <!-- 员工档案 -->
        <div id="emp-detail" style="display:none;"></div>
        <!-- OA 待审/已审批 -->
        <div id="oa-list" style="display:none;"></div>
      </section>

      <!-- 采集 -->
      <section class="tab-page" id="tab-collection">
        <div id="col-home"></div>
        <div id="col-form" style="display:none;"></div>
      </section>

      <!-- 出勤 -->
      <section class="tab-page" id="tab-attendance">
        <div id="attRoot"></div>
      </section>
    </main>

    <!-- 底部 Tab Bar -->
    <nav class="tab-bar">
      <div class="tab-bar__item active" data-tab="dashboard" onclick="switchTab('dashboard')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        <span data-i18n="tab_dashboard">数据台</span>
      </div>
      <div class="tab-bar__item" data-tab="employees" onclick="switchTab('employees')" style="position:relative;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M21 21v-2a4 4 0 0 0-3-3.87"/></svg>
        <span data-i18n="tab_employees">员工</span>
        <span class="tab-bar__badge" id="oaTabBadge" style="display:none;" onclick="event.stopPropagation();switchTab('employees');setEmpSeg('pending')">0</span>
      </div>
      <div class="tab-bar__item" data-tab="collection" onclick="switchTab('collection')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></svg>
        <span data-i18n="tab_collection">采集</span>
      </div>
      <div class="tab-bar__item" data-tab="attendance" onclick="switchTab('attendance')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span data-i18n="tab_attendance">出勤</span>
      </div>
    </nav>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- 底部 Sheet -->
    <div class="sheet-overlay" id="sheet" onclick="if(event.target===this)closeSheet()">
      <div class="sheet-content" id="sheet-content">
        <div class="sheet-handle"></div>
        <div class="sheet-header"><span id="sheet-title"></span><button class="icon-btn" onclick="closeSheet()">✕</button></div>
        <div id="sheet-body"></div>
      </div>
    </div>

    <!-- 编辑档案 Modal（modal-sheet 三区） -->
    <div id="modal-overlay" class="modal-overlay" style="display:none;" onclick="if(event.target===this)closeModal()">
      <div class="modal-sheet">
        <div class="modal-header">
          <div class="modal-title" id="modal-title"></div>
          <button class="modal-close-btn" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body" id="modal-body"></div>
        <div class="modal-footer" id="modal-footer"></div>
      </div>
    </div>
  </div>

  <script src="{{ static_url('js/i18n.js') }}?v={{ version }}"></script>
  <script src="{{ static_url('js/chart.umd.min.js') }}"></script>
  <script src="{{ static_url('js/chartjs-plugin-datalabels.min.js') }}"></script>
  <script src="{{ static_url('js/chartjs-plugin-zoom.min.js') }}"></script>
  <script>
  // ═══════════════════════════════════════════════
  //  P16 移动端 SPA — Phase 1: 骨架 + 数据台
  // ═══════════════════════════════════════════════
  const STATE = {
    auth: null,
    currentMonth: '',
    dashboard: null,
    theme: localStorage.getItem('m_theme') || 'light',
    lang: localStorage.getItem('m_lang') || 'zh',
    shiftFilter: 'all',
    teamFilter: 'all',
    charts: {},
    attendance: null,
    attJump: '',
    dashDateFrom: '',
    dashDateTo: '',
  };

  const I18N = null; // 已废弃：统一使用 static/js/i18n.js 的 I18N_DICT
  // P33: 渲染时注入的进程版本号（部署重启后变化，供版本心跳比对）
  window.__APP_VERSION = '{{ version }}';
  function t(key, vars){
    let s;
    if (window.I18N_DICT) {
      const dict = I18N_DICT[STATE.lang] || I18N_DICT.zh || {};
      s = dict[key] !== undefined ? dict[key] : key;
    } else {
      // 兼容回退：i18n.js 未加载时返回 key 本身
      s = key;
    }
    if (vars && s.includes('{')) {
      for (const k in vars) s = s.split('{'+k+'}').join(String(vars[k]));
    }
    return s;
  }

  // ── 工具 ──
  // P0 修复: 子路径部署兼容(/salary/m → API_BASE=/salary),对齐桌面端 index.html
  const API_BASE = (function() {
    const p = window.location.pathname;
    const i = p.indexOf('/', 1);
    return i > 0 ? p.substring(0, i) : '';
  })();
  function api(path, opts){ return fetch(API_BASE + path, Object.assign({ credentials:'same-origin', headers:{'Content-Type':'application/json'} }, opts)).then(r=>r.json()); }
  // 带 HTTP 状态返回（用于区分 403 等场景），不破坏 api() 调用方
  function apiStatus(path, opts){ return fetch(API_BASE + path, Object.assign({ credentials:'same-origin', headers:{'Content-Type':'application/json'} }, opts)).then(r=>r.json().then(j=>({status:r.status, json:j}))); }
  function fmt(n){ n = Number(n)||0; return n.toLocaleString('en-US'); }
  function toast(msg, type){ const el=document.getElementById('toast'); el.textContent=msg; el.className='toast show'+(type?(' '+type):''); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),2500); }

  // ── P33: 版本心跳 — 检测到部署更新自动刷新（表单输入聚焦时改提示条），覆盖 bfcache/冻结恢复 ──
  let _verTimer = null;
  let _verSeen = false;         // 本会话已检测到版本变化（避免重复弹条）
  let _hiddenAt = 0;            // 页面进入后台的时间戳（长时隐藏恢复时强制刷新）
  function _verBanner(){
    let el = document.getElementById('ver-banner');
    if(!el){
      el = document.createElement('div');
      el.id = 'ver-banner';
      el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;display:none;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;background:#fef3c7;color:#92400e;font-size:13px;font-weight:600;border-bottom:1px solid #f59e0b;box-sizing:border-box;';
      el.innerHTML = '<span>'+t('ver_update_tip')+'</span>'
        + '<button onclick="location.reload()" style="border:none;background:#92400e;color:#fff;border-radius:999px;padding:5px 14px;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;">'+t('ver_refresh')+'</button>';
      document.body.appendChild(el);
    }
    el.style.display='flex';
  }
  // 是否正在填写表单/输入框聚焦：若是则用提示条而非强制刷新，避免丢失已录入内容
  function _isInFormInput(){
    const ae = document.activeElement;
    if(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return true;
    // 采集/出勤表单（col-form 内含井下出渣、出勤收集、钻工/破碎采集）可见即视为编辑中
    const formEl = document.getElementById('col-form');

  }
  function _onVersionChanged(longHidden){
    if(_verSeen) return;
    _verSeen = true;
    // 长时隐藏后恢复（隔天再开）或未在填表 → 自动刷新拿最新版
    if(longHidden || !_isInFormInput()){ location.reload(); return; }
    // 正在填表 → 不打断，顶部提示条供稍后手动刷新
    _verBanner();
  }
  function _checkAppVersion(longHidden){
    if(!window.__APP_VERSION) return;
    api('/api/version').then(r=>{
      if(r && r.version && String(r.version) !== String(window.__APP_VERSION)) _onVersionChanged(!!longHidden);
    }).catch(()=>{});
  }
  function _startVersionWatch(){
    if(_verTimer) return;
    // 后台标签页 setInterval 会被浏览器节流/冻结，故以「可见/恢复」事件驱动为主，轮询仅兜底
    _verTimer = setInterval(()=>_checkAppVersion(false), 60000);
    document.addEventListener('visibilitychange', ()=>{
      if(document.visibilityState==='hidden'){ _hiddenAt = Date.now(); return; }
      // 恢复可见：长时隐藏(>60s)视为「隔天再开」，命中版本变化即强制刷新
      _checkAppVersion(Date.now() - _hiddenAt > 60000);
    });
    // bfcache / 页面从浏览器恢复会话：persisted 事件恢复的是旧 JS 状态，务必立即校验
    window.addEventListener('pageshow', (e)=>_checkAppVersion(e && e.persisted));
    // Page Lifecycle API：后台标签页被冻结后解冻（freeze/resume），比 visibilitychange 覆盖更全
    document.addEventListener('resume', ()=>_checkAppVersion(Date.now() - _hiddenAt > 60000));
    _checkAppVersion(false);
  }

   // S1: 日期输入变更 → 写 STATE + 重绘（起止钳制：from<=to，防手动键入倒挂致过滤空集）
   function setDashDateFrom(v){ STATE.dashDateFrom=v; if(STATE.dashDateTo && STATE.dashDateTo < v) STATE.dashDateTo = v; const _t=document.getElementById('dashDateTo'); if(_t && _t.value !== STATE.dashDateTo) _t.value = STATE.dashDateTo; renderDashboard(); }
   function setDashDateTo(v){ STATE.dashDateTo=v; if(STATE.dashDateFrom && v < STATE.dashDateFrom) STATE.dashDateFrom = v; const _f=document.getElementById('dashDateFrom'); if(_f && _f.value !== STATE.dashDateFrom) _f.value = STATE.dashDateFrom; renderDashboard(); }

   // 按班次 + 矿石类型双重过滤，返回逐日 {date, nh, nl, mw, total}
  // C8: 新格式(teams)存在时按 teams 聚合(不受 shiftFilter)，旧格式保持原逻辑
  function filteredShift(){
    const d = STATE.dashboard; if(!d) return [];
    // S1: 日期范围过滤
    const df = STATE.dashDateFrom, dt = STATE.dashDateTo;
    const ore = STATE.dashOreFilter;
    const isNew = (d.shift_production||[]).some(s=>Array.isArray(s.teams));
    // S1: 先按日期范围切片，再走后续聚合
    let _rows = (d.shift_production||[]);
    if(df) _rows = _rows.filter(s => s.date >= df);
    if(dt) _rows = _rows.filter(s => s.date <= dt);
    if(isNew){
      const tf = STATE.teamFilter;
      return _rows.map(s=>{
        let nh=0,nl=0,mw=0;
        (s.teams||[]).forEach(tm=>{
          // P31 B1: 班组筛选时只累加该班组产量，其余班组置 0（对齐 Web getProdValue）
          if(tf!=='all' && String(tm.team_id)!==String(tf)) return;
          nh+=(tm.nh||0); nl+=(tm.nl||0); mw+=(tm.mw||0);
        });
        if(ore==='nh'){ nl=0; mw=0; }
        else if(ore==='nl'){ nh=0; mw=0; }
        else if(ore==='mw'){ nh=0; nl=0; }
        return { date:s.date, nh, nl, mw, total:nh+nl+mw, teams:s.teams||[] };
      });
    }
    return _rows.map(s=>{
      let nh, nl, mw;
      if(STATE.shiftFilter==='day'){ nh=s.day_nh||0; nl=s.day_nl||0; mw=s.day_mw||0; }
      else if(STATE.shiftFilter==='night'){ nh=s.night_nh||0; nl=s.night_nl||0; mw=s.night_mw||0; }
      else { nh=s.total_nh||0; nl=s.total_nl||0; mw=s.total_mw||0; }
      if(ore==='nh'){ nh=nh; nl=0; mw=0; }
      else if(ore==='nl'){ nh=0; nl=nl; mw=0; }
      else if(ore==='mw'){ nh=0; nl=0; mw=mw; }
      return { date:s.date, nh, nl, mw, total:nh+nl+mw };
    });
  }

  function renderDashboard(){
    if(!STATE.dashboard) return;
    const data = filteredShift();
    const sum = (k)=>data.reduce((a,s)=>a+(s[k]||0),0);
    const totals = { nh:sum('nh'), nl:sum('nl'), mw:sum('mw') };
    const dayTot = data.map(s=>s.total).filter(x=>x>0);
    const avg = dayTot.length? dayTot.reduce((a,b)=>a+b,0)/dayTot.length : 0;
    const maxVal = dayTot.length? Math.max(...dayTot) : 0;
    const maxDate = maxVal? (data.find(s=>s.total===maxVal)||{}).date||'' : '';
    const isNew = (STATE.dashboard.shift_production||[]).some(s=>Array.isArray(s.teams));
    let kpis;
    if(isNew){
      // C8: 新格式按班组 totals 替代白夜班比
      // 班组占比与 web 端一致：每个班组的总产量 ÷ 本月总产量（各班组合计）的百分比
      const teamTotals={};
      (STATE.dashboard.shift_production||[]).forEach(s=>{(s.teams||[]).forEach(tm=>{
        const nm=tm.team_name||('T'+tm.team_id);
        teamTotals[nm]=(teamTotals[nm]||0)+(tm.total!=null?tm.total:((tm.nh||0)+(tm.nl||0)+(tm.mw||0)));
      });});
      const _tv=Object.values(teamTotals);
      const _grand=_tv.reduce((a,b)=>a+b,0)||1;
      const teamStr = _tv.length? Object.entries(teamTotals).map(([k,v])=>k+' '+Math.round(v/_grand*100)+'%').join('  ') : '—';
      kpis = [
        { l:t('kpi_nh_month'), v:fmt(totals.nh), ind:'ind-i4' },
        { l:t('kpi_nl_month'), v:fmt(totals.nl), ind:'ind-i2' },
        { l:t('kpi_mw_month'), v:fmt(totals.mw), ind:'ind-i5' },
        { l:t('kpi_daily_avg'), v:fmt(Math.round(avg)), ind:'ind-neutral' },
        { l:t('kpi_day_max'), v:fmt(maxVal), sub:maxDate? maxDate.slice(5).replace('-','/') : '', ind:'ind-i2' },
        { l:t('dash_team_title'), v:teamStr, ind:'ind-i4' },
      ];
    } else {
      const daySum = (STATE.dashboard.shift_production||[]).reduce((a,s)=>a+s.day_nh+s.day_nl+s.day_mw,0);
      const nightSum = (STATE.dashboard.shift_production||[]).reduce((a,s)=>a+s.night_nh+s.night_nl+s.night_mw,0);
      const ratio = nightSum? (daySum/nightSum).toFixed(2)+':1' : '—';
      kpis = [
        { l:t('kpi_nh_month'), v:fmt(totals.nh), ind:'ind-i4' },
        { l:t('kpi_nl_month'), v:fmt(totals.nl), ind:'ind-i2' },
        { l:t('kpi_mw_month'), v:fmt(totals.mw), ind:'ind-i5' },
        { l:t('kpi_daily_avg'), v:fmt(Math.round(avg)), ind:'ind-neutral' },
        { l:t('kpi_day_max'), v:fmt(maxVal), sub:maxDate? maxDate.slice(5).replace('-','/') : '', ind:'ind-i2' },
        { l:t('kpi_ratio'), v:ratio, ind:'ind-i4' },
      ];
    }
    document.getElementById('kpi-grid').innerHTML = kpis.map(k=>'<div class="kpi '+k.ind+'"><div class="kpi__label">'+k.l+'</div><div class="kpi__value" style="font-size:'+(k.v.length>18?'11px':'')+'">'+k.v+'</div>'+(k.sub?'<div class="kpi-sub">'+k.sub+'</div>':'')+'</div>').join('');

    drawTrend();
    drawDayNight();
    drawDrillerSalary();
    drawDriller();
    drawOre(totals);
    renderCrush();
  }

  function newChart(id, cfg){
    if(STATE.charts[id]) STATE.charts[id].destroy();
    const el=document.getElementById(id);
    if(!el) return;
    // 移除 chart-loading 遮罩
    const wrap=el.closest('.chart-loading'); if(wrap) wrap.classList.remove('chart-loading');
    STATE.charts[id] = new Chart(el, cfg);
  }
  function baseOpts(){ return { responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false }, datalabels:{ display:false } }, scales:{ x:{ ticks:{ font:{size:9}, maxRotation:0 }, grid:{ display:false } }, y:{ ticks:{ font:{size:9} }, grid:{ color:'hsl(44 26.32% 88.82%)' } } } }; }

  // 产量趋势：白班/夜班/合计 三线（设计稿 dashboard.html:450-460）
  // 趋势图直接读原始 shift 数据（三线本身即班次维度），矿石过滤生效
  // 需求3: K线式交互 — 缩放/平移(chartjs-plugin-zoom 本地引入) + 十字光标 + tooltip 三值
  let _trendZoomAvailable = (typeof ChartZoom !== 'undefined');
  const crosshairPlugin = {
    id: 'mobileCrosshair',
    afterDraw(chart){
      if(chart.$cx === undefined || chart.$cy === undefined) return;
      const ctx = chart.ctx, area = chart.chartArea;
      ctx.save();
      ctx.strokeStyle = 'rgba(60,53,43,0.28)';
      ctx.setLineDash([3,3]);
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(chart.$cx, area.top); ctx.lineTo(chart.$cx, area.bottom); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(area.left, chart.$cy); ctx.lineTo(area.right, chart.$cy); ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }
  };
  function trendHover(e, els, chart){
    const area = chart.chartArea;
    if(e.x >= area.left && e.x <= area.right && e.y >= area.top && e.y <= area.bottom){
      chart.$cx = e.x; chart.$cy = e.y;
    } else { chart.$cx = undefined; chart.$cy = undefined; }
    chart.draw();
  }
  function drawTrend(){
    let sp = STATE.dashboard.shift_production || [];
    // S1: 日期范围过滤
    const df = STATE.dashDateFrom, dt = STATE.dashDateTo;
    if(df) sp = sp.filter(s => s.date >= df);
    if(dt) sp = sp.filter(s => s.date <= dt);
    if(!sp.length) return;
    const isNew = sp.some(s=>Array.isArray(s.teams));
    const labels = sp.map(s=>s.date.slice(5));
    const oreKeys = STATE.dashOreFilter==='all' ? ['nh','nl','mw'] : [STATE.dashOreFilter];
    const colors = { nh:'hsl(30 92% 52%)', nl:'hsl(210 85% 52%)', mw:'hsl(150 70% 38%)' };
    let datasets, tooltipCb;
    if(isNew){
      // P31 D2: 新格式 = 每班组一条线，labels 与 datasets 同源于 sp（决策 3：矿石筛选取 tm[ore]/否则 tm.total）
      const teamInfo = {};
      sp.forEach(s=>{(s.teams||[]).forEach(tm=>{ teamInfo[tm.team_id]=tm.team_name||('T'+tm.team_id); });});
      let teamIds = Object.keys(teamInfo).sort((a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true}));
      // P31 B1: 班组筛选时只渲染该班组一条线（对齐 Web）
      if(STATE.teamFilter!=='all') teamIds = teamIds.filter(tid=>String(tid)===String(STATE.teamFilter));
      const ore = STATE.dashOreFilter;
      tooltipCb = (ctx)=>{ 
        // P32: 每个班组按物料拆分 NH/NL/MW，仅显示有产量的物料（0 不显示）
        let label = ' '+(ctx.dataset.teamName||ctx.dataset.label);
        if(ore==='all'){
          const tid = teamIds[ctx.datasetIndex];
          const s = sp[ctx.dataIndex];
          const tm = s && (s.teams||[]).find(x=>String(x.team_id)===String(tid));
          if(tm){
            const parts=[];
            if((tm.nh||0)>0) parts.push('NH '+fmt(tm.nh));
            if((tm.nl||0)>0) parts.push('NL '+fmt(tm.nl));
            if((tm.mw||0)>0) parts.push('MW '+fmt(tm.mw));
            if(parts.length) return label+': '+parts.join('   ');
          }
        }
        return label+': '+fmt(ctx.parsed.y||0);
      };
      datasets = teamIds.map((tid,i)=>{
        const c = TEAM_COLORS[i % TEAM_COLORS.length];
        return {
          label: teamInfo[tid], teamName: teamInfo[tid],
          data: sp.map(s=>{
            const tm=(s.teams||[]).find(x=>String(x.team_id)===String(tid));
            if(!tm) return 0;
            return ore==='all' ? (tm.total!=null?tm.total:((tm.nh||0)+(tm.nl||0)+(tm.mw||0))) : (tm[ore]||0);
          }),
          borderColor: c.line, backgroundColor: 'transparent', fill:false, tension:0.3, pointRadius:0,
        };
      });
    } else {
      const prefix = STATE.shiftFilter==='day' ? 'day_' : STATE.shiftFilter==='night' ? 'night_' : 'total_';
      tooltipCb = (ctx)=>{
        const k = ctx.dataset.oreKey;
        const s = sp[ctx.dataIndex];
        const dayV = s ? (s['day_'+k]||0) : 0;
        const nightV = s ? (s['night_'+k]||0) : 0;
        return ' '+k.toUpperCase()+': '+fmt(ctx.parsed.y||0)+'  ('+t('day_shift')+' '+fmt(dayV)+' / '+t('night_shift')+' '+fmt(nightV)+')';
      };
      datasets = oreKeys.map(k=>({ label:k.toUpperCase(), oreKey:k, data: sp.map(s=>s[prefix+k]||0), borderColor:colors[k], backgroundColor:'transparent', fill:false, tension:0.3, pointRadius:0 }));
    }
    const opts = Object.assign(baseOpts(), {
      plugins:{
        legend:{ display:true, position:'bottom', labels:{ font:{size:9} } },
        tooltip:{ mode:'index', intersect:false, callbacks:{ label:tooltipCb } },
      },
      hover:{ mode:'index', intersect:false },
      onHover: trendHover,
    });
    if(_trendZoomAvailable){
      opts.plugins.zoom = {
        pan: { enabled: true, mode:'x' },
        zoom: { wheel: { enabled: true }, pinch: { enabled: true }, mode:'x' },
      };
    }
    newChart('chart-trend', { type:'line', data:{ labels, datasets }, options: opts, plugins:[crosshairPlugin] });
    // P31 D4/决策 10: 月份断言 — labels 首末日期必须属于当前所选月
    (function(){
      const cm = STATE.currentMonth;
      if(!cm || !sp.length) return;
      const first = (sp[0].date||'').slice(0,7), last = (sp[sp.length-1].date||'').slice(0,7);
      if(first !== cm || last !== cm) console.warn('[P31] 趋势图月份错位: labels ' + first + '~' + last + ' ≠ 所选月 ' + cm);
    })();
    // 修复: zoom 插件精简版(12KB)defaults 无 doubleClick 配置,双击重置不生效。
    // 改手动 dblclick 监听调用 chart.resetZoom()(函数存在且可用),防重复绑定用 canvas 标志。
    const _trendEl = document.getElementById('chart-trend');
    if(_trendEl && !_trendEl._zoomDblListener){
      _trendEl._zoomDblListener = true;
      _trendEl.addEventListener('dblclick', ()=>{ const c=STATE.charts['chart-trend']; if(c && c.resetZoom) c.resetZoom(); });
    }
  }
  // 白班 vs 夜班：按 dnTab 切换 NH/NL/MW/合计 双柱 — C8 新格式用班组对比

      const teamIds = [...new Set(sp.flatMap(s=>(s.teams||[]).map(tm=>tm.team_id)))].sort((a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true}));
      const teamNames = {};
      sp.forEach(s=>{(s.teams||[]).forEach(tm=>{ teamNames[tm.team_id]=tm.team_name||('T'+tm.team_id); });});
      const datasets = teamIds.map((tid,i)=>{
        const c = TEAM_COLORS[i % TEAM_COLORS.length];

          legend:{ display:true, position:'bottom', labels:{ font:{size:9} } },
          // 柱顶显示班组重量（合计），悬停显示 NH/NL/MW 明细（零值不显示）
          datalabels:{
            display:function(ctx){ return ctx.dataset.data[ctx.dataIndex]>0; },
            color:'#7a6f5c', font:{ size:8, weight:'600' }, anchor:'end', align:'top', offset:1,
            formatter:function(v){ return v?Math.round(v):''; }
          },
          tooltip:{ callbacks:{
            title:function(items){
              const it=items&&items[0]; if(!it) return '';
              const tid=teamIds[it.datasetIndex]; const s=sp[it.dataIndex];
              return (teamNames[tid]||('T'+tid))+(s?'  '+s.date.slice(5):'');
            },
            label:function(it){
              const tid=teamIds[it.datasetIndex]; const s=sp[it.dataIndex];
              const tm=s&&(s.teams||[]).find(x=>String(x.team_id)===String(tid)); if(!tm) return '';
              const nh=tm.nh||0,nl=tm.nl||0,mw=tm.mw||0; const out=[];
              if(nh) out.push('NH  '+Math.round(nh));
              if(nl) out.push('NL  '+Math.round(nl));
              if(mw) out.push('MW  '+Math.round(mw));
              out.push('= '+Math.round(nh+nl+mw));
              return out;
            }
          } }
        }
      }) });
      return;

    const ore = STATE.dnTab;
    const field = ore==='nh'?'nh':(ore==='nl'?'nl':(ore==='mw'?'mw':null));
    const dayData = sp.map(s=> field? (s['day_'+field]||0) : (s.day_nh+s.day_nl+s.day_mw));
    const nightData = sp.map(s=> field? (s['night_'+field]||0) : (s.night_nh+s.night_nl+s.night_mw));
    newChart('chart-daynight', { type:'bar', data:{ labels, datasets:[
      { label:t('day_shift'), data:dayData, backgroundColor:'hsl(200 60% 45%)', borderRadius:3 },
      { label:t('night_shift'), data:nightData, backgroundColor:'hsl(180 50% 40%)', borderRadius:3 },
    ]}, options: Object.assign(baseOpts(), { plugins:{ legend:{ display:true, position:'bottom', labels:{ font:{size:9} } } } }) });

  // 班组薪资对比：每日各班薪资总额（V2 凸性计薪：Σ(产量×单价)×加速系数），与出勤无关
  function drawDrillerSalary(){
    let sp = STATE.dashboard.shift_production || [];
    // S1: 日期范围过滤
    const df = STATE.dashDateFrom, dt = STATE.dashDateTo;
    if(df) sp = sp.filter(s => s.date >= df);
    if(dt) sp = sp.filter(s => s.date <= dt);
    const el = document.getElementById('chart-salary');
    if(!el) return;
    if(!sp.length || !sp.some(s=>Array.isArray(s.teams))){ el.style.display='none'; return; }
    el.style.display='block';
    // 日期 1号→月末 升序（与产量趋势/班组对比一致）
    const rows = sp.slice().sort((a,b)=> a.date<b.date?-1 : a.date>b.date?1 : 0);
    const labels = rows.map(s=>s.date.slice(5));
    const teamInfo = {};
    rows.forEach(s=>(s.teams||[]).forEach(tm=>{ if(tm.team_id!=null && Number(tm.team_id)!==0) teamInfo[tm.team_id]=tm.team_name||('T'+tm.team_id); }));
    const teamIds = Object.keys(teamInfo).sort((a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true}));
    if(!teamIds.length){ el.style.display='none'; return; }
    const coefOf = (s,tid)=>{
      const tm=(s.teams||[]).find(x=>String(x.team_id)===String(tid));
      return tm && tm.coef!=null ? Number(tm.coef).toFixed(2) : '1.00';
    };
    const datasets = teamIds.map((tid,i)=>{
      const c = TEAM_COLORS[i % TEAM_COLORS.length];
      return {
        label: teamInfo[tid],
        data: rows.map(s=>{
          const tm=(s.teams||[]).find(x=>String(x.team_id)===String(tid));
          return tm ? (tm.salary||0) : 0;
        }),
        backgroundColor: c.line+'CC', borderColor: c.line, borderWidth:1, borderRadius:3,
      };
    });
    const opts = Object.assign(baseOpts(), {
      plugins:{
        legend:{ display:true, position:'bottom', labels:{ font:{size:9} } },
        datalabels:{
          display:function(ctx){
            const n=ctx.chart.data.labels.length;
            if(n>14 && ctx.dataIndex % Math.ceil(n/14)!==0) return false;
            return (ctx.dataset.data[ctx.dataIndex]||0) > 0;
          },
          color:'#574d42',
          font:{ size:8, weight:'600' },
          anchor:'end', align:'top', offset:0,
          formatter:function(v,ctx){
            if(!v) return '';
            // 顶部金额，其下显示加速系数
            return fmt(Math.round(v))+'\n×'+coefOf(rows[ctx.dataIndex], teamIds[ctx.datasetIndex]);
          },
        },
        tooltip:{ mode:'index', intersect:false, callbacks:{ label:function(ctx){
          // 移动端窄屏：tooltip 保持精简（金额+系数），避免超长截断；系数随语言切换
          const s=rows[ctx.dataIndex], tid=teamIds[ctx.datasetIndex];
          return ' '+(ctx.dataset.label||'')+': '+fmt(Math.round(ctx.raw||0))+'  '+t('coef_label')+'×'+coefOf(s,tid);
        } } },
      },
      hover:{ mode:'index', intersect:false },
    });
    newChart('chart-salary', { type:'bar', data:{ labels, datasets }, options: opts });
  }
  // 钻工组产量：按队长分组对比（对齐 Web renderDrillerGroupChart），点击柱子查看逐日明细
  function drawDriller(){
    let dp = STATE.dashboard.driller_production || [];
    // S1: 日期范围过滤
    const df = STATE.dashDateFrom, dt = STATE.dashDateTo;
    if(df) dp = dp.filter(d => d.date >= df);
    if(dt) dp = dp.filter(d => d.date <= dt);
    const el = document.getElementById('chart-driller');
    if(!el) return;
    if(!dp.length){ el.style.display='none'; return; }
    // 按队长分组，累加整月 NH/NL/MW，同时保留逐日明细用于点击弹窗
    const captains = {};
    dp.forEach(d=>{
      const cap = d.captain;
      if(!captains[cap]) captains[cap]={ nh:0, nl:0, mw:0, daily:[] };
      captains[cap].nh += d.nh||0;
      captains[cap].nl += d.nl||0;
      captains[cap].mw += d.mw||0;
      captains[cap].daily.push(d);
    });
    const capNames = Object.keys(captains);
    if(!capNames.length){ el.style.display='none'; return; }
    el.style.display='block';
    const colors = ['hsl(55 24% 49%)','hsl(0 15% 32%)','hsl(70 10% 50%)']; // NH/NL/MW
    const datasets = ['nh','nl','mw'].map((key,i)=>({
      label:t(key), data:capNames.map(c=>captains[c][key]||0),
      backgroundColor:colors[i], borderRadius:2,
    }));

      plugins:{
        legend:{ display:true, position:'bottom', labels:{ font:{size:9} } },
        datalabels:{
          // 只在堆叠段顶部显示该队长整月总车次（仅 >0）
          display:function(ctx){ return ctx.datasetIndex===datasets.length-1 && ctx.dataset.data[ctx.dataIndex]>0; },
          color:'#574d42', font:{ size:8, weight:'700' }, anchor:'end', align:'top', offset:1,
          formatter:function(v,ctx){
            const total = ctx.chart.data.datasets.reduce((s,ds)=>s+(ds.data[ctx.dataIndex]||0),0);
            return total>0 ? Math.round(total) : '';
          },
        },
      },
      scales:{
        x:{ stacked:true, grid:{ display:false }, ticks:{ font:{size:9}, maxRotation:0, callback:function(val){ const l=this.getLabelForValue(val); return l.length>12 ? l.slice(0,12)+'…' : l; } } },
        y:{ stacked:true, ticks:{font:{size:9}} },
      },
      onClick:function(e, elements){
        if(elements.length>0){
          const capName = capNames[elements[0].index];
          const cap = captains[capName];
          if(!cap) return;
          const rows = cap.daily.slice().sort((a,b)=> a.date<b.date ? -1 : a.date>b.date ? 1 : 0);
          let totalNH=0, totalNL=0, totalMW=0;
          const thL='text-align:left;padding:6px 8px;border-bottom:2px solid rgba(0,0,0,0.12);white-space:nowrap;';

  // 矿石类型占比：环形图 + 中心总车次 + 右侧百分比 legend
  function drawOre(totals){
    const sum = totals.nh+totals.nl+totals.mw;
    document.getElementById('donut-total').textContent = fmt(sum);
    const colors = ['hsl(55 24% 49%)','hsl(0 15% 32%)','hsl(70 10% 50%)'];
    const items = [[t('nh'),totals.nh,'st-nh'],[t('nl'),totals.nl,'st-nl'],[t('mw'),totals.mw,'st-mw']];
    document.getElementById('ore-legend').innerHTML = items.map(([lab,v,dummy],i)=>{
      const pct = sum? Math.round(v/sum*100) : 0;
      return '<div class="donut-legend__item"><span class="donut-legend__dot" style="background:'+colors[i]+'"></span>'+lab+'<span class="donut-legend__pct">'+pct+'%</span></div>';
    }).join('');
    newChart('chart-ore', { type:'doughnut', data:{ labels:[t('nh'),t('nl'),t('mw')], datasets:[{ data:[totals.nh,totals.nl,totals.mw], backgroundColor:colors, borderWidth:2, borderColor:'var(--card)' }] },
      options:{ responsive:true, maintainAspectRatio:false, cutout:'62%', plugins:{ legend:{ display:false }, datalabels:{ display:false } } } });
  }

  function empCard(e){

      + '<div class="emp-card__avatar">'+(e.avatar_path?('<img src="'+esc(e.avatar_path)+'">'):esc(initial))+'</div>'
      + '<div class="emp-card__body"><div class="emp-card__name">'+esc(e.name||'')+(e.alias?(' ('+esc(e.alias)+')'):'')+'</div>'

  function renderEmpProfile(e, att, sal){
    // P22 R6/R7: 移动端员工详情不显示薪资内容（全员隐藏，不再依赖部门判断）
    // P18 阶段3: 档案编辑入口统一走 employees:edit
    const canEdit = hasPermission('employees','edit');
    // 出勤统计
    let attDays=0, leaveDays=0, absentDays=0;
    const attRow = att && att.rows ? att.rows.find(r=>r.id===e.id) : null;
    if(attRow && attRow.days){ Object.values(attRow.days).forEach(s=>{ const v=(s||'').toUpperCase(); if(v==='P'||v==='D'||v==='N'||v==='C'||v==='R'||v==='B') attDays++; else if(v==='L') leaveDays++; else if(v==='A') absentDays++; }); }
    const base = STATE.employees.find(x=>x.id===e.id) || {};
    const idTags = [];
    if(e.custom_number) idTags.push('<span class="profile-tag profile-tag--primary">#'+esc(e.custom_number)+'</span>');
    if(e.alias) idTags.push('<span class="profile-tag">'+esc(e.alias)+'</span>');

    let html = '<div class="profile-header"><div class="profile-avatar"'+(e.avatar_path?' onclick="openMobileAvatarPreview()"': '')+'>'+(e.avatar_path?('<img src="'+esc(e.avatar_path)+'">'):esc((e.name||'?').slice(0,1)))+'</div>'
      + '<div class="profile-name">'+esc(e.name||'')+'</div>'
      + (idTags.length?'<div class="profile-id-tags">'+idTags.join('')+'</div>':'')
      + '</div>';
    // 基本信息
    html += '<div class="info-section"><div class="info-section__title">'+t('basic_info')+'</div>';
    const info = [['dept',e.department],['team',base.team||e.team||''],['position',base.position||''],['gender',e.gender],['dob',e.date_of_birth||''],['phone',e.phone],['nida',e.nida_number],['nssf',e.nssf_number],['bank',e.bank_name||'']];
    info.forEach(r=>{ if(r[1]!=null&&r[1]!=='') html+=kv(t(r[0]), r[1]); });
    html += '</div>';
    // 出勤统计 mini 卡
    html += '<div class="info-section"><div class="info-section__title">'+t('att_stats')+'</div>'
      + '<div class="mini-card-row">'
      + '<div class="mini-stat-card"><span class="mini-stat-card__value">'+attDays+'</span><span class="mini-stat-card__label">'+t('att_days')+'</span></div>'
      + '<div class="mini-stat-card"><span class="mini-stat-card__value">'+leaveDays+'</span><span class="mini-stat-card__label">'+t('leave_days')+'</span></div>'
      + '<div class="mini-stat-card"><span class="mini-stat-card__value">'+absentDays+'</span><span class="mini-stat-card__label">'+t('absent_days')+'</span></div>'
      + '</div></div>';
    // 操作
    // P29 V2.1: 请假/加班申请按钮挂 oa:apply(与采集页快捷入口一致,修复无门槛不一致)
    const canApply = hasPermission('oa','apply');
    html += '<div class="profile-actions">'
      + (canApply?'<button class="btn" onclick="openLeave(\''+esc(e.id)+'\')">'+t('leave_apply')+'</button>':'')
      + (canApply?'<button class="btn" onclick="openOvertime(\''+esc(e.id)+'\')">'+t('event_overtime')+'</button>':'')
      + (canEdit?'<button class="btn btn-primary" onclick="openEditEmp(\''+esc(e.id)+'\')">'+t('edit_profile')+'</button>':'')
      + '</div>';
    document.getElementById('emp-detail').innerHTML = html;
  }

  function loadOA(mode){
    const el = document.getElementById('oa-list');
    // P29 V2.1: OA 列表对 oa:view 或 oa:apply 开放;仅 apply 时由后端(T4)过滤为本人提交
    if(!(hasPermission('oa','view') || hasPermission('oa','apply'))){
      el.innerHTML='<div class="state-box"><div class="state-box__icon">🔒</div><div class="state-box__title">'+t('need_editor')+'</div></div>';
      return;
    }
    el.innerHTML='<div class="skeleton-card kpi"></div><div class="skeleton-card kpi"></div>';
    // OA 重设计 R1: mine 段走 history?mine=1（仅 oa:apply 可见，后端强制本人数据）
    const url = mode==='history' ? '/api/oa/history' : (mode==='mine' ? '/api/oa/history?mine=1' : '/api/oa/pending');
    api(url).then(d=>{
      const evs = d.events||[];
      STATE._oaEvents = evs;
      if(mode==='pending'){ const badge=document.getElementById('oa-pending-n'); if(badge){ badge.textContent=evs.length; badge.style.display=evs.length>0?'inline-flex':'none'; } }
      if(!evs.length){
        const emptyKey = mode==='history' ? 'oa_done_desc' : (mode==='mine' ? 'oa_mine_empty' : 'no_oa');
        el.innerHTML='<div class="state-box"><div class="state-box__icon">✅</div><div class="state-box__title">'+t(emptyKey)+'</div></div>';
        return;
      }
      el.innerHTML = evs.map(ev=>oaCard(ev, mode)).join('');
    }).catch(()=>{ el.innerHTML='<div class="state-box"><div class="state-box__icon">⚠️</div><div class="state-box__title">'+t('load_fail')+'</div><button class="state-box__action" onclick="loadOA(\''+mode+'\')">'+t('retry')+'</button></div>'; });
  }
  function oaCard(ev, mode){
    const typeMap = { hire:t('oa_hire'), transfer:t('oa_transfer'), dismiss:t('oa_dismiss'), resign:t('oa_resign'), leave:t('oa_leave'), salary_change:t('oa_salary'), overtime:t('event_overtime') };
    let summary='';
    try { const p = JSON.parse(ev.payload||'{}'); summary = p.note || (p.days? (p.days+' '+t('days')) : (p.new_position? t('oa_transfer')+': '+p.new_position : '')); if (ev.event_type==='salary_change' && p.salary_type) { summary = t('oa_salary')+': '+(p.old_type? p.old_type+' → ':'')+p.salary_type; } } catch(e){}
    // C3/C4: 点击整张卡片弹出预览（sheet）
    let html = '<div class="oa-card" onclick="oaPreview('+ev.id+',\''+mode+'\')">'
      + '<div class="oa-card__head"><span class="oa-card__type">'+esc(typeMap[ev.event_type]||ev.event_type)+'</span><span class="oa-card__emp">'+esc(ev.employee_name||ev.employee_id)+'</span></div>'
      + (summary?'<div class="oa-card__desc">'+esc(summary)+'</div>':'')
      + '<div class="oa-card__date">'+esc(ev.effective_date||'')+'</div>'
      + '<div class="oa-card__date">'+t('oa_submitter')+': '+esc(ev.operator_id||'—')+'</div>';
    if(mode==='pending'){
      if(hasPermission('oa','approve')){
        html += '<div class="oa-card__actions"><button class="btn btn-primary" onclick="event.stopPropagation();approveOA('+ev.id+')">'+t('approve')+'</button><button class="btn" onclick="event.stopPropagation();openRejectModal('+ev.id+',\''+esc(ev.employee_name||'')+'\')">'+t('reject')+'</button></div>';
      } else {
        html += '<div class="oa-card__desc" style="margin-top:6px;color:var(--muted-foreground);font-size:12px;">'+t('oa_pending_own_hint')+'</div>';
      }
    } else {
      const st = ev.status==='approved';
      html += '<div class="oa-card__desc" style="margin-top:6px;"><span class="oa-status-badge '+(st?'approved':'rejected')+'">'+(st?t('approved'):t('rejected'))+'</span>'+(ev.reject_reason?(' <span style="color:var(--muted-foreground);">'+esc(ev.reject_reason)+'</span>'):'')+'</div>';
      // C5: 审批历史卡片显示审批人 + 审批时间
      html += '<div class="oa-card__date" style="margin-top:4px;">'+t('oa_approver')+': '+esc(ev.approved_by||ev.rejected_by||'—')+' · '+t('oa_approved_at')+': '+esc(String(ev.updated_at||'').slice(0,16))+'</div>';

  function renderColHistoryList(){
    const el=document.getElementById('col-recent'); if(!el) return;
    if(!STATE._colHisFilter) renderColHisFilter();
    const f=STATE._colHisFilter;
    let qs='/api/collection/history';
    const params=[];
    if(f.date) params.push('date='+encodeURIComponent(f.date));
    if(f.mine) params.push('operator='+encodeURIComponent((STATE.auth||{}).username||''));
    if(params.length) qs += '?'+params.join('&');
    apiStatus(qs).then(async ({status,json})=>{
      STATE._colSubs = json.submissions || [];
      let list = STATE._colSubs;
      if(f.dept) list = list.filter(s=>(s.department||'')===f.dept);
      const PAGE=10;
      const shown=list.slice(0,(f.page||1)*PAGE);
      const subs=shown;
      try{ STATE._dismissedIds = new Set((json.dismissed_ids||[]).map(String)); }catch(e){ STATE._dismissedIds = new Set(); }
      if(status===403){ el.innerHTML='<div class="history-row"><span class="history-row__date">'+t('need_editor')+'</span></div>'; return; }
      if(status!==200){ el.innerHTML='<div class="history-row"><span class="history-row__date">'+t('load_fail')+'</span></div>'; return; }
      await _mobUgGroups();
      const deptSig=[...new Set((json.submissions||[]).map(s=>s.department||'').filter(Boolean))].sort().join('|');
      if(f._deptSig!==deptSig){ f._deptSig=deptSig; renderColHisFilter(); }
      const typeShort = { underground:['t-ug',t('col_t_ug')], driller:['t-dr',t('col_t_dr')], crush:['t-cr',t('col_t_cr')], attendance:['t-att',t('col_t_att')] };
      el.innerHTML = subs.length? subs.map(s=>{
        let p={}; try{ p=JSON.parse(s.payload||'{}'); }catch(e){}
        const dept = s.department || (p.department||'');
        const isUG = _mobNormDept(dept)==='PRODUCTIONTEAM(UNDERGROUND)';
        const ts = typeShort[s.form_type]||['t-att',s.form_type];
        const dShort = esc((s.submission_date||'').slice(5));
        let shiftChip='', count='', placeHTML='', opNote='';
        try{
          if(s.form_type==='underground'){
            if(Array.isArray(p.teams)){
              count = (p.teams||[]).length+' '+t('col_ug_team_row');

  async function toggleColExempt(submissionId, teamOrShift, isOldFormat, currentExempt){
    if(!isSuperAdmin()){ toast(t('need_super_admin')||'need super admin','error'); return; }
    if(!currentExempt){
      if(!confirm(t('col_ug_exempt_confirm_set'))) return;
    } else {
      if(!confirm(t('col_ug_exempt_confirm_unset'))) return;
    }
    const newVal=!currentExempt;
    const body = isOldFormat ? {shift:String(teamOrShift), exempt:newVal} : {team_id:parseInt(teamOrShift,10), exempt:newVal};
    try{
      const res = await apiStatus('/api/collection/exempt/'+submissionId, {method:'POST', body:JSON.stringify(body)});
      const j=res.json;
      if(res.status===200 && j.ok){
        toast(t('saved'));
        closeSheet();
        renderColHistoryList();
        // also refresh detail if needed - re-open detail with updated payload
        const upd = (STATE._colSubs||[]).find(x=>String(x.id)===String(submissionId));
        if(upd){
          // optimistically bump version and payload in local cache
          try{ const pl=JSON.parse(upd.payload||'{}'); if(isOldFormat){ const sh=String(teamOrShift); if(pl[sh]) pl[sh].exempt=newVal; upd.payload=JSON.stringify(pl);} else { (pl.teams||[]).forEach(tm=>{ if(String(tm.team_id)===String(teamOrShift)) tm.exempt=newVal; }); upd.payload=JSON.stringify(pl);} }catch(e){}
          upd.version=j.version||((upd.version||1)+1);
        }
      } else {
        toast((j&&j.error)||t('fail'),'error');
      }
    }catch(e){ toast(t('fail'),'error'); }
  }

    const s=(STATE._colSubs||[]).find(x=>x.id===id);
    let pp={}; try{ pp = s ? JSON.parse(s.payload||'{}') : {}; }catch(e){}

    p.submission_date = s ? (s.submission_date || '') : '';
    openColForm(ty, p);
  }

  // form-message 内联校验 + 提交 loading 态
  function showFormMsg(ty, msg, ok){
    const el=document.getElementById('colFormMsg');

    el.textContent = msg||'';

  function clearFormMsg(){ const el=document.getElementById('colFormMsg'); if(el){ el.textContent=''; el.className='form-message'; } }
  function colSubmit(ty, payload, validate){
    const date=document.getElementById('colDate').value;
    if(!date){ showFormMsg(ty, t('val_date'), false); return; }
    if(validate && !validate(payload)) return;
    const btn = document.getElementById('colSubmitBtn');
    if(btn){ btn.disabled=true; btn.textContent=t('submitting'); }
    const editing = STATE._colEditing && STATE._colEditing.ty===ty ? STATE._colEditing : null;
    const req = editing
      ? api('/api/collection/edit/'+editing.id, { method:'POST', body: JSON.stringify({ payload, submission_date:date }) })
      : api('/api/collection/submit', { method:'POST', body: JSON.stringify({ form_type:ty, submission_date:date, payload }) });
    req.then(r=>{
      if(r.ok){
        STATE._colEditing=null;
        // T 幂等跳过提示（拼接进成功消息，避免覆盖）
        const tSkipMsg=(ty==='attendance' && r.t_skipped && r.t_skipped.length)?' · '+t('col_t_skipped_n').replace('{n}', r.t_skipped.length):'';
        if(ty==='attendance' && (r.oa_created||r.oa_skipped)){
          const oaN=(r.oa_created||[]).length, skN=(r.oa_skipped||[]).length;
          if(oaN) showFormMsg(ty, oaN+' '+t('col_att_oa_created')+tSkipMsg, true);
          else if(skN) showFormMsg(ty, skN+' pending'+tSkipMsg, true);
          else showFormMsg(ty, t(editing?'col_updated':'success')+tSkipMsg, true);
          setTimeout(()=>{ backColHome(); }, 900);
        } else if(r.discarded){ showFormMsg(ty, t('col_discarded_some',{n:r.discarded}), false); setTimeout(()=>{ backColHome(); }, 1600); }
        else { showFormMsg(ty, t(editing?'col_updated':'success')+tSkipMsg, true); setTimeout(()=>{ backColHome(); }, 500); }
      }
      else { showFormMsg(ty, r.error||t('fail'), false); if(btn){ btn.disabled=false; btn.textContent=t('submit'); } }
    }).catch(()=>{ showFormMsg(ty, t('fail'), false); if(btn){ btn.disabled=false; btn.textContent=t('submit'); } });
  }

  function refreshUgDrivers(seg){
    const empIds = ck(seg+'Emps');
    const cand = STATE.employees.filter(e=>empIds.includes(e.id));
    const prev = ck(seg+'Drivers').filter(id=>empIds.includes(id)); // 保留仍合法的已选
    document.getElementById(seg+'Drivers').value = prev.join(',');
    const cnt = document.getElementById(seg+'Drv-count'); if(cnt) cnt.textContent = t('col_selected_count',{n:prev.length});
    document.getElementById(seg+'DriversBox').innerHTML = empChecklistHTML(seg+'Drivers', prev, seg+'Drv', cand);
  }
  function onUgTeamChange(seg){
    const sel=document.getElementById(seg+'Team');
    const tid=sel?sel.value:'';
    const cur=ck(seg+'Emps');
    if(!tid){
      // 未选班组 → 显示全部 UG 部门，不清除已选
      const box=document.getElementById(seg+'EmpsBox');
      if(box) box.innerHTML=empChecklistHTML(seg+'Emps',cur,seg,deptPool('underground'));
      return;
    }
    // 过滤: 保留仍属于新班组的已选成员
    const keep=cur.filter(id=>{
      const emp=STATE.employees.find(e=>String(e.id)===String(id));
      return emp&&String(emp.team_id)===String(tid);
    });
    document.getElementById(seg+'Emps').value=keep.join(',');
    const pool=deptPool('underground',tid);
    const box=document.getElementById(seg+'EmpsBox');
    if(box) box.innerHTML=empChecklistHTML(seg+'Emps',keep,seg,pool);
    const cnt=document.getElementById(seg+'-count');
    if(cnt) cnt.textContent=t('col_selected_count',{n:keep.length});
    refreshUgDrivers(seg);
  }
  function submitUg(){
    if(STATE._ugIsOld){
      const payload={ submission_date:document.getElementById('colDate').value,
        day:{ nh:+document.getElementById('ugDayNh').value||0, nl:+document.getElementById('ugDayNl').value||0, mw:+document.getElementById('ugDayMw').value||0, emps:ck('ugDayEmps'), drivers:ck('ugDayDrivers'),
          team_id:+(document.getElementById('ugDayTeam')&&document.getElementById('ugDayTeam').value)||0,
          exempt:document.getElementById('ugDayExempt')&&document.getElementById('ugDayExempt').checked },
        night:{ nh:+document.getElementById('ugNightNh').value||0, nl:+document.getElementById('ugNightNl').value||0, mw:+document.getElementById('ugNightMw').value||0, emps:ck('ugNightEmps'), drivers:ck('ugNightDrivers'),
          team_id:+(document.getElementById('ugNightTeam')&&document.getElementById('ugNightTeam').value)||0,
          exempt:document.getElementById('ugNightExempt')&&document.getElementById('ugNightExempt').checked } };
      colSubmit('underground', payload, (p)=>{
        if(p.day.emps.length===0 && p.night.emps.length===0){ showFormMsg('underground', t('val_workers'), false); return false; }
        if((p.day.emps.length>0 && !p.day.team_id) || (p.night.emps.length>0 && !p.night.team_id)){ showFormMsg('underground', t('col_ug_team_required'), false); return false; }
        const chkTeam=(emps,tid)=>{
          if(!tid) return true;
          return emps.every(id=>{const emp=STATE.employees.find(e=>String(e.id)===String(id));return emp&&String(emp.team_id)===String(tid);});
        };
        if(!chkTeam(p.day.emps,p.day.team_id)){ showFormMsg('underground', t('col_emp_not_in_team'), false); return false; }
        if(!chkTeam(p.night.emps,p.night.team_id)){ showFormMsg('underground', t('col_emp_not_in_team'), false); return false; }
        return true;
      });
      return;
    }
    // C1 new format
    syncUgTeamsFromDom();
    const teams = (STATE._ugTeams||[]).map(r=>({team_id: r.team_id?parseInt(r.team_id,10):0, nh:+r.nh||0, nl:+r.nl||0, mw:+r.mw||0, exempt:!!r.exempt, remark:String(r.remark||'').trim()}));
    const payload={ teams };
    colSubmit('underground', payload, (p)=>{
      const ts = p.teams||[];
      if(!ts.length){ showFormMsg('underground', t('col_ug_team_row'), false); return false; }
      const hasProd = ts.some(t=> (t.nh||0)+(t.nl||0)+(t.mw||0) > 0);
      if(!hasProd){ showFormMsg('underground', t('col_ug_no_attendance_warn'), false); return false; }
      for(const tt of ts){
        const prod=(tt.nh||0)+(tt.nl||0)+(tt.mw||0);
        if(prod>0 && !tt.team_id){ showFormMsg('underground', t('col_ug_team_required'), false); return false; }
      }
      const seen=new Set();
      for(const tt of ts){
        if(tt.team_id){
          if(seen.has(String(tt.team_id))){ showFormMsg('underground', t('col_ug_team_row')+': duplicate', false); return false; }
          seen.add(String(tt.team_id));
        }
      }
      return true;
    });
  }

  // 出勤收集（需求5: 仅"其他"部门 — 除井下/钻工/破碎/分拣; C3: UG属单独分支带 team_id+drivers）
  // P32: 当日已批假期排除（NU/T/SK/L 已审批通过）——不显示、不提交
  let _mobAttLeave = {}; // {date: {employee_id: {status, origin}}}——当天已批假人员（origin: oa=OA审批锁定 / collection=采集直批可改）
  async function refreshMobAttLeave(dateStr){
    if(!dateStr) return;
    try{
      const r = await api('/api/collection/roster?date='+encodeURIComponent(dateStr));
      const m={};
      ((r&&r.employees)||[]).forEach(e=>{ if(e.approved_leave) m[String(e.id)] = {status: e.approved_leave_status || 'L', origin: e.leave_origin || 'oa'}; });
      _mobAttLeave[dateStr] = m;
    }catch(e){}
  }
  function mobAttLeaveStatus(dateStr, eid){
    if(!dateStr) return '';
    const s=_mobAttLeave[dateStr];
    const v = (s && String(eid) in s) ? s[String(eid)] : '';
    return v ? (typeof v==='object' ? v.status : v) : '';
  }
  function mobAttLeaveLocked(dateStr, eid){
    if(!dateStr) return false;
    const s=_mobAttLeave[dateStr];
    const v = (s && String(eid) in s) ? s[String(eid)] : null;
    if(!v) return false;
    const st = typeof v==='object' ? v.status : v;
    const og = typeof v==='object' ? (v.origin||'oa') : 'oa';
    // collection 直批的 T 可由采集员改回（改回退余额），其余一律锁定
    return !(st==='T' && og==='collection');
  }

  function submitAtt(){ const date=document.getElementById('colDate').value; if(!date){ showFormMsg('attendance', t('val_date'), false); return; }
    const deptEl=document.getElementById('attColDept');
    if(!deptEl || !deptEl.value){ showFormMsg('attendance', t('col_att_need_dept'), false); return; }
    const UG_DEPT='Production TEAM （underground）';
    const isUg = deptEl.value===UG_DEPT;
    if(isUg && !document.getElementById('attTeamSel').value){ showFormMsg('attendance', t('col_att_ug_pick_team'), false); return; }
    const list=attRosterEmpIds();
    // B→P 兜底: 若状态为 B 则转 P；当天已批假者无状态选择器，跳过
    const marks=list.filter(e=>!mobAttLeaveLocked(date,String(e.id))).map(e=>{ let st=document.getElementById('attSt'+e.id).value; if(st==='B') st='P'; return {employee_id:e.id, status:st}; });
    // 出勤状态不允许留空：每位员工必须手动选择（可先用全P/全A批量）
    for(const m of marks){ if(!m.status){ showFormMsg('attendance', t('att_need_status'), false); return; } }
    // 编辑保数据: 同 team 的原 marks 保底（UG 仅同 team）
    const submitted=new Set(marks.map(m=>String(m.employee_id)));
    Object.entries(STATE._attEditMarks||{}).forEach(([eid,st])=>{
      if(!submitted.has(String(eid))){
        // 当日已批假期（OA 来源）——编辑合并同样跳过；collection 直批 T 允许被新值覆盖
        if(mobAttLeaveLocked(date,String(eid))) return;
        // UG 时校验是否属于当前 team
        if(isUg){
          const tid=document.getElementById('attTeamSel').value;
          const emp=(STATE.employees||[]).find(x=>String(x.id)===String(eid));
          if(emp && String(emp.team_id)!==String(tid)) return;
        }
        let s=st; if(s==='B') s='P';
        submitted.add(String(eid)); marks.push({employee_id:eid, status:s});
      }
    });
    if(isUg){
      const team_id=parseInt(document.getElementById('attTeamSel').value,10)||0;
      const drivers=list.filter(e=>{ const cb=document.getElementById('attDrv'+e.id); return cb && cb.checked; }).map(e=>String(e.id));
      colSubmit('attendance', { submission_date:date, department:deptEl.value, team_id, marks, drivers }, null);
    } else {
      colSubmit('attendance', { submission_date:date, marks, department:deptEl.value }, null);
    } }

  // 出勤卡：左固定 74px 信息栏 + 右 28px 圆形状态格横向滚动
  // 移动端出勤网格为只读视图：任何人（含 KEJU）不可在网格直接修改出勤，
  // 修改请走桌面端出勤网格或采集表单提交
  function renderAttGrid(){
    const d=STATE.attendance; if(!d) return;
    const q=(document.getElementById('attSearch').value||'').toLowerCase().trim();
    const dept=document.getElementById('attDept').value;
    const today=new Date().toISOString().slice(0,10);
    // 需求4: 与员工列表一致,按姓名排序(localeCompare 中文/英文均可)
    // P19: 支持别名匹配(attendance rows 可能无 alias,从员工缓存关联)
    const _aliasMap={}; (STATE.employees||[]).forEach(_e=>{ _aliasMap[String(_e.id)]=(_e.alias||'').toLowerCase(); });
    const allRows=(d.rows||[]).filter(r=>(!dept||r.department===dept)&&(!q||(r.name||'').toLowerCase().includes(q)||String(r.id).toLowerCase().includes(q)||String(r.custom_number||'').includes(q)||((r.alias||_aliasMap[String(r.id)]||'').toLowerCase().includes(q)))).sort((a,b)=>(a.name||'').localeCompare(b.name||''));

  function _mobOtWindow(){
    const t0=new Date(); t0.setHours(0,0,0,0);
    const lo=new Date(t0); lo.setDate(lo.getDate()-2);
    const hi=new Date(t0); hi.setDate(hi.getDate()+2);
    const f=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

  function calcMobOtHours(){
    const st=document.getElementById('ot-start').value, et=document.getElementById('ot-end').value;
    const out=document.getElementById('ot-hours');
    if(!st||!et){ out.value=''; return; }
    const [sh,sm]=st.split(':').map(Number), [eh,em]=et.split(':').map(Number);
    let diff=(eh*60+em)-(sh*60+sm); if(diff<0) diff+=24*60;
    const h=diff/60;
    if(h<=0||h>12){ out.value=''; return; }
    out.value=(Math.floor(h*2)/2).toFixed(1);
  }

    api('/api/oa/events',{ method:'POST', body:JSON.stringify({event_type:'overtime', employee_id:empId, effective_date:date, lang:(STATE.lang||'zh'), payload:{date, start_time:st, end_time:et, hours, note}}) }).then(r=>{

      '<div class="field"><label class="field__label">'+t('emp_list')+'</label><select id="oaDmEid">'+opts+'</select></div>'
      + '<div class="field"><label class="field__label">'+t('emp_effective_date')+'</label><input type="date" id="oaDmDate"></div>'
      + '<div class="field"><label class="field__label">'+t('reason')+'</label><textarea id="oaDmReason" rows="3"></textarea></div>'
      + '<button class="btn btn-primary btn-block" onclick="submitDismissApply()">'+t('submit')+'</button>');
    openSheet(t('emp_apply_dismiss'), document.getElementById('sheet-body'));
  }
  function submitDismissApply(){
    const eid=document.getElementById('oaDmEid').value, date=document.getElementById('oaDmDate').value;
    if(!eid||!date){ oaFormMsg(false, t('pick_emp_date')); return; }
    api('/api/oa/events', { method:'POST', body: JSON.stringify({ event_type:'dismiss', employee_id:eid, effective_date:date, payload:{ reason:document.getElementById('oaDmReason').value.trim() } }) }).then(r=>{
      if(r.ok){ toast(t('submitted')); closeSheet(); } else oaFormMsg(false, r.error||t('fail'));
    }).catch(()=>oaFormMsg(false, t('fail')));
  }

  // ── 启动 ──
  applyTheme();
  applyLang();
  checkAuth();
  </script>
</body>
</html>
